<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Petición Incorrecta (400)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff3cd; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 500px; padding: 40px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 80px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🤔</div>
        <h1 class="fw-bold text-warning">Error 400</h1>
        <h3 class="mb-3">Solicitud Incorrecta</h3>
        <p class="text-muted">El servidor no ha entendido tu petición. Es posible que la dirección URL esté mal escrita o falten datos.</p>
        <div class="mt-4">
            <a href="/" class="btn btn-warning text-white rounded-pill px-4 fw-bold shadow-sm">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
