<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error Inesperado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 500px; padding: 40px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 80px; margin-bottom: 20px; color: #6c757d; }
        .error-code { font-size: 4rem; font-weight: 800; color: #343a40; line-height: 1; margin-bottom: 0.5rem;}
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚠️</div>
        
        <h1 class="error-code" th:text="${status}">Error</h1>
        
        <h3 class="mb-3 text-secondary" th:text="${error}">Algo ha ocurrido</h3>
        
        <p class="text-muted">
            Ha ocurrido una situación inesperada.
            <br th:if="${message}">
            <span th:if="${message}" th:text="${message}" class="fst-italic small"></span>
        </p>

        <div class="mt-4">
            <a href="/" class="btn btn-dark rounded-pill px-4 shadow-sm">Volver al Inicio</a>
        </div>
        
        <div class="mt-3 text-muted small">
            <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
        </div>
    </div>
</body>
</html>
