<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Confirmar Desactivación de Rol</title>
</head>
<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0 text-center" style="border-radius: 20px;">
                        <div class="card-body p-5">
                            <div class="mb-4">
                                <i class="bi bi-shield-slash text-danger" style="font-size: 4rem;"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-3">¿Desactivar Rol?</h3>
                            <p class="text-muted mb-4">
                                Estás a punto de desactivar el perfil: <br>
                                <strong class="text-dark" th:text="${rol.nombre}">Nombre del Rol</strong>.
                                <br>Los usuarios con este rol podrían perder el acceso a ciertas funciones.
                            </p>
                            <form th:action="@{/roles/desactivar}" method="post">
                                <input type="hidden" name="id" th:value="${rol.id}" />
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold shadow-sm">
                                        Confirmar Desactivación
                                    </button>
                                    <a th:href="@{/roles/listar}" class="btn btn-light btn-lg rounded-pill fw-bold border">
                                        Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
