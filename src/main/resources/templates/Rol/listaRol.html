<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.admin.roles.titulo')}">Gestión de Roles</title>
    
    <style>
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clickable-row:hover {
            background-color: rgba(0, 123, 255, 0.05) !important;
        }

        .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .select-paginacion-clean {
            width: 75px;
            padding: 0.375rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
    </style>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.admin.roles.titulo')}">Gestión de Roles</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('roles.lista.subtitulo')}">Control de permisos y accesos.</p>
                </div>
                <a th:href="@{/admin/roles/nuevo}" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold">
                    <i class="bi bi-shield-plus me-2"></i>
                    <span th:text="${trad.getTraduccion('rol.crear')}">Nuevo Rol</span>
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                            th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                <div class="card-body p-0" id="tablaContainer">
                    
                    <div th:fragment="tablaRoles">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4 py-3 border-0 text-secondary small fw-bold"
                                            th:text="${trad.getTraduccion('roles.desactivar.info.nombre')}">NOMBRE</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold"
                                            th:text="${trad.getTraduccion('roles.desactivar.info.desc')}">DESCRIPCIÓN</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold"
                                            th:text="${trad.getTraduccion('roles.tabla.estado')}">ESTADO</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold text-center"
                                            th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="r : ${roles}" 
                                        class="clickable-row"
                                        th:data-url="@{'/admin/roles/editar/' + ${r.id}}"
                                        onclick="rowClick(this, event)">
                                        
                                        <td class="ps-4 py-3 fw-bold text-dark" th:text="${r.nombre}"></td>
                                        <td class="py-3 text-muted small" th:text="${r.descripcion}"></td>
                                        <td class="py-3">
                                            <span th:if="${r.activo}"
                                                class="badge rounded-pill bg-success-subtle text-success px-3 py-2"
                                                th:text="${trad.getTraduccion('roles.estado.activo')}">Activo</span>
                                            <span th:if="${!r.activo}"
                                                class="badge rounded-pill bg-light text-secondary px-3 py-2"
                                                th:text="${trad.getTraduccion('roles.estado.inactivo')}">Inactivo</span>
                                        </td>
                                        <td class="py-3 text-center">
                                            <a th:if="${r.activo}"
                                                th:href="@{'/admin/roles/confirmarDesactivar/' + ${r.id}}"
                                                class="btn btn-sm btn-outline-danger rounded-pill px-3"
                                                onclick="event.stopPropagation();">
                                                <i class="bi bi-toggle-on me-1"></i>
                                                <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}">Desactivar</span>
                                            </a>
                                            <a th:if="${!r.activo}" th:href="@{'/admin/roles/activar/' + ${r.id}}"
                                                class="btn btn-sm btn-outline-success rounded-pill px-3"
                                                onclick="event.stopPropagation();">
                                                <i class="bi bi-toggle-off me-1"></i>
                                                <span th:text="${trad.getTraduccion('pacientes.btn.activar')}">Activar</span>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${roles == null or roles.empty}">
                                        <td colspan="4" class="text-center py-5 text-muted"
                                            th:text="${trad.getTraduccion('roles.vacio')}">No se encontraron roles.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-3 d-flex justify-content-between align-items-center border-top">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('tabla.info.mostrando')}">Mostrando</span>
                                <span class="fw-bold" th:text="${roles.size()}">0</span>
                                <span th:text="${trad.getTraduccion('tabla.info.de')}">de</span>
                                <span class="fw-bold" th:text="${totalElements}">0</span>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <select id="pageSize" class="select-paginacion-clean shadow-none"
                                    onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                    <option value="50" th:selected="${size == 50}">50</option>
                                </select>
                                <nav>
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)"
                                                th:onclick="'changePage(' + (${currentPage} - 1) + ')'">
                                                <i class="bi bi-chevron-left"></i>
                                            </a>
                                        </li>
                                        <li class="page-item active">
                                            <a class="page-link" th:text="${currentPage + 1}">1</a>
                                        </li>
                                        <li class="page-item"
                                            th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)"
                                                th:onclick="'changePage(' + (${currentPage} + 1) + ')'">
                                                <i class="bi bi-chevron-right"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div> </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        // 1. Función de navegación al hacer clic en la fila
        function rowClick(rowElement, event) {
            // Verificamos que el clic no sea en un enlace o icono (botones de activar/desactivar)
            if (event.target.closest('a') || event.target.closest('button') || event.target.closest('i')) {
                return;
            }
            const url = rowElement.getAttribute("data-url");
            if (url) window.location.href = url;
        }

        // 2. Inicialización del buscador
        document.addEventListener("DOMContentLoaded", () => {
            let timeout;
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => updateTable(0), 400);
                });
            }
        });

        // 3. Función para actualizar la tabla (AJAX)
        function updateTable(page) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize') ? document.getElementById('pageSize').value : 10;
            
            fetch(`/admin/roles/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`)
                .then(res => res.text())
                .then(html => {
                    document.getElementById('tablaContainer').innerHTML = html;
                    // No hace falta re-inicializar listeners porque usamos onclick="" en el HTML
                })
                .catch(err => console.error("Error al filtrar roles:", err));
        }

        // 4. Navegación de páginas
        function changePage(page) {
            const totalPagesElem = document.getElementById('hiddenTotalPages');
            const total = totalPagesElem ? parseInt(totalPagesElem.value) : 0;
            if (page >= 0 && page < total) updateTable(page);
        }
    </script>
</body>

</html>
