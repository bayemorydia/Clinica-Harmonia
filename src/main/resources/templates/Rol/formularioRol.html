<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${rol.id == null ? trad.getTraduccion('rol.crear') : trad.getTraduccion('rol.editar')}"></title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm p-4" style="border-radius: 15px;">
                        <h4 class="fw-bold mb-4"
                            th:text="${rol.id == null ? trad.getTraduccion('rol.crear') : trad.getTraduccion('rol.editar')}">
                        </h4>

                        <div th:if="${error}"
                            class="alert alert-danger border-0 shadow-sm rounded-3 d-flex align-items-center"
                            role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div th:text="${error}">Mensaje de error</div>
                        </div>

                        <form th:action="@{/admin/roles/guardar}" th:object="${rol}" method="POST">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted text-uppercase"
                                    th:text="${trad.getTraduccion('rol.nombre')}">Nombre</label>
                                <input type="text" th:field="*{nombre}" th:classappend="${error} ? 'is-invalid' : ''"
                                    class="form-control rounded-3" placeholder="EJ: ADMINISTRADOR" required />
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted text-uppercase"
                                    th:text="${trad.getTraduccion('rol.descripcion')}">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control rounded-3" rows="3"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                                    <i class="bi bi-save me-2"></i>
                                    <span th:text="${trad.getTraduccion('btn.guardar')}">Guardar</span>
                                </button>
                                <a th:href="@{/admin/roles}" class="btn btn-light rounded-pill px-4 fw-bold"
                                    th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
