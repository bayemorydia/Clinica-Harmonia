<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${rol.id == null ? trad.getTraduccion('roles.form.titulo.nuevo') : trad.getTraduccion('roles.form.titulo.editar')}">Formulario Rol</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .glass-card {
            background: var(--surface-color);
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-label-custom {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-control-custom {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
            background-color: #fcfcfc;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }

        .role-icon-container {
            width: 80px;
            height: 80px;
            background: #e9ecef;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .btn-pill {
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-pill:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-5">
        <div class="container">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-pill px-4 border-0 shadow-sm mb-4">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                <span th:text="${error}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="row g-4 justify-content-center">

                    <div class="col-lg-7">
                        <div class="glass-card p-4 p-md-5">
                            
                            <div class="mb-4">
                                <h5 class="fw-bold text-dark d-flex align-items-center">
                                    <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3 text-primary">
                                        <i class="bi bi-info-circle"></i>
                                    </span>
                                    <span th:text="${trad.getTraduccion('roles.form.info.titulo')}">Información del Rol</span>
                                </h5>
                            </div>

                            <div class="row g-4">
                                <div class="col-12">
                                    <label class="form-label-custom" th:text="${trad.getTraduccion('roles.form.label.nombre')}">Identificador del Rol</label>
                                    <input type="text" th:field="*{nombre}" class="form-control form-control-custom"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                                           placeholder="Ej: ROLE_ADMIN">
                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label-custom" th:text="${trad.getTraduccion('roles.form.label.desc')}">Descripción de Funciones</label>
                                    <textarea th:field="*{descripcion}" class="form-control form-control-custom" rows="4"
                                              th:placeholder="${trad.getTraduccion('roles.form.placeholder.desc')}"></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-5">
                                <a th:href="@{/roles/listar}" class="btn btn-light btn-pill text-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>
                                    <span th:text="${trad.getTraduccion('btn.volver')}">Volver</span>
                                </a>
                                <button type="submit" class="btn btn-primary btn-pill shadow-sm">
                                    <i class="bi bi-check2-circle me-2"></i>
                                    <span th:text="${trad.getTraduccion('btn.guardar')}">Guardar Cambios</span>
                                </button>
                            </div>

                        </div>
                    </div>

                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
