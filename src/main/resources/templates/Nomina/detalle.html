<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${empleado.nombre + ' ' + empleado.apellidos}">Detalle Empleado</title>

    <style>
        /* Paginación y estilos generales */
        .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #dee2e6;
        }

        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .table-footer {
            padding: 1.25rem 1.5rem;
            background-color: #ffffff;
            border-top: 1px solid #edf2f7;
        }

        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clickable-row:hover {
            background-color: rgba(0, 123, 255, 0.05) !important;
        }
    </style>
</head>

<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid py-4">

        <!-- ALERTA ERROR -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- BREADCRUMB -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/empleados}">Empleados</a>
                </li>
                <li class="breadcrumb-item active">Detalle</li>
            </ol>
        </nav>

        <div class="row g-4">

            <!-- INFO EMPLEADO -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-primary py-4 border-0"></div>
                    <div class="card-body text-center position-relative" style="margin-top:-50px;">
                        <!-- Avatar -->
                        <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                             style="width:100px;height:100px;border:5px solid white;">
                            <h1 class="mb-0 fw-bold text-primary"
                                th:text="${#strings.substring(empleado.nombre,0,1)}">E</h1>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${empleado.nombre + ' ' + empleado.apellidos}">
                            Nombre Apellido
                        </h4>
                        <p class="text-muted small mb-4" th:text="${empleado.email}">email@ejemplo.com</p>

                        <!-- Usuario -->
                        <div th:if="${empleado.usuario != null}" class="mb-4 p-2 rounded-3 bg-light border">
                            <div class="fw-bold small text-uppercase text-muted mb-1">
                                Usuario de acceso
                            </div>
                            <div class="text-primary fw-bold">
                                <i class="bi bi-person-badge-fill me-2"></i>
                                <span th:text="${empleado.usuario.username}"></span>
                            </div>
                        </div>

                        <!-- Estado -->
                        <div th:if="${empleado.activa}" class="text-success fw-bold">
                            <i class="bi bi-circle-fill me-1 small"></i> Activo
                        </div>
                        <div th:unless="${empleado.activa}" class="text-danger fw-bold">
                            <i class="bi bi-circle-fill me-1 small"></i> Inactivo
                        </div>
                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <small class="text-muted">
                            Fecha alta:
                            <span class="fw-bold"
                                  th:text="${empleado.fecha_alta != null ? #temporals.format(empleado.fecha_alta,'dd/MM/yyyy') : '-'}">
                            </span>
                        </small>
                    </div>
                </div>
            </div>

            <!-- DETALLE + NÓMINAS -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- DATOS EMPLEADO -->
                        <form th:object="${empleado}">
                            <fieldset disabled>
                                <div class="row g-3">
                                    <!-- Campos de empleado -->
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nombre</label>
                                        <input th:field="*{nombre}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Apellidos</label>
                                        <input th:field="*{apellidos}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">DNI / NIE</label>
                                        <input th:field="*{dni}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Teléfono</label>
                                        <input th:field="*{telefono}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Email</label>
                                        <input th:field="*{email}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Departamento</label>
                                        <input th:field="*{departamento}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Rol</label>
                                        <input class="form-control rounded-3 bg-light"
                                               th:value="${empleado.rol != null ? empleado.rol.nombre : '-'}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Salario Base</label>
                                        <input th:field="*{salarioBase}" class="form-control rounded-3 bg-light">
                                    </div>
                                </div>
                            </fieldset>
                        </form>

                        <!-- NUEVA NÓMINA -->
                        <div class="text-end mt-4">
                            <a th:href="@{/nominas/nuevo/{id}(id=${empleado.id})}"
                               class="btn btn-primary rounded-pill px-4 fw-bold">
                                Nueva Nómina
                            </a>
                        </div>

                        <!-- TABLA NÓMINAS CON PAGINACIÓN -->
                        <div class="mt-5">
                            <input type="hidden" id="hiddenTotalPagesNominas" th:value="${totalPages}">

                            <div id="tablaNominasContainer">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="bg-light">
                                        <tr>
                                            <th>Periodo</th>
                                            <th>Salario Base</th>
                                            <th>Complementos</th>
                                            <th>Deducciones</th>
                                            <th>Total</th>
                                            <th></th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(empleadoNominas)}">
                                            <td colspan="6" class="text-center text-muted py-4">No hay nóminas registradas</td>
                                        </tr>
                                        <tr th:each="nomina : ${empleadoNominas}" class="clickable-row"
                                            th:data-href="@{'/nominas/DetalleNomina/' + ${nomina.id}}">
                                            <td th:text="${nomina.periodo}"></td>
                                            <td th:text="${nomina.salarioBase}"></td>
                                            <td th:text="${nomina.complementos}"></td>
                                            <td th:text="${nomina.deducciones}"></td>
                                            <td th:text="${nomina.totalPagar}" class="fw-bold text-success"></td>
                                            <td>
                                                <a th:href="@{/nominas/imprimir/{id}(id=${nomina.id})}"
                                                   class="btn btn-sm btn-outline-danger rounded-pill px-3 me-1"
                                                   onclick="event.stopPropagation();" target="_blank">
                                                    <i class="bi bi-printer me-1"></i> Imprimir
                                                </a>

                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>

                                    <!-- PAGINACIÓN -->
                                    <div class="table-footer d-flex justify-content-between align-items-center mt-3">
                                        <div class="text-muted small">
                                            <span th:text="${(currentPage * size) + 1}">1</span> a
                                            <span th:text="${(currentPage * size) + empleadoNominas.size()}">10</span>
                                            de <span th:text="${totalElements}">100</span> nóminas
                                        </div>

                                        <div class="d-flex align-items-center gap-4">
                                            <div class="d-flex align-items-center gap-2">
                                                <span class="text-muted small">Mostrar</span>
                                                <select id="pageSizeNominas" class="select-paginacion-clean shadow-none"
                                                        onchange="updateNominasTable(0)">
                                                    <option value="10" th:selected="${size == 10}">10</option>
                                                    <option value="20" th:selected="${size == 20}">20</option>
                                                    <option value="50" th:selected="${size == 50}">50</option>
                                                </select>
                                            </div>

                                            <nav>
                                                <ul class="pagination pagination-sm mb-0">
                                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                                        <a class="page-link" href="javascript:void(0)"
                                                           th:onclick="'changeNominaPage(' + (${currentPage} - 1) + ')'">
                                                            <i class="bi bi-chevron-left"></i>
                                                        </a>
                                                    </li>

                                                    <li class="page-item"
                                                        th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}"
                                                        th:if="${i >= currentPage - 1 and i <= currentPage + 1}"
                                                        th:classappend="${i == currentPage} ? 'active'">
                                                        <a class="page-link" href="javascript:void(0)"
                                                           th:onclick="'changeNominaPage(' + ${i} + ')'"
                                                           th:text="${i + 1}">1</a>
                                                    </li>

                                                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                                        <a class="page-link" href="javascript:void(0)"
                                                           th:onclick="'changeNominaPage(' + (${currentPage} + 1) + ')'">
                                                            <i class="bi bi-chevron-right"></i>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </nav>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- VOLVER -->
                        <div class="text-end mt-4">
                            <a th:href="@{/nominas}" class="btn btn-light rounded-pill">Volver</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        initTableEventsNominas();
    });

    function initTableEventsNominas() {
        document.querySelectorAll(".clickable-row").forEach(row => {
            row.addEventListener("click", function(e) {
                if (e.target.closest('button') || e.target.closest('a')) {
                    return;
                }
                window.location.href = this.getAttribute("data-href");
            });
        });

    }

    function updateNominasTable(page = 0) {
        // Tomamos el valor del input de búsqueda si existe
        const query = document.getElementById('searchNominas')?.value || '';
        const size = document.getElementById('pageSizeNominas').value;
        const container = document.getElementById('tablaNominasContainer');
        const empleadoId = /*[[${empleado.id}]]*/ 0;

        fetch(`/nominas/detalle/${empleadoId}?page=${page}&size=${size}&search=${encodeURIComponent(query)}`)
            .then(response => response.text())
            .then(html => {
                container.innerHTML = html;
                initTableEventsNominas(); // Re-iniciamos eventos de click en filas
            })
            .catch(err => console.error("Error actualizando la tabla de nóminas:", err));
    }


    function changeNominaPage(page) {
        const totalPagesInput = document.getElementById('hiddenTotalPagesNominas');
        const totalPages = totalPagesInput ? parseInt(totalPagesInput.value) : 0;

        if (page < 0 || page >= totalPages) return;
        updateNominasTable(page);
    }
</script>

</body>
</html>
