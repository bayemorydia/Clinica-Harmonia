<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${empleado.nombre + ' ' + empleado.apellidos}">Detalle Empleado</title>

    <style>
        /* Mantengo solo los estilos generales si quieres */
    </style>
</head>

<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid py-4">

        <!-- ALERTA ERROR -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- BREADCRUMB -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/empleados}">Empleados</a>
                </li>
                <li class="breadcrumb-item active">Detalle</li>
            </ol>
        </nav>

        <div class="row g-4">

            <!-- INFO EMPLEADO -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-primary py-4 border-0"></div>
                    <div class="card-body text-center position-relative" style="margin-top:-50px;">
                        <!-- Avatar -->
                        <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                             style="width:100px;height:100px;border:5px solid white;">
                            <h1 class="mb-0 fw-bold text-primary"
                                th:text="${#strings.substring(empleado.nombre,0,1)}">E</h1>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${empleado.nombre + ' ' + empleado.apellidos}">
                            Nombre Apellido
                        </h4>
                        <p class="text-muted small mb-4" th:text="${empleado.email}">email@ejemplo.com</p>

                        <!-- Usuario -->
                        <div th:if="${empleado.usuario != null}" class="mb-4 p-2 rounded-3 bg-light border">
                            <div class="fw-bold small text-uppercase text-muted mb-1">
                                Usuario de acceso
                            </div>
                            <div class="text-primary fw-bold">
                                <i class="bi bi-person-badge-fill me-2"></i>
                                <span th:text="${empleado.usuario.username}"></span>
                            </div>
                        </div>

                        <!-- Estado -->
                        <div th:if="${empleado.activa}" class="text-success fw-bold">
                            <i class="bi bi-circle-fill me-1 small"></i> Activo
                        </div>
                        <div th:unless="${empleado.activa}" class="text-danger fw-bold">
                            <i class="bi bi-circle-fill me-1 small"></i> Inactivo
                        </div>
                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <small class="text-muted">
                            Fecha alta:
                            <span class="fw-bold"
                                  th:text="${empleado.fecha_alta != null ? #temporals.format(empleado.fecha_alta,'dd/MM/yyyy') : '-'}">
                            </span>
                        </small>
                    </div>
                </div>
            </div>

            <!-- DETALLE EMPLEADO -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- DATOS EMPLEADO -->
                        <form th:object="${empleado}">
                            <fieldset disabled>
                                <div class="row g-3">
                                    <!-- Campos de empleado -->
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Nombre</label>
                                        <input th:field="*{nombre}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Apellidos</label>
                                        <input th:field="*{apellidos}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">DNI / NIE</label>
                                        <input th:field="*{dni}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Teléfono</label>
                                        <input th:field="*{telefono}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Email</label>
                                        <input th:field="*{email}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Departamento</label>
                                        <input th:field="*{departamento}" class="form-control rounded-3 bg-light">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Rol</label>
                                        <input class="form-control rounded-3 bg-light"
                                               th:value="${empleado.rol != null ? empleado.rol.nombre : '-'}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Salario Base</label>
                                        <input th:field="*{salarioBase}" class="form-control rounded-3 bg-light">
                                    </div>
                                </div>
                            </fieldset>
                        </form>

                        <!-- VOLVER -->
                        <div class="text-end mt-4">
                            <a th:href="@{/empleados}" class="btn btn-light rounded-pill">Volver</a>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

</body>
</html>
