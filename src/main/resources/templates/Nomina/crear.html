<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('nomina.crear.titulo')}">Crear Nómina</title>
</head>

<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid py-4">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/nominas}" th:text="${trad.getTraduccion('nomina.lista.titulo')}">Nóminas</a>
                </li>
                <li class="breadcrumb-item active" th:text="${trad.getTraduccion('nomina.breadcrumb.nueva')}">Nueva Nómina</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <h4 class="fw-bold mb-4 text-center text-primary"
                            th:text="${empleado.nombre + ' ' + empleado.apellidos}">
                            Nombre Apellido
                        </h4>

                        <form th:action="@{/nominas/guardar}" method="post" th:object="${nomina}">

                            <!-- ID del empleado -->
                            <input type="hidden" th:field="*{empleado.id}"/>

                            <!-- Salario Base ANUAL -->
                            <input type="hidden" th:field="*{salarioBase}" id="salarioBase"/>

                            <!-- Período -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary" th:text="${trad.getTraduccion('nomina.tabla.periodo')}">Período</label>
                                <input type="month"
                                       th:field="*{periodo}"
                                       class="form-control rounded-3"
                                       required>
                            </div>

                            <!-- IRPF (solo porcentaje) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">IRPF (%)</label>
                                <input type="number"
                                       step="0.01"
                                       th:field="*{deducciones}"
                                       id="deducciones"
                                       class="form-control rounded-3"
                                       readonly>
                            </div>

                            <!-- Total a pagar mensual -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Total a pagar mensual (€)</label>
                                <input type="number"
                                       step="0.01"
                                       id="totalPagarMensual"
                                       class="form-control rounded-3"
                                       readonly>
                            </div>

                            <!-- Campo oculto para enviar neto mensual al backend -->
                            <input type="hidden" th:field="*{netoMensual}" id="netoMensual"/>

                            <!-- Campos ocultos para enviar ANUAL -->
                            <input type="hidden" th:field="*{totalPagar}" id="totalPagar"/>

                            <div class="d-flex justify-content-end mt-4">
                                <a th:href="@{/nominas/detalle/{id}(id=${empleado.id})}" class="btn btn-light rounded-pill me-3" th:text="${trad.getTraduccion('boton.cancelar')}">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary rounded-pill" th:text="${trad.getTraduccion('nomina.btn.guardar')}">
                                    Guardar Nómina
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

<!-- SCRIPT CALCULAR IRPF Y NETO MENSUAL -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const salarioBaseAnual = parseFloat(document.getElementById('salarioBase').value) || 0;
    const deduccionesInput = document.getElementById('deducciones'); // % IRPF
    const totalPagarInput = document.getElementById('totalPagar');    // neto anual
    const totalPagarMensualInput = document.getElementById('totalPagarMensual'); // neto mensual mostrado
    const netoMensualInput = document.getElementById('netoMensual');   // neto mensual enviado

    function obtenerIRPF(salarioAnual) {
        if (salarioAnual <= 12450) return 19;
        if (salarioAnual <= 20200) return 24;
        if (salarioAnual <= 35200) return 30;
        if (salarioAnual <= 60000) return 37;
        return 45;
    }

    function calcularNomina() {
        const irpfPorcentaje = obtenerIRPF(salarioBaseAnual);
        const irpfAnual = salarioBaseAnual * (irpfPorcentaje / 100);
        const netoMensual = (salarioBaseAnual - irpfAnual) / 12;

        // Mostrar al usuario
        deduccionesInput.value = irpfPorcentaje.toFixed(2); // mostrar porcentaje
        totalPagarMensualInput.value = netoMensual.toFixed(2);

        // Enviar al backend
        totalPagarInput.value = (salarioBaseAnual - irpfAnual).toFixed(2); // neto anual
        netoMensualInput.value = netoMensual.toFixed(2); // neto mensual
    }

    window.addEventListener('DOMContentLoaded', calcularNomina);
    /*]]>*/
</script>

</body>
</html>
