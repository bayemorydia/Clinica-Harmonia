<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></div>

    <title th:text="${trad.getTraduccion('nominas.lista.titulo')}">Listado de Nóminas</title>

    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .glass-card {
            background: var(--surface-color);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .search-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 2px 15px;
            transition: all 0.2s ease;
        }

        .search-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .search-container input { border: none; box-shadow: none !important; }

        .table thead th {
            background-color: #fcfcfc;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            padding: 16px;
            border-top: none;
        }

        .table tbody td {
            padding: 16px;
            vertical-align: middle;
            border-color: #f1f1f1;
        }

        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .pagination .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color) !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .clickable-row { cursor: pointer; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.02) !important; }
    </style>
</head>

<body>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>

    <main th:class="${#authorization.expression('hasRole(''MEDICO'')')} ? 'content-medico' : 'content'">
        <div class="container-fluid py-4">
            
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('nominas.lista.titulo')}">Listado de Nóminas</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('nominas.lista.subtitulo')}">Gestión y visualización de registros salariales.</p>
                </div>
                <button class="btn btn-success rounded-pill px-4 shadow-sm fw-bold" id="pagarTodasBtn">
                    <i class="bi bi-wallet2 me-2"></i>
                    <span th:text="${trad.getTraduccion('nominas.btn.pagar_todas')}">Pagar todas las nóminas</span>
                </button>
                <p id="estadoPago" class="text-success fw-bold mt-2 d-none">
                    ✔️ Las nóminas de este mes ya han sido pagadas
                </p>

            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="search-container d-flex align-items-center">
                        <i class="bi bi-search text-muted me-2"></i>
                        <input type="text" id="searchInput" class="form-control"
                            th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaNominas">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('nominas.tabla.empleado')}">Empleado</th>
                                        <th th:text="${trad.getTraduccion('nominas.tabla.periodo')}">Periodo</th>
                                        <th th:text="${trad.getTraduccion('nominas.tabla.neto')}">Neto Mensual</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(nominas)}">
                                        <td colspan="4" class="text-center py-5 text-muted" th:text="${trad.getTraduccion('nominas.tabla.vacia')}">No se han encontrado nóminas.</td>
                                    </tr>
                                    <tr th:each="nomina : ${nominas}" class="border-bottom clickable-row" th:data-href="@{'/nominas/DetalleNomina/' + ${nomina.id}}">
                                        <td class="ps-4">
                                            <div class="d-flex align-items-center">
                                                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px;">
                                                    <i class="bi bi-person-text text-primary"></i>
                                                </div>
                                                <span class="fw-bold text-dark" th:text="${nomina.empleado.nombre} + ' ' + ${nomina.empleado.apellidos}"></span>
                                            </div>
                                        </td>
                                        <td th:text="${nomina.periodo}">Periodo</td>
                                        <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(nomina.netoMensual, 1, 2) + ' €'}">0.00€</td>
                                        <td class="text-center" onclick="event.stopPropagation();">
                                            <a th:href="@{'/nominas/imprimir/' + ${nomina.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3" target="_blank">
                                                <i class="bi bi-file-earmark-pdf me-1"></i>
                                                <span th:text="${trad.getTraduccion('nominas.btn.imprimir')}">Imprimir</span>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-4 bg-white border-top d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrando</span>
                                <span class="fw-bold text-dark" th:text="${nominas.size()}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.de')}">de</span>
                                <span class="fw-bold text-dark" th:text="${totalElements}"></span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                </select>

                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:if="${i >= currentPage - 1 and i <= currentPage + 1}"
                                            th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: scripts}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>

    <script th:inline="javascript">
        function initTableEvents() {
            document.querySelectorAll(".clickable-row").forEach(row => {
                row.addEventListener("click", function () {
                    window.location.href = this.getAttribute("data-href");
                });
            });
        }

        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            fetch(`/nominas/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`)
                .then(res => res.text())
                .then(html => {
                    document.getElementById('tablaContainer').innerHTML = html;
                    initTableEvents();
                });
        }

        function changePage(page) {
            const totalInput = document.getElementById('hiddenTotalPages');
            const total = totalInput ? parseInt(totalInput.value) : 0;
            if (page >= 0 && page < total) updateTable(page);
        }

        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 400);
        });

        document.addEventListener("DOMContentLoaded", initTableEvents);

        function obtenerPeriodoActual() {
            const hoy = new Date();
            const mes = String(hoy.getMonth() + 1).padStart(2, '0');
            const anyo = hoy.getFullYear();
            return `${mes}/${anyo}`;
        }

        document.getElementById("pagarTodasBtn").addEventListener("click", function () {
            const periodo = obtenerPeriodoActual();
            const clavePago = `nominas_pagadas_${periodo}`;

            // Si ya está pagado este mes
            if (localStorage.getItem(clavePago)) {
                alert("⚠️ Las nóminas de este mes ya han sido pagadas");
                return;
            }

            const confirmMsg = /*[[${trad.getTraduccion('nominas.confirm.pagar_todas')}]]*/ "¿Seguro que quieres generar todas las nóminas?";
            if (!confirm(confirmMsg)) return;

            fetch(`/nominas/descargarTodos?periodo=${encodeURIComponent(periodo)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Error");
                    return response.blob();
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `Nominas_${periodo}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    // Guardamos que ya se pagó este mes
                    localStorage.setItem(clavePago, "true");

                    // Cambiamos texto y botón
                    const btn = document.getElementById("pagarTodasBtn");
                    btn.disabled = true;
                    btn.innerText = "Nóminas ya pagadas";
                    btn.classList.replace("btn-success", "btn-secondary");

                    document.getElementById("estadoPago").classList.remove("d-none");
                })
                .catch(err => alert("❌ Error"));
        });
    </script>

</body>
</html>
