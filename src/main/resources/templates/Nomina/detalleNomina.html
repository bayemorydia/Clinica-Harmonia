<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${empleado.nombre + ' ' + empleado.apellidos}">Detalle Nómina</title>
</head>

<body class="bg-light">
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''MEDICO'')')} ? 'content-medico' : 
               (${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content')">
        <div class="container-fluid py-4">

            <div class="mx-auto" style="max-width: 1100px;">
                <div th:if="${error}" class="alert alert-danger border-0 shadow-sm small py-2 mb-3">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>
            </div>

            <div class="card shadow-sm border-0 mx-auto" style="border-radius: 15px; max-width: 1100px;">
                <div class="card-header bg-white border-0 py-4 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-file-earmark-ruled text-primary fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark" th:text="${trad.getTraduccion('nomina.detalle.titulo')}">
                                Detalle de Nómina</h4>
                            <p class="text-muted small mb-0"
                                th:text="${trad.getTraduccion('nomina.detalle.subtitulo')}">Resumen de devengos y
                                deducciones salariales.</p>
                        </div>
                    </div>

                    <span class="badge rounded-pill bg-primary bg-opacity-10 text-primary py-2 px-3 fw-bold">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${nomina.periodo}"></span>
                    </span>
                </div>

                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-primary text-uppercase small"
                                th:text="${trad.getTraduccion('nomina.seccion.empleado')}">Empleado</h6>
                            <p class="text-muted small" th:text="${trad.getTraduccion('nomina.seccion.empleado.desc')}">
                                Información del profesional beneficiario.</p>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="d-flex align-items-center gap-4 p-3 bg-light rounded-3">
                                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm border border-2 border-white"
                                    style="width: 80px; height: 80px;">
                                    <h2 class="mb-0 fw-bold text-primary"
                                        th:text="${#strings.substring(empleado.nombre,0,1)}">E</h2>
                                </div>
                                <div>
                                    <h5 class="fw-bold text-dark mb-1"
                                        th:text="${empleado.nombre + ' ' + empleado.apellidos}"></h5>
                                    <div th:class="${empleado.activa} ? 'badge rounded-pill bg-success-soft text-success px-3' : 'badge rounded-pill bg-danger-soft text-danger px-3'"
                                        th:text="${empleado.activa} ? ${trad.getTraduccion('pacientes.estado.activo')} : ${trad.getTraduccion('pacientes.estado.inactivo')}">
                                    </div>
                                    <p class="text-muted small mt-2 mb-0">
                                        <i class="bi bi-envelope me-1"></i> <span th:text="${empleado.email}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="row">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-primary text-uppercase small"
                                th:text="${trad.getTraduccion('nomina.seccion.economica')}">Desglose Económico</h6>
                            <p class="text-muted small"
                                th:text="${trad.getTraduccion('nomina.seccion.economica.desc')}">Cálculo de importes
                                para el periodo seleccionado.</p>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase"
                                        th:text="${trad.getTraduccion('nomina.label.salario_base')}">Salario
                                        Base</label>
                                    <div class="form-control bg-light border-0 py-2 d-flex justify-content-between">
                                        <span th:text="${nomina.salarioBase}"></span>
                                        <span class="text-muted">€</span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase"
                                        th:text="${trad.getTraduccion('nomina.label.deducciones')}">Deducciones</label>
                                    <div
                                        class="form-control bg-light border-0 py-2 d-flex justify-content-between text-danger">
                                        <span>- <span th:text="${nomina.deducciones}"></span></span>
                                        <span class="text-muted">%</span>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label small fw-bold text-secondary text-uppercase"
                                        th:text="${trad.getTraduccion('nomina.label.total_pagar')}">Total a
                                        Percibir</label>
                                    <div
                                        class="form-control bg-primary bg-opacity-10 border-0 py-3 d-flex justify-content-between align-items-center">
                                        <h4 class="mb-0 fw-bold text-primary" th:text="${nomina.totalPagar}"></h4>
                                        <h4 class="mb-0 fw-bold text-primary">€</h4>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                                <a th:href="${#authorization.expression('hasRole(''ROLE_MEDICO'')')} ? @{/medico/nominas} : 
             (${#authorization.expression('hasRole(''ROLE_RECEPCIONISTA'')')} ? @{/recepcion/nominas} : 
             (${#authorization.expression('hasRole(''ROLE_RRHH'')')} ? @{/RRHH/nominas} : @{/nominas}))"
                                    class="btn btn-light rounded-pill px-4 fw-bold">
                                    <i class="bi bi-arrow-left me-2"></i>
                                    <span th:text="${trad.getTraduccion('btn.volver')}">Volver</span>
                                </a>
                                <a th:href="@{'/nominas/imprimir/' + ${nomina.id}}" target="_blank"
                                    class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                                    <i class="bi bi-printer me-2"></i> <span
                                        th:text="${trad.getTraduccion('btn.imprimir')}">Imprimir PDF</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: scripts}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}">
    </div>
</body>

</html>
