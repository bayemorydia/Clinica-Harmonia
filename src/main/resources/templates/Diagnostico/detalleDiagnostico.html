<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('titulo.detalle_diagnostico')}">Detalle Diagnóstico</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container py-4">
            
            <div class="card shadow-sm border-0 mx-auto" style="border-radius: 15px; max-width: 800px;">
                <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">

                        <div>
                            <h4 class="fw-bold text-dark mb-0" th:text="${trad.getTraduccion('titulo.detalle_diagnostico')}">Detalle del Diagnóstico</h4>
                        </div>
                    </div>
                    
                    <span th:class="${diagnostico.activo} ? 'badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2' : 'badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2'">
                        <i th:class="${diagnostico.activo} ? 'bi bi-check-circle-fill me-1' : 'bi bi-x-circle-fill me-1'"></i>
                        <span th:text="${diagnostico.activo} ? ${trad.getTraduccion('estado.activo')} : ${trad.getTraduccion('estado.inactivo')}">ACTIVO</span>
                    </span>
                </div>

                <div class="card-body px-4 pb-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded-3 border h-100">
                                <label class="small text-muted fw-bold text-uppercase d-block mb-1"
                                    th:text="${trad.getTraduccion('lbl.codigo')}">CÓDIGO</label>
                                <span class="fs-5 fw-bold text-primary" th:text="${diagnostico.codigo}">A000</span>
                            </div>
                        </div>
                        
                        <div class="col-md-8">
                            <div class="p-3 bg-light rounded-3 border h-100">
                                <label class="small text-muted fw-bold text-uppercase d-block mb-1"
                                    th:text="${trad.getTraduccion('lbl.nombre_completo')}">NOMBRE COMPLETO</label>
                                <span class="fs-5 text-dark fw-semibold" th:text="${diagnostico.nombre}">Nombre del Diagnóstico</span>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <div class="p-3 rounded-3 border-start border-4 border-primary" style="background-color: rgba(13, 110, 253, 0.05);">
                                <div class="d-flex">
                                    <i class="bi bi-info-circle-fill text-primary me-3 fs-5"></i>
                                    <div>
                                        <h6 class="fw-bold text-primary mb-1" th:text="${trad.getTraduccion('info.uso_sistema')}">Información del Sistema</h6>
                                        <p class="small text-muted mb-0" th:text="${trad.getTraduccion('msg.diagnostico_info_extra')}">
                                            Este diagnóstico está disponible para ser asignado en los episodios clínicos de los pacientes.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-light border-0 d-flex justify-content-end gap-2 px-4 py-3" style="border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;">
                    <a th:href="@{/diagnosticos}" class="btn btn-sm btn-light border px-4 fw-bold text-secondary" th:text="${trad.getTraduccion('btn.volver')}">
                        Volver
                    </a>
                    <a th:href="@{/diagnosticos/editar/{id}(id=${diagnostico.id})}" class="btn btn-sm btn-primary px-4 fw-bold shadow-sm">
                        <i class="bi bi-pencil-square me-2"></i>
                        <span th:text="${trad.getTraduccion('btn.editar')}">Editar</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
