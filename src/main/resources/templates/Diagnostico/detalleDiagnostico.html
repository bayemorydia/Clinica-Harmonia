<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('titulo.detalle_diagnostico')}">Detalle Diagnóstico</title>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid" style="max-width: 800px;">
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/diagnosticos}" class="btn btn-light rounded-circle shadow-sm me-3 text-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h2 class="fw-bold mb-0" th:text="${trad.getTraduccion('titulo.detalle_diagnostico')}">Detalle del
                    Diagnóstico</h2>
            </div>

            <div class="card border-0 shadow-sm">
                <div
                    class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0 d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="fw-bold text-primary mb-1" th:text="${diagnostico.nombre}">Nombre Diagnóstico</h5>
                        <p class="text-muted small mb-0">ID: <span th:text="${diagnostico.id}"></span></p>
                    </div>
                    <div>
                        <span th:if="${diagnostico.activo}"
                            class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
                            <i class="bi bi-check-circle-fill me-1"></i> <span
                                th:text="${trad.getTraduccion('estado.activo')}">ACTIVO</span>
                        </span>
                        <span th:unless="${diagnostico.activo}"
                            class="badge bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2 rounded-pill">
                            <i class="bi bi-x-circle-fill me-1"></i> <span
                                th:text="${trad.getTraduccion('estado.inactivo')}">INACTIVO</span>
                        </span>
                    </div>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded-3 h-100 border">
                                <label class="small text-muted fw-bold text-uppercase d-block mb-2"
                                    th:text="${trad.getTraduccion('lbl.codigo')}">CÓDIGO CIE/INTERNO</label>
                                <span class="fs-5 fw-bold text-dark" th:text="${diagnostico.codigo}">A000</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 bg-light rounded-3 h-100 border">
                                <label class="small text-muted fw-bold text-uppercase d-block mb-2"
                                    th:text="${trad.getTraduccion('lbl.nombre_completo')}">NOMBRE COMPLETO</label>
                                <span class="fs-5 text-dark" th:text="${diagnostico.nombre}">Nombre del
                                    Diagnóstico</span>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 p-3 border rounded-3 bg-opacity-10 bg-primary">
                        <div class="d-flex align-items-start">
                            <i class="bi bi-info-circle-fill text-primary mt-1 me-3 fs-4"></i>
                            <div>
                                <h6 class="fw-bold text-primary mb-1"
                                    th:text="${trad.getTraduccion('info.uso_sistema')}">Información del Sistema</h6>
                                <p class="small text-muted mb-0"
                                    th:text="${trad.getTraduccion('msg.diagnostico_info_extra')}">Este diagnóstico está
                                    disponible para ser asignado en los episodios clínicos de los pacientes.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 py-3 px-4 d-flex justify-content-end gap-2">
                    <a th:href="@{/diagnosticos/editar/{id}(id=${diagnostico.id})}" class="btn btn-warning text-white">
                        <i class="bi bi-pencil me-2"></i> <span
                            th:text="${trad.getTraduccion('btn.editar')}">Editar</span>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
