<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('titulo.confirmar_desactivar')}">Confirmar Acción</title>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card border-0 shadow-lg" style="max-width: 500px; width: 100%;">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex align-items-center justify-content-center"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                    </div>
                </div>

                <h3 class="fw-bold mb-3" th:text="${trad.getTraduccion('msg.estas_seguro')}">¿Estás seguro?</h3>

                <p class="text-muted mb-4">
                    <span th:text="${trad.getTraduccion('msg.confirmar_desactivar_diag')}">Estás a punto de desactivar
                        el diagnóstico:</span>
                    <br>
                    <span class="fw-bold text-dark fs-5 mt-2 d-block" th:text="${diagnostico.nombre}">Nombre</span>
                    <span class="small text-muted" th:text="'(' + ${diagnostico.codigo} + ')'">(COD)</span>
                </p>

                <div class="alert alert-light border small text-start mb-4">
                    <i class="bi bi-info-circle me-1"></i>
                    <span th:text="${trad.getTraduccion('msg.desactivar_info')}">Esto no eliminará el diagnóstico de los
                        historiales existentes, pero evitará que se asigne en nuevas consultas.</span>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/diagnosticos/desactivar/{id}(id=${diagnostico.id})}" class="btn btn-danger btn-lg">
                        <i class="bi bi-power me-2"></i>
                        <span th:text="${trad.getTraduccion('btn.confirmar_desactivar')}">Sí, Desactivar</span>
                    </a>
                    <a th:href="@{/diagnosticos}" class="btn btn-light btn-lg text-muted">
                        <span th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</span>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
