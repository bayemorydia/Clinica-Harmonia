<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${diagnostico.id == null ? trad.getTraduccion('titulo.crear_diagnostico') : trad.getTraduccion('titulo.editar_diagnostico')}">Formulario</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid py-4">

            <form th:action="@{/diagnosticos/guardar}" th:object="${diagnostico}" method="post" class="needs-validation">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="card shadow-sm border-0 mx-auto" style="border-radius: 15px; max-width: 1000px;">
                    <div class="card-header bg-white border-0 py-4 px-4 d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-journal-medical text-primary fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark"
                                th:text="${diagnostico.id == null ? trad.getTraduccion('titulo.crear_diagnostico') : trad.getTraduccion('titulo.editar_diagnostico')}">
                            </h4>
                            <p class="text-muted small mb-0" th:text="${trad.getTraduccion('diagnostico.form.subtitulo')}">Gestión de terminología y codificación médica.</p>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4 rounded-3 d-flex align-items-center">
                            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
                            <div th:text="${error}"></div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h6 class="fw-bold text-primary text-uppercase small" th:text="${trad.getTraduccion('diagnostico.form.sec.datos')}">Datos Técnicos</h6>
                                <p class="text-muted small" th:text="${trad.getTraduccion('diagnostico.form.sec.datos.desc')}">Defina el código estándar y la descripción oficial.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-5">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('lbl.codigo')}"></label>
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-light rounded-start-3"><i class="bi bi-hash text-muted"></i></span>
                                            <input type="text" th:field="*{codigo}" class="form-control bg-light border-0 py-2 rounded-end-3 font-monospace" 
                                                   th:placeholder="${trad.getTraduccion('diagnostico.placeholder.codigo')}" required>
                                        </div>
                                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                    </div>
                                    
                                    <div class="col-12">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('lbl.nombre')}"></label>
                                        <input type="text" th:field="*{nombre}" class="form-control bg-light border-0 py-2 rounded-3" 
                                               th:placeholder="${trad.getTraduccion('diagnostico.placeholder.nombre')}" required>
                                        <div class="invalid-feedback d-block small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h6 class="fw-bold text-primary text-uppercase small" th:text="${trad.getTraduccion('diagnostico.tabla.estado')}">Estado</h6>
                                <p class="text-muted small" th:text="${trad.getTraduccion('diagnostico.form.sec.estado.desc')}">Configuración de disponibilidad en el sistema.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="p-3 bg-light rounded-4 border-0 d-flex align-items-center">
                                    <div class="bg-white p-2 rounded-circle me-3 shadow-sm">
                                        <i class="bi bi-info-circle-fill text-primary"></i>
                                    </div>
                                    <div>
                                        <span class="text-dark small" th:text="${trad.getTraduccion('diagnostico.info.creacion')}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/diagnosticos}" class="btn btn-light rounded-pill px-4 fw-bold text-secondary">
                            <i class="bi bi-x-lg me-1"></i> <span th:text="${trad.getTraduccion('btn.cancelar')}"></span>
                        </a>
                        <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm transition-all hover-lift">
                            <i class="bi bi-check2-circle me-1"></i> <span th:text="${trad.getTraduccion('btn.guardar')}"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    <style>
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
        .transition-all { transition: all 0.2s ease; }
    </style>
</body>
</html>
