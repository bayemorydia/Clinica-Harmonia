<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.diagnosticos')}">Catálogo de Diagnósticos</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .glass-card {
            background: var(--surface-color);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .search-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 2px 15px;
            transition: all 0.2s ease;
        }

        .search-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .search-container input { border: none; box-shadow: none !important; }

        .table thead th {
            background-color: #fcfcfc;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            padding: 16px;
            border-top: none;
        }

        .badge-pill-custom {
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .bg-success-soft { background-color: #e6f6ec; color: #0f5132; }
        .bg-danger-soft { background-color: #fbe9eb; color: #842029; }

        .pagination .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color) !important;
            color: white !important;
        }

        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.02) !important; }
        
        .select-paginacion-clean {
            width: 75px;
            padding: 0.375rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-5">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.diagnosticos')}">Diagnósticos</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('pacientes.lista.subtitulo')}">Gestión de registros médicos.</p>
                </div>
                <a th:href="@{/diagnosticos/nuevo}" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold">
                    <i class="bi bi-plus-lg me-2"></i>
                    <span th:text="${trad.getTraduccion('btn.crear')}">Nuevo</span>
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="search-container d-flex align-items-center">
                                <i class="bi bi-search text-muted me-2"></i>
                                <input type="text" id="searchInput" class="form-control"
                                    th:placeholder="${trad.getTraduccion('placeholder.buscar.diagnostico')}" th:value="${keyword}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="statusFilter" class="form-select border-0 shadow-sm" style="border-radius: 10px; height: 45px;" onchange="updateTable(0)">
                                <option value="" th:text="${trad.getTraduccion('pacientes.filtro.todos')}">Todos</option>
                                <option value="true" th:selected="${activo == true}" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activos</option>
                                <option value="false" th:selected="${activo == false}" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivos</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaDiagnosticos">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('lbl.codigo')}">CÓDIGO</th>
                                        <th th:text="${trad.getTraduccion('lbl.nombre')}">NOMBRE</th>
                                        <th th:text="${trad.getTraduccion('pacientes.tabla.estado')}">ESTADO</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(listaDiagnosticos)}">
                                        <td colspan="4" class="text-center py-5 text-muted" th:text="${trad.getTraduccion('pacientes.tabla.vacia')}">No hay registros.</td>
                                    </tr>
                                    <tr th:each="diag : ${listaDiagnosticos}" class="border-bottom clickable-row" 
                                        th:onclick="|window.location.href='/diagnosticos/detalle/' + ${diag.id}|">
                                        <td class="ps-4 py-3 fw-bold text-primary font-monospace" th:text="${diag.codigo}"></td>
                                        <td class="py-3 text-dark fw-medium" th:text="${diag.nombre}"></td>
                                        <td>
                                            <span th:if="${diag.activo}" class="badge-pill-custom bg-success-soft" th:text="${trad.getTraduccion('pacientes.estado.activo')}"></span>
                                            <span th:unless="${diag.activo}" class="badge-pill-custom bg-danger-soft" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}"></span>
                                        </td>
                                        <td class="text-center" onclick="event.stopPropagation();">
                                            <a th:if="${diag.activo}" th:href="@{'/diagnosticos/confirmarDesactivar/' + ${diag.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-dash-circle me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}"></span>
                                            </a>
                                            <a th:unless="${diag.activo}" th:href="@{'/diagnosticos/activar/' + ${diag.id}}" class="btn btn-sm btn-outline-success rounded-pill px-3">
                                                <i class="bi bi-check-circle me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.activar')}"></span>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-4 bg-white border-top d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrando</span>
                                <span class="fw-bold text-dark" th:text="${totalItems}"></span>
                                <span th:text="${trad.getTraduccion('mod.diagnosticos').toLowerCase()}">diagnósticos</span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                    <option value="50" th:selected="${size == 50}">50</option>
                                </select>

                                <nav th:if="${totalPages > 0}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}"
                                            th:if="${totalPages > 0 and i >= currentPage - 1 and i <= currentPage + 1}"
                                            th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        function updateTable(page = 0) {
            const keyword = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const activo = document.getElementById('statusFilter').value;
            const container = document.getElementById('tablaContainer');

            const params = new URLSearchParams({ keyword, page, size });
            if (activo !== "") params.append("activo", activo);

            fetch(`/diagnosticos/search?${params.toString()}`)
                .then(r => r.text())
                .then(html => { container.innerHTML = html; })
                .catch(err => console.error("Error:", err));
        }

        function changePage(p) {
            const total = parseInt(document.getElementById('hiddenTotalPages').value);
            if (p >= 0 && p < total) updateTable(p);
        }

        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 400);
        });
    </script>
</body>
</html>
