<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <title th:text="${trad.getTraduccion('nav.medico')}">Panel Médico</title>
</head>
<body class="bg-light">
    <div th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>

    <main class="content-medico">
        <div class="container-fluid">
            <header class="mb-4 d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-0" th:text="${trad.getTraduccion('nav.inicio')}">Inicio</h2>
                    <p class="text-muted">
                        <span th:text="${trad.getTraduccion('home.bienvenida')}">Bienvenido</span>, 
                        Dr. <span th:text="${medicoLogueado.nombre} + ' ' + ${medicoLogueado.apellidos}">Nombre</span>
                    </p>
                </div>
                <span class="badge bg-white shadow-sm text-dark p-2 px-3 rounded-pill border">
                    <i class="bi bi-clock me-2 text-primary"></i>
                    <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                </span>
            </header>

            <div class="row g-4 mb-5">
                <div class="col-md-6 col-lg-4">
                    <div class="card card-stat shadow-sm p-3 bg-white border-0">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-person-check text-primary fs-3"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0 small text-uppercase fw-bold">Pacientes Pendientes</h6>
                                <h3 class="fw-bold mb-0" th:text="${totalPacientes}">0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-4">
                    <div class="card card-stat shadow-sm p-3 bg-white border-0">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-success bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-calendar2-day text-success fs-3"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0 small text-uppercase fw-bold">Mis Citas Hoy</h6>
                                <h3 class="fw-bold mb-0" th:text="${citasHoy}">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4 bg-white mb-4">
                <h5 class="fw-bold mb-4">
                    <i class="bi bi-calendar-event me-2 text-primary"></i>
                    Citas Pendientes Asignadas
                </h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Paciente</th>
                                <th>Especialidad</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cita : ${citasPendientes}">
                                <td class="fw-bold" th:text="${#temporals.format(cita.fechaHora, 'dd/MM HH:mm')}"></td>
                                <td th:text="${cita.paciente.nombre} + ' ' + ${cita.paciente.apellidos}"></td>
                                <td><span class="badge bg-info-subtle text-info" th:text="${cita.especialidad}"></span></td>
                                <td class="text-end">
                                    <a th:href="@{/medico/atender/{id}(id=${cita.id})}" class="btn btn-sm btn-primary rounded-pill px-3">
                                        Atender <i class="bi bi-arrow-right ms-1"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(citasPendientes)}">
                                <td colspan="4" class="text-center py-4 text-muted">No tienes pacientes pendientes asignados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-4 bg-white">
                <h5 class="fw-bold mb-4">Acciones Rápidas</h5>
                <div class="row g-3">
                    <div class="col-md-6 col-lg-3">
                        <div class="border p-3 rounded text-center card-stat bg-white h-100">
                            <i class="bi bi-search fs-2 text-info mb-2"></i>
                            <h6 class="fw-bold">Buscar Paciente</h6>
                            <a th:href="@{/medico/pacientes}" class="btn btn-sm btn-info text-white w-100 mt-2">Abrir</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
</body>
</html>
