<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:insert="~{Reutilizable/layoutMedico :: head_medico}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
        rel="stylesheet" />
    <title th:text="${trad.getTraduccion('atencion.titulo')} + ' - ' + ${paciente.nombre}">Atención Médica</title>
</head>

<body class="bg-light">

    <th:block th:insert="~{Reutilizable/layoutMedico :: menu_medico}"></th:block>

    <main class="content-medico">
        <div class="container-fluid py-4">

            <div class="card shadow-sm border-0 mb-4"
                style="border-radius: 15px; background: linear-gradient(to right, #ffffff, #f8f9fa);">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-md-7 d-flex align-items-center">
                            <a th:href="@{/medico/agenda}" class="btn btn-white shadow-sm rounded-circle border me-3">
                                <i class="bi bi-arrow-left"></i>
                            </a>
                            <div class="me-4">
                                <h2 class="fw-bold text-dark mb-0">
                                    <span th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}">Paciente</span>
                                </h2>
                                <div class="d-flex gap-3 mt-1">
                                    <span class="text-muted small"><i class="bi bi-card-text me-1"></i> <span
                                            th:text="${paciente.dni}">DNI</span></span>
                                    <span class="text-muted small">
                                        <i class="bi bi-calendar-event me-1"></i>
                                        <span
                                            th:text="${T(java.time.Period).between(paciente.fechaNacimiento, T(java.time.LocalDate).now()).getYears()}">0</span>
                                        años
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-5 text-md-end mt-3 mt-md-0">
                            <a th:href="@{/medico/paciente/historial/{id}(id=${paciente.id})}"
                                class="btn btn-outline-primary rounded-pill px-4 fw-bold shadow-sm me-2">
                                <i class="bi bi-folder2-open me-2"></i>Ver Historial Clínico
                            </a>
                            <span class="badge bg-primary rounded-pill px-3 py-2 fs-6 shadow-sm">
                                <i class="bi bi-clock me-1"></i> <span
                                    th:text="${#temporals.format(cita.fechaHora, 'HH:mm')}"></span>
                            </span>
                        </div>
                    </div>

                    <div class="mt-4 p-3 bg-primary bg-opacity-10 border-start border-primary border-4 rounded-3">
                        <label class="form-label fw-bold text-primary small text-uppercase mb-1">Motivo de la
                            visita</label>
                        <p class="mb-0 fs-5 text-dark italic" th:text="${cita.motivo}">"El paciente presenta dolor
                            lumbar desde hace tres días..."</p>
                    </div>
                </div>
            </div>

            <form th:action="@{/medico/finalizar-consulta}" method="post" id="formConsulta">
                <input type="hidden" name="citaId" th:value="${cita.id}">

                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                            <div class="card-header bg-white py-3">
                                <h5 class="card-title fw-bold mb-0 text-primary"><i
                                        class="bi bi-clipboard2-pulse me-2"></i>Evaluación Médica</h5>
                            </div>
                            <div class="card-body">
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-muted small text-uppercase">Diagnóstico
                                        Principal (CIE-10)</label>
                                    <select name="diagnosticoId" class="form-select select2-single" required>
                                        <option value="">Buscar diagnóstico por nombre o código...</option>
                                        <option th:each="d : ${listaDiagnosticos}" th:value="${d.id}"
                                            th:text="${d.codigo} + ' - ' + ${d.nombre}"></option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-muted small text-uppercase">Instrucciones y
                                        Recomendaciones</label>
                                    <textarea class="form-control border-0 bg-light" name="descripcion" rows="4"
                                        placeholder="Reposo, dieta, ejercicios recomendados, signos de alarma..."
                                        required style="border-radius: 10px;"></textarea>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold text-muted small text-uppercase">Fin del
                                            Tratamiento</label>
                                        <input type="date" name="fechaFin" class="form-control border-0 bg-light"
                                            required style="border-radius: 10px;">
                                        <small class="text-muted">Fecha estimada de finalización</small>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold text-muted small text-uppercase">Pruebas
                                            Médicas Complementarias</label>
                                        <select name="pruebaIds[]" class="form-select select2-multiple"
                                            multiple="multiple">
                                            <option th:each="p : ${listaPruebas}" th:value="${p.id}"
                                                th:text="${p.nombre}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <div class="card shadow-sm border-0" style="border-radius: 15px;">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title fw-bold mb-0 text-success"><i
                                        class="bi bi-capsule me-2"></i>Receta Electrónica</h5>
                                <button type="button" class="btn btn-sm btn-success rounded-pill px-3"
                                    onclick="agregarMedicamento()">
                                    <i class="bi bi-plus-lg me-1"></i> Añadir
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="recetaContainer">
                                    <div class="text-center py-5 text-muted" id="sinMeds">
                                        <i class="bi bi-prescription2 fs-1 d-block mb-2 opacity-50"></i>
                                        <p class="small mb-0">No se han prescrito medicamentos en esta consulta.</p>
                                    </div>
                                </div>

                                <hr class="my-4">
                                <div class="d-grid">
                                    <button type="submit"
                                        class="btn btn-primary btn-lg rounded-pill shadow-sm py-3 fw-bold">
                                        <i class="bi bi-check2-circle me-2"></i>Finalizar Consulta
                                    </button>
                                    <p class="text-center text-muted small mt-2">Esta acción cerrará la cita y guardará
                                        el historial.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <template id="medTemplate">
        <div
            class="medicamento-item bg-light p-3 rounded-3 mb-3 border-start border-success border-4 position-relative shadow-sm">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-2"
                onclick="this.parentElement.remove(); verificarMeds();" style="font-size: 0.8rem;"></button>
            <div class="mb-2">
                <label class="small fw-bold text-muted text-uppercase" style="font-size: 0.65rem;">Medicamento</label>
                <select name="medIds[]" class="form-select select2-dynamic" required>
                    <option value="">Buscar en farmacia...</option>
                    <option th:each="med : ${listaMedicamentos}" th:value="${med.id}"
                        th:text="${med.nombre} + ' (' + ${med.tipo} + ')'"></option>
                </select>
            </div>
            <div>
                <label class="small fw-bold text-muted text-uppercase" style="font-size: 0.65rem;">Dosis e
                    Instrucciones</label>
                <input type="text" name="medDosis[]" class="form-control form-control-sm border-0 shadow-none"
                    placeholder="Ej: 500mg cada 8 horas por 7 días" required>
            </div>
        </div>
    </template>

    <th:block th:insert="~{Reutilizable/layoutMedico :: scripts_medico}"></th:block>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(document).ready(function () {
            // Inicializar Select2
            $('.select2-single').select2({ theme: 'bootstrap-5', width: '100%' });
            $('.select2-multiple').select2({
                theme: 'bootstrap-5',
                width: '100%',
                placeholder: 'Seleccione pruebas médicas...'
            });

            // Establecer fecha mínima como hoy para el tratamiento
            const today = new Date().toISOString().split('T')[0];
            document.getElementsByName('fechaFin')[0].setAttribute('min', today);
        });

        function agregarMedicamento() {
            const container = document.getElementById('recetaContainer');
            const template = document.getElementById('medTemplate');
            const sinMeds = document.getElementById('sinMeds');
            if (sinMeds) sinMeds.style.display = 'none';

            const clone = template.content.cloneNode(true);
            const newItem = container.appendChild(clone.querySelector('.medicamento-item'));

            $(newItem).find('.select2-dynamic').select2({ theme: 'bootstrap-5', width: '100%' });
        }

        function verificarMeds() {
            const container = document.getElementById('recetaContainer');
            const sinMeds = document.getElementById('sinMeds');
            if (container.querySelectorAll('.medicamento-item').length === 0) {
                sinMeds.style.display = 'block';
            }
        }
    </script>

    <style>
        .select2-container--bootstrap-5 .select2-selection {
            border: none !important;
            background-color: #f8f9fa !important;
            border-radius: 10px !important;
            padding: 0.35rem !important;
        }

        .medicamento-item {
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .medicamento-item:hover {
            transform: translateX(5px);
            background-color: #fff !important;
            border-color: #e9ecef;
        }

        .btn-white {
            background-color: white;
            color: #6c757d;
        }

        .btn-white:hover {
            background-color: #f8f9fa;
            color: #0d6efd;
        }

        .content-medico {
            margin-left: 260px;
            transition: all 0.3s;
        }
    </style>
</body>

</html>
