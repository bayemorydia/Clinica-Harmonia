<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <title>Login | Clínica Harmonia</title>
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <!-- Header -->
                <div class="bg-primary bg-gradient text-white text-center py-4">
                    <i class="bi bi-heart-pulse-fill fs-1 mb-2"></i>
                    <h4 class="fw-bold mb-0">Clínica Harmonia</h4>
                    <small class="opacity-75">Acceso al sistema</small>
                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <form th:action="@{/login}" method="post">

                        <!-- Usuario -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-person text-primary"></i>
                                </span>
                                <input type="text"
                                       name="username"
                                       class="form-control border-start-0"
                                       placeholder="Introduce tu usuario"
                                       required>
                            </div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-2">
                            <label class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock text-primary"></i>
                                </span>
                                <input type="password"
                                       name="password"
                                       class="form-control border-start-0"
                                       placeholder="••••••••"
                                       required>
                            </div>
                        </div>

                        <!-- Olvidar contraseña -->
                        <div class="text-end mb-4">
                            <a th:href="@{/password/forgot}"
                               class="small text-decoration-none fw-semibold text-primary">
                                ¿Has olvidado la contraseña?
                            </a>
                        </div>

                        <!-- Botón -->
                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary btn-lg rounded-pill fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Iniciar sesión
                            </button>
                        </div>

                        <!-- Mensajes -->
                        <div th:if="${param.error}"
                             class="alert alert-danger mt-4 py-2 text-center small rounded-3">
                            Usuario o contraseña incorrectos
                        </div>

                        <div th:if="${param.logout}"
                             class="alert alert-success mt-4 py-2 text-center small rounded-3">
                            Sesión cerrada correctamente
                        </div>

                    </form>
                </div>
            </div>

            <!-- Footer -->
            <p class="text-center text-muted small mt-4">
                © <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}"></span>
                Clínica Harmonia · Salud y bienestar
            </p>

        </div>
    </div>
</div>

<div th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
</body>
</html>
