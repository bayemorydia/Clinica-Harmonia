<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <title>Recuperar contraseña | Clínica Harmonia</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                <div class="bg-primary bg-gradient text-white text-center py-4">
                    <i class="bi bi-key-fill fs-1 mb-2"></i>
                    <h4 class="fw-bold mb-0">Recuperar contraseña</h4>
                    <small class="opacity-75">Introduce tu DNI/NIE</small>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/password/forgot}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">DNI / NIE</label>
                            <input type="text" name="dni" class="form-control form-control-lg" placeholder="12345678A" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-semibold">
                                Enviar
                            </button>
                        </div>

                        <div th:if="${error}" class="alert alert-danger mt-3 py-2 text-center small rounded-3" th:text="${error}"></div>
                        <div th:if="${success}" class="alert alert-success mt-3 py-2 text-center small rounded-3" th:text="${success}"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
</body>
</html>
