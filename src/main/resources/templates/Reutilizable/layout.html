<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head_general">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow-x: hidden;
        }

        .sidebar {
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            width: 260px;
            position: fixed;
            overflow-y: auto;
            z-index: 1000;
            overflow-y: auto;
        }

        .content {
            margin-left: 260px;
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
            width: calc(100% - 260px);
        }

        .nav-link {
            color: #6c757d;
            font-weight: 500;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.3rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #e7f1ff;
            color: #0d6efd;
        }

        .nav-link i {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .lang-container {
            margin-top: -10px;
            margin-bottom: 25px;
            padding-left: 45px;
        }

        .lang-select-minimal {
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: #6c757d;
            cursor: pointer;
            padding: 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .lang-select-minimal:focus {
            outline: none;
        }

        .nav-divider {
            font-size: 0.7rem;
            font-weight: 700;
            color: #adb5bd;
            text-transform: uppercase;
            padding: 1.5rem 1rem 0.5rem;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="sidebar d-flex flex-column p-3" th:fragment="menu">
        <div class="d-flex align-items-center mb-1 px-2">
            <i class="bi bi-hospital-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold text-primary" th:text="${trad.getTraduccion('nav.clinica.nombre')}">Clínica
                Harmonia</span>
        </div>

        <div class="lang-container">
            <select class="lang-select-minimal" onchange="changeLang(this.value)">
                <option value="es" th:selected="${#locale.language == 'es'}" th:text="${trad.getTraduccion('lang.es')}">
                    ESPAÑOL</option>
                <option value="ca" th:selected="${#locale.language == 'ca'}" th:text="${trad.getTraduccion('lang.ca')}">
                    CATALÀ</option>
                <option value="en" th:selected="${#locale.language == 'en'}" th:text="${trad.getTraduccion('lang.en')}">
                    ENGLISH</option>
            </select>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
            <li>
                <a th:href="@{/admin}" class="nav-link">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span th:text="${trad.getTraduccion('nav.inicio')}">Inicio</span>
                </a>
            </li>

            <li>
                <a th:href="@{/pacientes}" class="nav-link">
                    <i class="bi bi-people"></i>
                    <span th:text="${trad.getTraduccion('mod.pacientes')}">Pacientes</span>
                </a>
            </li>

            <li>
                <a th:href="@{/empleados}" class="nav-link">
                    <i class="bi bi-person-badge"></i>
                    <span th:text="${trad.getTraduccion('mod.empleados')}">Empleados</span>
                </a>
            </li>

            <li>
                <a th:href="@{/citas}" class="nav-link">
                    <i class="bi bi-calendar-check"></i>
                    <span th:text="${trad.getTraduccion('mod.citas')}">Citas Médicas</span>
                </a>
            </li>

            <li>
                <a th:href="@{/pruebas/listar}" class="nav-link">
                    <i class="bi bi-clipboard2-pulse"></i>
                    <span th:text="${trad.getTraduccion('mod.tratamientos')}">Pruebas Médicas</span>
                </a>
            </li>

            <li>
                <a th:href="@{/medicamentos/listar}" class="nav-link">
                    <i class="bi bi-capsule"></i>
                    <span th:text="${trad.getTraduccion('mod.medicamentos')}">Medicamentos</span>
                </a>
            </li>

            <li>
                <a th:href="@{/diagnosticos}" class="nav-link">
                    <i class="bi bi-journal-medical"></i>
                    <span th:text="${trad.getTraduccion('mod.diagnosticos')}">Diagnósticos</span>
                </a>
            </li>

            <div class="nav-divider" th:text="${trad.getTraduccion('nav.seccion.admin')}">Administración</div>

            <li>
                <a th:href="@{/roles}" class="nav-link">
                    <i class="bi bi-shield-lock"></i>
                    <span th:text="${trad.getTraduccion('mod.admin.roles.titulo')}">Roles</span>
                </a>
            </li>

            <li>
                <a th:href="@{/admin/usuarios}" class="nav-link">
                    <i class="bi bi-person-gear"></i>
                    <span th:text="${trad.getTraduccion('mod.admin.usuarios.titulo')}">Usuarios</span>
                </a>
            </li>

            <li>
                <a th:href="@{/admin/facturas}" class="nav-link">
                    <i class="bi bi-receipt"></i>
                    <span th:text="${trad.getTraduccion('mod.facturacion.titulo')}">Facturación</span>
                </a>
            </li>

            <li>
                <a th:href="@{/proveedores}" class="nav-link">
                    <i class="bi bi-truck"></i>
                    <span th:text="${trad.getTraduccion('mod.proveedores')}">Proveedores</span>
                </a>
            </li>
        </ul>

        <hr>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 text-danger text-start px-3 shadow-none">
                <i class="bi bi-box-arrow-right me-2"></i>
                <span th:text="${trad.getTraduccion('btn.logout')}">Cerrar Sesión</span>
            </button>
        </form>
    </div>

    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function changeLang(lang) {
                const url = new URL(window.location.href);
                url.searchParams.set('lang', lang);
                window.location.href = url.toString();
            }
        </script>
    </div>
</body>

</html>
