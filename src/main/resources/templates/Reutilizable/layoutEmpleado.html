<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head_empleado">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar-empleado {
            min-height: 100vh;
            background: white;
            border-right: 1px solid #dee2e6;
            width: 260px;
            position: fixed;
        }

        .content-empleado {
            margin-left: 260px;
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .nav-link-emp {
            padding: 12px 15px;
            border-radius: 8px;
            color: #495057;
            display: flex;
            align-items: center;
            text-decoration: none;
            margin-bottom: 5px;
            transition: 0.2s;
            font-weight: 500;
        }

        .nav-link-emp:hover {
            background: #f8f9fa;
            color: #0d6efd;
        }

        .nav-link-emp i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .nav-link-emp.active {
            background: #e7f1ff;
            color: #0d6efd;
        }

        .lang-container {
            padding-left: 45px;
            margin-bottom: 20px;
        }

        .lang-select-minimal {
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: #6c757d;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
<!-- Sidebar RRHH -->
<div class="sidebar-empleado d-flex flex-column p-3" th:fragment="menu_empleado">
    <div class="d-flex align-items-center mb-1 px-2">
        <i class="bi bi-people-fill text-primary fs-3 me-2"></i>
        <span class="fs-5 fw-bold text-primary">RRHH</span>
    </div>

    <div class="lang-container">
        <select class="lang-select-minimal" onchange="changeLang(this.value)">
            <option value="es" th:selected="${#locale.language == 'es'}">ESPAÑOL</option>
            <option value="ca" th:selected="${#locale.language == 'ca'}">CATALÀ</option>
            <option value="en" th:selected="${#locale.language == 'en'}">ENGLISH</option>
        </select>
    </div>

    <div class="mb-4 px-2">
        <small class="text-muted d-block" th:text="${trad.getTraduccion('nav.identificado')}">Identificado como:</small>
        <span class="fw-bold text-dark" th:text="${#authentication.name}">Usuario</span>
    </div>

    <ul class="nav flex-column mb-auto">
        <li>
            <a th:href="@{/rrhh/dashboard}" class="nav-link-emp"
               th:classappend="${#ctx.containsVariable('activePage') and activePage == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-grid"></i>
                <span th:text="${trad.getTraduccion('nav.inicio')}">Inicio</span>
            </a>
        </li>
        <li>
            <a th:href="@{/rrhh/empleados}" class="nav-link-emp"
               th:classappend="${#ctx.containsVariable('activePage') and activePage == 'empleados' ? 'active' : ''}">
                <i class="bi bi-person-lines-fill"></i>
                <span th:text="${trad.getTraduccion('nav.empleados')}">Empleados</span>
            </a>
        </li>
        <li>
            <a th:href="@{/rrhh/bajas}" class="nav-link-emp"
               th:classappend="${#ctx.containsVariable('activePage') and activePage == 'bajas' ? 'active' : ''}">
                <i class="bi bi-person-dash"></i>
                <span th:text="${trad.getTraduccion('nav.bajas')}">Bajas</span>
            </a>
        </li>
        <li>
            <a th:href="@{/rrhh/nominas}" class="nav-link-emp"
               th:classappend="${#ctx.containsVariable('activePage') and activePage == 'nominas' ? 'active' : ''}">
                <i class="bi bi-file-earmark-medical"></i>
                <span th:text="${trad.getTraduccion('nav.nominas')}">Nóminas</span>
            </a>
        </li>
    </ul>

    <hr>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="nav-link-emp text-danger border-0 bg-transparent w-100 text-start">
            <i class="bi bi-box-arrow-left"></i>
            <span th:text="${trad.getTraduccion('btn.logout') ?: 'Cerrar Sesión'}">Salir</span>
        </button>
    </form>
</div>

<div th:fragment="scripts_empleado">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function changeLang(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
</div>
</body>

</html>
