<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head_medico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar-medico { min-height: 100vh; background: white; border-right: 1px solid #dee2e6; width: 260px; position: fixed; z-index: 1000; }
        .content-medico { margin-left: 260px; padding: 2rem; background: #f8f9fa; min-height: 100vh; }
        .nav-link-med { padding: 12px 15px; border-radius: 8px; color: #495057; display: flex; align-items: center; text-decoration: none; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .nav-link-med:hover { background: #f8f9fa; color: #0d6efd; }
        .nav-link-med i { margin-right: 10px; font-size: 1.2rem; }
        .nav-link-med.active { background: #e7f1ff; color: #0d6efd; }
        .lang-select-minimal { border: none; background: transparent; font-size: 0.75rem; color: #6c757d; cursor: pointer; font-weight: 600; text-transform: uppercase; }
    </style>
</head>

<body>
    <div class="sidebar-medico d-flex flex-column p-3" th:fragment="menu_medico">
        <div class="d-flex align-items-center mb-1 px-2">
            <i class="bi bi-hospital-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold text-primary">Clínica Harmonia</span>
        </div>

        <div class="px-2 mb-3">
            <select class="lang-select-minimal" onchange="changeLang(this.value)">
                <option value="es" th:selected="${#locale.language == 'es'}">ESPAÑOL</option>
                <option value="ca" th:selected="${#locale.language == 'ca'}">CATALÀ</option>
                <option value="en" th:selected="${#locale.language == 'en'}">ENGLISH</option>
            </select>
        </div>

        <div class="mb-4 px-2">
            <small class="text-muted d-block" th:text="${trad.getTraduccion('nav.identificado')}">Identificado como:</small>
            <span class="fw-bold text-dark">[[${#authentication.name}]]</span>
        </div>

        <ul class="nav flex-column mb-auto">
            <li>
                <a th:href="@{/medico/dashboard}" class="nav-link-med" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-grid"></i>
                    <span th:text="${trad.getTraduccion('nav.inicio')}">Inicio</span>
                </a>
            </li>

            <li th:if="${medicoLogueado != null}">
                <a th:href="@{/medico/perfil/{id}(id=${medicoLogueado.id})}" class="nav-link-med" th:classappend="${activePage == 'perfil' ? 'active' : ''}">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${trad.getTraduccion('nav.perfil.user')}">Perfil</span>
                </a>
            </li>

            <li>
                <a th:href="@{/medico/agenda}" class="nav-link-med" th:classappend="${activePage == 'agenda' ? 'active' : ''}">
                    <i class="bi bi-calendar3"></i>
                    <span>Agenda</span>
                </a>
            </li>
        </ul>

        <hr>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-link-med text-danger border-0 bg-transparent w-100 text-start">
                <i class="bi bi-box-arrow-left"></i>
                <span th:text="${trad.getTraduccion('btn.logout')}">Salir</span>
            </button>
        </form>
    </div>

    <div th:fragment="scripts_medico">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function changeLang(lang) {
                const url = new URL(window.location.href);
                url.searchParams.set('lang', lang);
                window.location.href = url.toString();
            }
        </script>
    </div>
</body>
</html>
