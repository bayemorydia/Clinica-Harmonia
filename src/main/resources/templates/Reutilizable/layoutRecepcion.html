<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="head_recepcion">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar-recepcion {
            min-height: 100vh;
            background: white;
            border-right: 1px solid #dee2e6;
            width: 260px;
            position: fixed;
            z-index: 1000;
        }

        .content-recepcion {
            margin-left: 260px;
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .nav-link-rec {
            padding: 12px 15px;
            border-radius: 8px;
            color: #495057;
            display: flex;
            align-items: center;
            text-decoration: none;
            margin-bottom: 5px;
            transition: 0.2s;
            font-weight: 500;
        }

        .nav-link-rec:hover {
            background: #e3f2fd;
            color: #0d6efd;
        }

        .nav-link-rec i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .nav-link-rec.active {
            background: #cfe2ff;
            color: #0a58ca;
            font-weight: 600;
        }

        .lang-container {
            padding-left: 45px;
            margin-bottom: 20px;
        }

        .lang-select-minimal {
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: #6c757d;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</th:block>

<body>
    <div class="sidebar-recepcion d-flex flex-column p-3" th:fragment="menu_recepcion">
        
        <div class="d-flex align-items-center mb-1 px-2">
            <i class="bi bi-hospital-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold text-primary" th:text="${trad != null ? trad.getTraduccion('nav.clinica.nombre') : 'Clínica Harmonia'}">Clínica Harmonia</span>
        </div>

        <div class="lang-container">
            <select class="lang-select-minimal" onchange="changeLang(this.value)">
                <option value="es" th:selected="${#locale.language == 'es'}">ESPAÑOL</option>
                <option value="ca" th:selected="${#locale.language == 'ca'}">CATALÀ</option>
                <option value="en" th:selected="${#locale.language == 'en'}">ENGLISH</option>
            </select>
        </div>

        <div class="mb-4 px-2">
            <small class="text-muted d-block" th:text="${trad != null ? trad.getTraduccion('nav.identificado') : 'Usuario:'}">Usuario:</small>
            <span class="fw-bold text-dark">
                <i class="bi bi-person-badge me-1"></i>
                <span sec:authentication="name">Usuario</span>
            </span>
        </div>

        <ul class="nav flex-column mb-auto">
            
            <li>
                <a th:href="@{/recepcion/dashboard}" class="nav-link-rec"
                   th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('nav.inicio') : 'Dashboard'}">Dashboard</span>
                </a>
            </li>

            <li>
                <a th:href="@{/pacientes}" class="nav-link-rec"
                   th:classappend="${activePage == 'pacientes' ? 'active' : ''}">
                    <i class="bi bi-people"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('mod.pacientes') : 'Pacientes'}">Pacientes</span>
                </a>
            </li>

            <li>
                <a th:href="@{/citas}" class="nav-link-rec"
                   th:classappend="${activePage == 'citas' ? 'active' : ''}">
                    <i class="bi bi-calendar-check"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('mod.citas') : 'Agenda Citas'}">Citas</span>
                </a>
            </li>

            <hr class="text-muted my-2 opacity-50">

            <li>
                <a th:href="@{/recepcion/perfil}" class="nav-link-rec"
                   th:classappend="${activePage == 'perfil' ? 'active' : ''}">
                    <i class="bi bi-person-circle"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('nav.perfil.user') : 'Mi Perfil'}">Perfil</span>
                </a>
            </li>

            <li>
                <a th:href="@{/recepcion/nominas}" class="nav-link-rec"
                   th:classappend="${activePage == 'nominas' ? 'active' : ''}">
                    <i class="bi bi-file-earmark-medical"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('nav.nominas') : 'Mis Nóminas'}">Mis Nóminas</span>
                </a>
            </li>

            <li>
                <a th:href="@{/recepcion/vacaciones}" class="nav-link-rec"
                   th:classappend="${activePage == 'vacaciones' ? 'active' : ''}">
                    <i class="bi bi-sun"></i>
                    <span th:text="${trad != null ? trad.getTraduccion('nav.vacaciones') : 'Vacaciones'}">Vacaciones</span>
                </a>
            </li>

        </ul>

        <hr>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="nav-link-rec text-danger border-0 bg-transparent w-100 text-start">
                <i class="bi bi-box-arrow-left"></i>
                <span th:text="${trad != null ? trad.getTraduccion('btn.logout') : 'Cerrar Sesión'}">Salir</span>
            </button>
        </form>
    </div>

    <div th:fragment="scripts_recepcion">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function changeLang(lang) {
                const url = new URL(window.location.href);
                url.searchParams.set('lang', lang);
                window.location.href = url.toString();
            }
        </script>
    </div>
</body>
</html>
