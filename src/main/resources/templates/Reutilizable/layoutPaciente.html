<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head_paciente">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            width: 260px;
            position: fixed;
            overflow-y: auto;
            z-index: 1000;
        }

        .content {
            margin-left: 260px;
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .nav-link {
            color: #6c757d;
            font-weight: 500;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.3rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #e7f1ff;
            color: #0d6efd;
        }

        .nav-link i {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .lang-container {
            margin-top: -10px;
            margin-bottom: 25px;
            padding-left: 45px;
        }

        .lang-select-minimal {
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: #6c757d;
            cursor: pointer;
            padding: 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .lang-select-minimal:focus {
            outline: none;
        }

        .nav-divider {
            font-size: 0.7rem;
            font-weight: 700;
            color: #adb5bd;
            text-transform: uppercase;
            padding: 1.5rem 1rem 0.5rem;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
<div class="sidebar d-flex flex-column p-3" th:fragment="menu_paciente">
    <div class="d-flex align-items-center mb-1 px-2">
        <i class="bi bi-person-circle text-primary fs-3 me-2"></i>
        <span class="fs-5 fw-bold text-primary" th:text="${pacienteLogueado.nombre} + ' ' + ${pacienteLogueado.apellidos}">Nombre Paciente</span>
    </div>

    <div class="lang-container">
        <select class="lang-select-minimal" onchange="changeLang(this.value)">
            <option value="es" th:selected="${#locale.language == 'es'}" th:text="${trad.getTraduccion('lang.es')}">ESPAÑOL</option>
            <option value="ca" th:selected="${#locale.language == 'ca'}" th:text="${trad.getTraduccion('lang.ca')}">CATALÀ</option>
            <option value="en" th:selected="${#locale.language == 'en'}" th:text="${trad.getTraduccion('lang.en')}">ENGLISH</option>
        </select>
    </div>

    <ul class="nav nav-pills flex-column mb-auto">
        <li>
            <a th:href="@{/paciente/dashboard}" class="nav-link">
                <i class="bi bi-speedometer2"></i>
                <span th:text="${trad.getTraduccion('nav.inicio')}">Dashboard</span>
            </a>
        </li>

        <li>
            <a th:href="@{/paciente/perfil/{id}(id=${pacienteLogueado.id})}" class="nav-link">
                <i class="bi bi-person"></i>
                <span th:text="${trad.getTraduccion('nav.perfil')}">Mi Perfil</span>
            </a>
        </li>

        <li>
            <a th:href="@{/paciente/citas}" class="nav-link">
                <i class="bi bi-calendar-check"></i>
                <span th:text="${trad.getTraduccion('nav.citas')}">Mis Citas</span>
            </a>
        </li>

        <li>
            <a th:href="@{/paciente/historial}" class="nav-link">
                <i class="bi bi-journal-medical"></i>
                <span th:text="${trad.getTraduccion('nav.historial')}">Historial Clínico</span>
            </a>
        </li>

        <li>
            <a th:href="@{/paciente/facturas}" class="nav-link">
                <i class="bi bi-receipt"></i>
                <span th:text="${trad.getTraduccion('nav.facturas')}">Mis Facturas</span>
            </a>
        </li>
    </ul>

    <hr>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-light w-100 text-danger text-start px-3 shadow-none">
            <i class="bi bi-box-arrow-right me-2"></i>
            <span th:text="${trad.getTraduccion('btn.logout')}">Cerrar Sesión</span>
        </button>
    </form>
</div>

<div th:fragment="scripts_paciente">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function changeLang(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
</div>
</body>

</html>
