<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head_RRHH">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #dee2e6;
            width: 260px;
            position: fixed;
            overflow-y: auto;
            z-index: 1000;
        }

        .content {
            margin-left: 260px;
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .nav-link {
            color: #6c757d;
            font-weight: 500;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.3rem;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #e7f1ff;
            color: #0d6efd;
        }

        .nav-link i {
            font-size: 1.2rem;
            margin-right: 10px;
        }

        .lang-container {
            margin-top: -10px;
            margin-bottom: 25px;
            padding-left: 45px;
        }

        .lang-select-minimal {
            border: none;
            background: transparent;
            font-size: 0.75rem;
            color: #6c757d;
            cursor: pointer;
            padding: 0;
            font-weight: 600;
            text-transform: uppercase;
        }

        .lang-select-minimal:focus {
            outline: none;
        }

        .nav-divider {
            font-size: 0.7rem;
            font-weight: 700;
            color: #adb5bd;
            text-transform: uppercase;
            padding: 1.5rem 1rem 0.5rem;
            letter-spacing: 1px;
        }

        /* --- Estilos para Notificaciones Centralizadas --- */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1060; /* Asegura que esté por encima de todo */
            width: 350px;
        }
        
        .notification-toast {
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="sidebar d-flex flex-column p-3" th:fragment="menu_RRHH">
        
        <div id="toast-container"></div>

        <div class="d-flex align-items-center mb-1 px-2">
            <i class="bi bi-people-fill text-primary fs-3 me-2"></i>
            <span class="fs-5 fw-bold text-primary">RRHH</span>
        </div>

        <div class="lang-container">
            <select class="lang-select-minimal" onchange="changeLang(this.value)">
                <option value="es" th:selected="${#locale.language == 'es'}">ESPAÑOL</option>
                <option value="ca" th:selected="${#locale.language == 'ca'}">CATALÀ</option>
                <option value="en" th:selected="${#locale.language == 'en'}">ENGLISH</option>
            </select>
        </div>

        <div class="mb-4 px-2">
            <small class="text-muted d-block" th:text="${trad.getTraduccion('nav.identificado')}">Identificado
                como:</small>
            <span class="fw-bold text-dark" th:text="${#authentication.name}">Usuario</span>
        </div>

        <ul class="nav nav-pills flex-column mb-auto">
            <li>
                <a th:href="@{/RRHH/dashboard}" class="nav-link"
                    th:classappend="${activePage == 'dashboard'} ? 'active'">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span th:text="${trad.getTraduccion('nav.inicio')}">Inicio</span>
                </a>
            </li>

            <li th:if="${empleadoLogueado != null or empleado != null}">
                <a th:href="@{/RRHH/perfil/{id}(id=${empleadoLogueado != null ? empleadoLogueado.id : empleado.id})}"
                    class="nav-link" th:classappend="${activePage == 'perfil'} ? 'active'">
                    <i class="bi bi-person-badge"></i>
                    <span th:text="${trad.getTraduccion('nav.perfil')}">Perfil</span>
                </a>
            </li>

            <li>
                <a th:href="@{/RRHH/empleados}" class="nav-link"
                    th:classappend="${activePage == 'empleados'} ? 'active'">
                    <i class="bi bi-person-badge"></i>
                    <span th:text="${trad.getTraduccion('nav.empleados')}">Empleados</span>
                </a>
            </li>

            <li>
                <a th:href="@{/RRHH/nominas}" class="nav-link" th:classappend="${activePage == 'nominas'} ? 'active'">
                    <i class="bi bi-file-earmark-medical"></i>
                    <span th:text="${trad.getTraduccion('nav.nominas.rrhh')}">Nóminas</span>
                </a>
            </li>
            <li>
                <a th:href="@{/RRHH/gestionvacaciones}" class="nav-link"
                    th:classappend="${activePage == 'GestVacaciones'} ? 'active'">
                    <i class="bi bi-airplane-engines-fill"></i>
                    <span th:text="${trad.getTraduccion('nav.GestionVacaciones')}">Gestion de Vacaciones</span>
                </a>
            </li>
            <li>
                <a th:href="@{/vacaciones}" class="nav-link"
                    th:classappend="${activePage == 'misVacaciones'} ? 'active'">
                    <i class="bi bi-sun"></i>
                    <span th:text="${trad.getTraduccion('nav.vacaciones')}">Mis Vacaciones</span>
                </a>
            </li>
        </ul>

        <hr>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-light w-100 text-danger text-start px-3 shadow-none">
                <i class="bi bi-box-arrow-right me-2"></i>
                <span th:text="${trad.getTraduccion('btn.logout')}">Cerrar Sesión</span>
            </button>
        </form>
    </div>

    <div th:fragment="scripts_RRHH">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
        
        <script th:inline="javascript">
            // Lógica WebSocket centralizada para RRHH
            (function() {
                var socket = new SockJS('/ws-clinica');
                var stompClient = Stomp.over(socket);
                stompClient.debug = null; // Ocultar mensajes de depuración en consola

                stompClient.connect({}, function (frame) {
                    stompClient.subscribe('/topic/vacaciones', function (notificacion) {
                        mostrarNotificacionEmergente(notificacion.body);
                    });
                });

                function mostrarNotificacionEmergente(mensaje) {
                    const container = document.getElementById('toast-container');
                    if (!container) return;
                    
                    const id = 'notif-' + Date.now();
                    const toastHtml = `
                        <div id="${id}" class="alert alert-info alert-dismissible fade show shadow notification-toast border-start border-info border-5 mb-3" role="alert" style="cursor:pointer;" onclick="location.href='/RRHH/gestionvacaciones'">
                            <div class="d-flex align-items-center">
                                <i class="bi bi-info-circle-fill fs-4 me-3"></i>
                                <div>
                                    <strong class="d-block">[[${trad.getTraduccion('vacaciones.panel.rrhh')}]]</strong>
                                    <span class="small">${mensaje}</span>
                                </div>
                            </div>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" onclick="event.stopPropagation();"></button>
                        </div>
                    `;
                    
                    container.insertAdjacentHTML('afterbegin', toastHtml);

                    // Auto-eliminar después de 8 segundos
                    setTimeout(() => {
                        const toast = document.getElementById(id);
                        if (toast) {
                            const bsAlert = new bootstrap.Alert(toast);
                            bsAlert.close();
                        }
                    }, 8000);
                }
            })();

            function changeLang(lang) {
                const url = new URL(window.location.href);
                url.searchParams.set('lang', lang);
                window.location.href = url.toString();
            }
        </script>
    </div>
</body>

</html>
