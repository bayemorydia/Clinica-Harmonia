<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')">
    <th:block th:replace="~{Reutilizable/layout :: head_general}"></th:block>
    <title th:text="${cita.id == null ? trad.getTraduccion('citas.form.titulo.nuevo') : trad.getTraduccion('citas.form.titulo.editar')}"></title>
</head>

<head sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></head>

<body class="bg-light">
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid py-4">
            
            <div class="card shadow-sm border-0 mx-auto" style="border-radius: 15px; max-width: 1000px;">
                <div class="card-header bg-white border-0 py-4 px-4 d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                        <i class="bi bi-calendar-plus text-primary fs-3"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0 text-dark"
                            th:text="${cita.id == null ? trad.getTraduccion('citas.form.titulo.nuevo') : trad.getTraduccion('citas.form.titulo.editar')}">
                        </h4>
                        <p class="text-muted small mb-0" th:text="${trad.getTraduccion('citas.listado.subtitulo')}"></p>
                    </div>
                </div>

                <div class="card-body p-4 p-lg-5">
                    <div th:if="${errorNegocio}" class="alert alert-danger border-0 d-flex align-items-center mb-4 shadow-sm rounded-3">
                        <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
                        <div th:text="${errorNegocio}"></div>
                    </div>

                    <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" id="citaForm">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{estado}" th:if="*{id != null}" />

                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-secondary text-uppercase" th:text="${trad.getTraduccion('citas.form.label.paciente')}"></label>
                                <select th:field="*{paciente}" class="form-select border-0 bg-light py-2 rounded-3"
                                    th:classappend="${#fields.hasErrors('paciente')} ? 'is-invalid'" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.paciente')}"></option>
                                    <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellidos}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-secondary text-uppercase" th:text="${trad.getTraduccion('citas.tabla.fechahora')}"></label>
                                <input type="datetime-local" th:field="*{fechaHora}" id="fechaHoraInput" step="3600"
                                    class="form-control border-0 bg-light py-2 rounded-3"
                                    th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
                                <small class="text-primary d-block mt-2">
                                    <i class="bi bi-info-circle me-1"></i>
                                    <span th:text="${trad.getTraduccion('citas.form.horario_ayuda')}"></span>
                                </small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-secondary text-uppercase" th:text="${trad.getTraduccion('citas.form.label.profesional')}"></label>
                                <select th:field="*{profesional}" class="form-select border-0 bg-light py-2 rounded-3"
                                    th:classappend="${#fields.hasErrors('profesional')} ? 'is-invalid'" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.medico')}"></option>
                                    <option th:each="pro : ${profesionales}" th:value="${pro.id}" th:text="${pro.nombre + ' ' + pro.apellidos}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small text-secondary text-uppercase" th:text="${trad.getTraduccion('citas.form.label.especialidad')}"></label>
                                <select th:field="*{especialidad}" class="form-select border-0 bg-light py-2 rounded-3" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.especialidad')}"></option>
                                    <option th:each="esp : ${especialidades}" th:value="${esp}" th:text="${esp}"></option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small text-secondary text-uppercase" th:text="${trad.getTraduccion('citas.form.label.motivo')}"></label>
                                <textarea th:field="*{motivo}" class="form-control border-0 bg-light py-2 rounded-3" rows="3"
                                    th:placeholder="${trad.getTraduccion('citas.placeholder.motivo')}"></textarea>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-0 p-0 mt-5 d-flex justify-content-end gap-3">
                            <a th:href="@{/citas}" class="btn btn-light rounded-pill px-4 fw-bold text-secondary">
                                <i class="bi bi-x-lg me-1"></i> <span th:text="${trad.getTraduccion('btn.cancelar')}"></span>
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                                <i class="bi bi-check2-circle me-1"></i> <span th:text="${trad.getTraduccion('btn.guardar')}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const input = document.getElementById('fechaHoraInput');
            
            // Obtener mensajes traducidos desde Thymeleaf para el JS
            const msgHoraExacta = /*[[${trad.getTraduccion('citas.js.error_hora_exacta')}]]*/ 'Seleccione hora exacta';
            const msgHorarioPermitido = /*[[${trad.getTraduccion('citas.js.error_horario')}]]*/ 'Horario no permitido';
            const msgInvalido = /*[[${trad.getTraduccion('citas.js.error_generico')}]]*/ 'Fecha no válida';

            // 1. Bloquear fechas pasadas
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours() + 1).padStart(2, '0');
            input.min = `${year}-${month}-${day}T${hours}:00`;

            input.addEventListener('change', function () {
                if (!this.value) return;
                const date = new Date(this.value);
                const hora = date.getHours();
                const minutos = date.getMinutes();

                if (minutos !== 0) {
                    alert(msgHoraExacta);
                    this.value = "";
                    return;
                }

                const esMañana = (hora >= 8 && hora <= 12);
                const esTarde = (hora >= 14 && hora <= 16);

                if (!esMañana && !esTarde) {
                    alert(msgHorarioPermitido);
                    this.value = "";
                }
            });

            document.getElementById('citaForm').addEventListener('submit', function (e) {
                if (!input.value) return;
                const date = new Date(input.value);
                const hora = date.getHours();
                const esValido = (hora >= 8 && hora <= 12) || (hora >= 14 && hora <= 16);

                if (!esValido || date.getMinutes() !== 0) {
                    alert(msgInvalido);
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
