<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')">
    <th:block th:replace="~{Reutilizable/layout :: head_general}"></th:block>
    <title th:text="${cita.id == null ? trad.getTraduccion('citas.form.titulo.nuevo') : trad.getTraduccion('citas.form.titulo.editar')}">
        Cita
    </title>
</head>

<head sec:authorize="hasRole('RECEPCIONISTA')" 
      th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}">
</head>

<body class="bg-light">

    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    
    <div sec:authorize="hasRole('RECEPCIONISTA')">
        <div th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>
    </div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid">
            
            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" id="citaForm">
                
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{estado}" th:if="*{id != null}" />

                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-calendar-plus text-primary fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-dark"
                                    th:text="${cita.id == null ? trad.getTraduccion('citas.btn.anadir') : trad.getTraduccion('citas.form.titulo.editar')}">
                                </h3>
                                <p class="mb-0 text-muted small" th:text="${trad.getTraduccion('mod.citas.desc')}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        
                        <div th:if="${errorNegocio}"
                            class="alert alert-danger border-0 d-flex align-items-center mb-4 shadow-sm">
                            <i class="bi bi-exclamation-octagon-fill me-2"></i>
                            <div th:text="${errorNegocio}"></div>
                        </div>

                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary"
                                    th:text="${trad.getTraduccion('citas.form.label.paciente')}"></label>
                                <select th:field="*{paciente}" class="form-select border-0 bg-light py-2"
                                    th:classappend="${#fields.hasErrors('paciente')} ? 'is-invalid'" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.buscar')}">
                                    </option>
                                    <option th:each="p : ${pacientes}" th:value="${p.id}"
                                        th:text="${p.nombre + ' ' + p.apellidos}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{paciente}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary"
                                    th:text="${trad.getTraduccion('citas.tabla.fechahora')}"></label>
                                <input type="datetime-local" th:field="*{fechaHora}" id="fechaHoraInput" step="3600"
                                    class="form-control border-0 bg-light py-2"
                                    th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
                                <small class="text-muted">Solo horas en punto (ej. 10:00). No se permiten citas pasadas.</small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary"
                                    th:text="${trad.getTraduccion('citas.form.label.profesional')}"></label>
                                <select th:field="*{profesional}" class="form-select border-0 bg-light py-2"
                                    th:classappend="${#fields.hasErrors('profesional')} ? 'is-invalid'" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.medico')}">
                                    </option>
                                    <option th:each="pro : ${profesionales}" th:value="${pro.id}"
                                        th:text="${pro.nombre + ' ' + pro.apellidos}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{profesional}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary"
                                    th:text="${trad.getTraduccion('citas.form.label.especialidad')}"></label>
                                <select th:field="*{especialidad}" class="form-select border-0 bg-light py-2" required>
                                    <option value="" th:text="${trad.getTraduccion('citas.placeholder.especialidad')}">
                                    </option>
                                    <option th:each="esp : ${especialidades}" th:value="${esp}" th:text="${esp}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{especialidad}"></div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold small text-secondary"
                                    th:text="${trad.getTraduccion('citas.form.label.motivo')}"></label>
                                <textarea th:field="*{motivo}" class="form-control border-0 bg-light py-2" rows="3"
                                    th:placeholder="${trad.getTraduccion('citas.placeholder.motivo')}"></textarea>
                                <div class="invalid-feedback" th:errors="*{motivo}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/citas}" class="btn btn-light px-4 fw-bold text-secondary"
                            th:text="${trad.getTraduccion('btn.cancelar')}"></a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                            <i class="bi bi-save me-2"></i>
                            <span th:text="${trad.getTraduccion('btn.guardar')}"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: scripts}"></div>
    
    <div sec:authorize="hasRole('RECEPCIONISTA')">
        <div th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}"></div>
    </div>

    <script>
        // Lógica JS del formulario
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours() + 1).padStart(2, '0');
        // Si quieres bloquear el pasado:
        // document.getElementById('fechaHoraInput').min = `${year}-${month}-${day}T${hours}:00`;

        document.getElementById('citaForm').addEventListener('submit', function (e) {
            const input = document.getElementById('fechaHoraInput');
            if (input.value) {
                const date = new Date(input.value);
                const minutos = date.getMinutes();

                if (minutos !== 0) {
                    alert("Por favor, seleccione una hora exacta (ej: 10:00).");
                    e.preventDefault();
                }
            }
        });
    </script>
</body>
</html>
