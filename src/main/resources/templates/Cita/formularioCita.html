<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title
        th:text="${cita.id == null ? trad.getTraduccion('citas.form.titulo.nuevo') : trad.getTraduccion('citas.form.titulo.editar')}">
    </title>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">
            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/citas}" th:text="${trad.getTraduccion('mod.citas')}">Citas</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${cita.id == null ? trad.getTraduccion('citas.btn.anadir') : trad.getTraduccion('citas.form.titulo.editar')}">
                        </li>
                    </ol>
                </nav>
            </div>

            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{estado}" th:if="*{id != null}" />

                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-calendar-plus text-primary fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-dark"
                                    th:text="${cita.id == null ? trad.getTraduccion('citas.btn.anadir') : trad.getTraduccion('citas.form.titulo.editar')}">
                                </h3>
                                <p class="mb-0 text-muted small" th:text="${trad.getTraduccion('mod.citas.desc')}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        <div th:if="${errorNegocio}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                            <i class="bi bi-exclamation-octagon-fill me-2"></i>
                            <div th:text="${errorNegocio}"></div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary"
                                    th:text="${trad.getTraduccion('citas.form.seccion.paciente')}"></h5>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('citas.form.seccion.paciente.desc')}"></p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('citas.form.label.paciente')}"></label>
                                        <select th:field="*{paciente}" class="form-select border-0 bg-light py-2"
                                            th:classappend="${#fields.hasErrors('paciente')} ? 'is-invalid'">
                                            <option value=""
                                                th:text="${trad.getTraduccion('citas.placeholder.buscar')}"></option>
                                            <option th:each="p : ${pacientes}" th:value="${p.id}"
                                                th:text="${p.nombre + ' ' + p.apellidos}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{paciente}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('citas.tabla.fechahora')}"></label>
                                        <input type="datetime-local" id="fechaHoraInput" th:field="*{fechaHora}"
                                            step="3600" class="form-control border-0 bg-light py-2"
                                            th:classappend="${#fields.hasErrors('fechaHora')} ? 'is-invalid'" required>
                                        <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary" th:text="${trad.getTraduccion('citas.form.label.medico')}">
                                </h5>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('citas.form.seccion.medico.desc')}"></p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('citas.form.label.profesional')}"></label>
                                        <select th:field="*{profesional}" class="form-select border-0 bg-light py-2"
                                            th:classappend="${#fields.hasErrors('profesional')} ? 'is-invalid'">
                                            <option value=""
                                                th:text="${trad.getTraduccion('citas.placeholder.medico')}"></option>
                                            <option th:each="e : ${empleados}" th:value="${e.id}"
                                                th:text="${e.nombre + ' ' + e.apellidos}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:errors="*{profesional}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('citas.form.label.especialidad')}"></label>
                                        <input type="text" th:field="*{especialidad}"
                                            th:classappend="${#fields.hasErrors('especialidad')} ? 'is-invalid'"
                                            class="form-control border-0 bg-light py-2"
                                            th:placeholder="${trad.getTraduccion('citas.placeholder.especialidad')}">
                                        <div class="invalid-feedback" th:errors="*{especialidad}"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('citas.form.label.motivo')}"></label>
                                        <textarea th:field="*{motivo}"
                                            th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid'"
                                            class="form-control border-0 bg-light py-2" rows="3"
                                            th:placeholder="${trad.getTraduccion('citas.placeholder.motivo')}"></textarea>
                                        <div class="invalid-feedback" th:errors="*{motivo}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/citas}" class="btn btn-light px-4 fw-bold text-secondary"
                            th:text="${trad.getTraduccion('btn.cancelar')}"></a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                            <i class="bi bi-save me-2"></i>
                            <span th:text="${trad.getTraduccion('btn.guardar')}"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
