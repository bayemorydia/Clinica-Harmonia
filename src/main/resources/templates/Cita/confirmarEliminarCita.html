<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('citas.anular.titulo')}">Anular Cita</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                        <div class="card-header bg-danger text-white py-3 text-center border-0">
                            <h4 class="mb-0 fw-bold">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span th:text="${trad.getTraduccion('citas.anular.confirmacion')}">¿Anular Cita Médica?</span>
                            </h4>
                        </div>

                        <div class="card-body p-4 text-center">
                            <p class="text-muted" th:text="${trad.getTraduccion('citas.anular.subtitulo')}">
                                La cita se marcará como anulada y el horario quedará disponible.
                            </p>

                            <div class="bg-light p-4 rounded-4 border border-light-subtle mb-4">
                                <div class="mb-3">
                                    <span class="text-muted small text-uppercase fw-bold d-block mb-1" th:text="${trad.getTraduccion('citas.tabla.paciente')}">Paciente</span>
                                    <h5 th:text="${cita.paciente.nombre} + ' ' + ${cita.paciente.apellidos}" class="text-dark fw-bold"></h5>
                                </div>
                                <div class="mb-3">
                                    <span class="text-muted small text-uppercase fw-bold d-block mb-1" th:text="${trad.getTraduccion('citas.tabla.medico')}">Profesional</span>
                                    <h5 class="text-dark">
                                        <span th:text="${cita.profesional != null ? cita.profesional.nombre + ' ' + cita.profesional.apellidos : cita.nombreMedico}"></span>
                                    </h5>
                                </div>
                                <div class="mb-0">
                                    <span class="text-muted small text-uppercase fw-bold d-block mb-1" th:text="${trad.getTraduccion('citas.tabla.fecha')}">Fecha y Hora</span>
                                    <h5 th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')} + ' h'" class="text-primary fw-bold"></h5>
                                </div>
                            </div>

                            <form th:action="@{/citas/anular}" method="post">
                                <input type="hidden" name="id" th:value="${cita.id}" />

                                <div class="d-flex gap-3 justify-content-center mt-4">
                                    <a th:href="@{/citas}" class="btn btn-light rounded-pill px-4 fw-bold">
                                        <span th:text="${trad.getTraduccion('btn.cancelar')}">Volver</span>
                                    </a>
                                    <button type="submit" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                                        <i class="bi bi-x-circle me-2"></i>
                                        <span th:text="${trad.getTraduccion('btn.confirmar.anular')}">Confirmar Anulación</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
