<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Agenda de Citas | Clínica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0"><i class="bi bi-calendar3 me-2"></i>Agenda General de Citas</h4>
                <a th:href="@{/citas/nueva}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> Programar Cita
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Especialidad</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${citas}">
                                <td class="fw-bold text-primary"
                                    th:text="${#temporals.format(c.fechaHora, 'dd/MM/yyyy HH:mm')} + 'h'"></td>
                                <td th:text="${c.paciente.nombre + ' ' + c.paciente.apellidos}"></td>
                                <td>
                                    <i class="bi bi-person-badge text-muted me-1"></i>
                                    <span th:text="${c.nombreMedico}"></span>
                                </td>
                                <td th:text="${c.especialidad}"></td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${c.estado.name() == 'PROGRAMADA' ? 'bg-info' : 'bg-success'}"
                                        th:text="${c.estado}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/citas/editar/{id}(id=${c.id})}"
                                        class="btn btn-sm btn-outline-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/citas/confirmarEliminar/{id}(id=${c.id})}"
                                        class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(citas)}">
                                <td colspan="6" class="text-center py-4 text-muted">No hay citas programadas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-link text-decoration-none">
                &larr; Volver al Inicio
            </a>
        </div>
    </div>
</body>

</html>
