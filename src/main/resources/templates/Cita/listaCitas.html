<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${trad.getTraduccion('mod.citas')}">Gestión de Citas</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body { background-color: var(--background-color); color: var(--text-main); font-family: 'Inter', -apple-system, sans-serif; }
        .glass-card { background: var(--surface-color); border-radius: 16px; border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }
        
        .search-container { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 2px 15px; transition: all 0.2s ease; }
        .search-container:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1); }
        .search-container input { border: none; box-shadow: none !important; }

        .date-box { width: 55px; height: 55px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
        
        .table thead th { background-color: #fcfcfc; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.03em; color: var(--text-muted); padding: 16px; border-top: none; }
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.02) !important; }

        .badge-pill-custom { padding: 6px 12px; border-radius: 50px; font-weight: 500; font-size: 0.75rem; }
        .select-paginacion-clean { width: 75px; padding: 0.375rem; font-size: 0.85rem; border: 1px solid #dee2e6; border-radius: 8px; appearance: none; }
        
        .bg-status-programada { background-color: #e7f1ff; color: #0d6efd; }
        .bg-status-realizada { background-color: #e6f6ec; color: #198754; }
        .bg-status-anulada { background-color: #fbe9eb; color: #dc3545; }

        .hover-lift:hover { transform: translateY(-2px); }
        .transition-all { transition: all 0.2s ease; }
    </style>
</head>

<body>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'" class="py-5">
        <div class="container-fluid">
            
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.citas')}">Gestión de Citas</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('citas.listado.subtitulo')}">Programación de servicios médicos.</p>
                </div>
                <a th:href="@{/citas/nueva}" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold transition-all hover-lift">
                    <i class="bi bi-calendar-plus me-2"></i>
                    <span th:text="${trad.getTraduccion('citas.btn.anadir')}">Nueva Cita</span>
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="search-container d-flex align-items-center">
                                <i class="bi bi-search text-muted me-2"></i>
                                <input type="text" id="searchInput" class="form-control" th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="statusFilter" class="form-select border-0 shadow-sm" style="border-radius: 10px; height: 45px;" onchange="updateTable(0)">
                                <option value="" th:text="${trad.getTraduccion('pacientes.filtro.todos')}">Todos los estados</option>
                                <option th:each="est : ${estadosCita}" th:value="${est}" th:text="${trad.getTraduccion('citas.estado.' + est.name())}" th:selected="${est == estadoFiltro}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaCitas">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('citas.tabla.fechahora')}">FECHA Y HORA</th>
                                        <th th:text="${trad.getTraduccion('citas.tabla.paciente')}">PACIENTE</th>
                                        <th th:text="${trad.getTraduccion('citas.tabla.medico')}">MÉDICO</th>
                                        <th th:text="${trad.getTraduccion('citas.tabla.estado')}">ESTADO</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('citas.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(citas)}">
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <i class="bi bi-calendar-x fs-2 d-block mb-2 opacity-25"></i>
                                            <span th:text="${trad.getTraduccion('citas.tabla.vacio')}">No hay citas.</span>
                                        </td>
                                    </tr>
                                    <tr th:each="c : ${citas}" class="border-bottom clickable-row" th:data-href="@{'/citas/detalle/' + ${c.id}}">
                                        <td class="ps-4 py-3">
                                            <div class="d-flex align-items-center">
                                                <div class="date-box bg-primary bg-opacity-10 text-primary me-3">
                                                    <span class="fw-bold" th:text="${#temporals.format(c.fechaHora, 'dd')}"></span>
                                                    <span class="small text-uppercase" style="font-size: 0.6rem;" th:text="${#temporals.format(c.fechaHora, 'MMM')}"></span>
                                                </div>
                                                <div>
                                                    <div class="fw-bold text-dark mb-0" th:text="${#temporals.format(c.fechaHora, 'HH:mm')} + ' h'"></div>
                                                    <div class="text-muted small" th:text="${#temporals.format(c.fechaHora, 'yyyy')}"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="fw-bold text-dark" th:text="${c.paciente.nombre + ' ' + c.paciente.apellidos}"></div>
                                            <div class="text-muted small font-monospace" th:text="${c.paciente.dni}"></div>
                                        </td>
                                        <td>
                                            <div class="fw-bold text-dark mb-0">
                                                <i class="bi bi-person-badge me-1 text-muted"></i>
                                                <span th:text="${c.profesional != null ? c.profesional.nombre + ' ' + c.profesional.apellidos : trad.getTraduccion('citas.msg.no_asignado')}"></span>
                                            </div>
                                            <span class="badge bg-info-subtle text-info mt-1" style="font-size: 0.65rem;" th:text="${c.especialidad}"></span>
                                        </td>
                                        <td>
                                            <span class="badge-pill-custom"
                                                  th:classappend="${c.estado.name() == 'PROGRAMADA' ? 'bg-status-programada' : (c.estado.name() == 'ANULADA' ? 'bg-status-anulada' : 'bg-status-realizada')}"
                                                  th:text="${trad.getTraduccion('citas.estado.' + c.estado.name())}"></span>
                                        </td>
                                        <td class="text-center" onclick="event.stopPropagation();">
                                            <div class="d-inline-flex gap-2">
                                                <a th:if="${c.estado.name() != 'ANULADA'}" th:href="@{/citas/factura/{id}(id=${c.id})}" class="btn btn-sm btn-light border rounded-pill shadow-sm">
                                                    <i class="bi bi-file-earmark-pdf-fill text-danger"></i>
                                                </a>
                                                <a th:if="${c.estado.name() == 'PROGRAMADA'}" th:href="@{'/citas/confirmarEliminar/' + ${c.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm">
                                                    <i class="bi bi-x-circle me-1"></i> <span th:text="${trad.getTraduccion('btn.anular')}">Anular</span>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-4 bg-white border-top d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}"></span>
                                <span class="fw-bold text-dark" th:text="${totalElements > 0 ? (currentPage * size) + 1 : 0}"></span> - 
                                <span class="fw-bold text-dark" th:text="${(currentPage * size) + citas.size()}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.de')}"></span>
                                <span class="fw-bold text-dark" th:text="${totalElements}"></span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                </select>

                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                        </li>
                                        <li class="page-item active"><span class="page-link" th:text="${currentPage + 1}"></span></li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    
    <script th:inline="javascript">
        // 1. Función para asignar clics a las filas
        function initTableEvents() {
            document.querySelectorAll(".clickable-row").forEach(row => {
                row.addEventListener("click", function (e) {
                    // Evitar redirección si se hace clic en botones o enlaces de acción
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    
                    const url = this.getAttribute("data-href");
                    if (url) window.location.href = url;
                });
            });
        }

        // 2. Inicialización al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            initTableEvents();

            let searchTimeout;
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => updateTable(0), 400);
                });
            }
        });

        // 3. Función de actualización AJAX
        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const estado = document.getElementById('statusFilter').value;
            const container = document.getElementById('tablaContainer');
            
            let url = `/citas?query=${encodeURIComponent(query)}&page=${page}&size=${size}`;
            if (estado) url += `&estado=${estado}`;

            fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                .then(r => r.text())
                .then(html => {
                    container.innerHTML = html;
                    // RE-INICIALIZAR EVENTOS TRAS CARGAR NUEVOS DATOS
                    initTableEvents();
                })
                .catch(err => console.error("Error actualizando tabla:", err));
        }

        // 4. Cambio de página
        function changePage(page) {
            const totalPagesEl = document.getElementById('hiddenTotalPages');
            if (totalPagesEl) {
                const total = parseInt(totalPagesEl.value);
                if (page >= 0 && page < total) updateTable(page);
            }
        }
    </script>
</body>
</html>
