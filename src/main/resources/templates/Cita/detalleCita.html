<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${trad.getTraduccion('cita.detalle.cabecera')}"></title>
</head>

<body class="bg-light">
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid py-4">
            
            <div class="card shadow-sm border-0 mx-auto" style="border-radius: 15px; max-width: 1000px;">
                <div class="card-header bg-white border-0 py-4 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div>
                            <h4 class="fw-bold mb-0 text-dark" th:text="${trad.getTraduccion('cita.detalle.cabecera')}">Resumen de la Cita</h4>
                            <p class="text-muted small mb-0" th:text="${trad.getTraduccion('cita.detalle.subtitulo')}">Información confirmada del servicio programado.</p>
                        </div>
                    </div>
                    
                    <span th:class="${cita.estado.name() == 'PROGRAMADA' ? 'badge rounded-pill bg-primary-soft text-primary px-3 py-2' : (cita.estado.name() == 'ANULADA' ? 'badge rounded-pill bg-danger-soft text-danger px-3 py-2' : 'badge rounded-pill bg-success-soft text-success px-3 py-2')}"
                          th:text="${trad.getTraduccion('citas.estado.' + cita.estado.name())}">
                    </span>
                </div>

                <div class="card-body p-4 p-md-5">
                    
                    <div class="row mb-5">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-primary text-uppercase small" th:text="${trad.getTraduccion('cita.detalle.sec.agenda')}">Agenda y Servicio</h6>
                            <p class="text-muted small" th:text="${trad.getTraduccion('cita.detalle.sec.agenda.desc')}">Detalles cronológicos y especialidad médica.</p>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.fechahora')}"></label>
                                    <div class="p-3 bg-light rounded-3 border-0 d-flex align-items-center">
                                        <i class="bi bi-calendar-check text-primary me-3 fs-5"></i>
                                        <span class="fw-bold text-dark" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')} + ' h'"></span>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.especialidad')}"></label>
                                    <div class="p-3 bg-light rounded-3 border-0 d-flex align-items-center">
                                        <i class="bi bi-stethoscope text-primary me-3 fs-5"></i>
                                        <span class="fw-bold text-dark" th:text="${cita.especialidad}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="row mb-5">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-primary text-uppercase small" th:text="${trad.getTraduccion('cita.detalle.sec.participantes')}">Participantes</h6>
                            <p class="text-muted small" th:text="${trad.getTraduccion('cita.detalle.sec.participantes.desc')}">Paciente y profesional asignado.</p>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.paciente')}"></label>
                                    <div class="p-3 bg-light rounded-3 border-0 d-flex align-items-center">
                                        <div class="bg-white rounded-circle p-2 me-3 shadow-sm"><i class="bi bi-person text-primary"></i></div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${cita.paciente.nombre + ' ' + cita.paciente.apellidos}"></div>
                                            <div class="text-muted small font-monospace" th:text="${cita.paciente.dni}"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.medico')}"></label>
                                    <div class="p-3 bg-light rounded-3 border-0 d-flex align-items-center">
                                        <div class="bg-white rounded-circle p-2 me-3 shadow-sm"><i class="bi bi-person-badge text-primary"></i></div>
                                        <div>
                                            <div class="fw-bold text-dark" th:text="${cita.profesional.nombre + ' ' + cita.profesional.apellidos}"></div>
                                            <div class="text-muted small" th:text="${cita.profesional.rol.nombre}"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <div class="row">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-primary text-uppercase small" th:text="${trad.getTraduccion('cita.label.motivo')}">Motivo</h6>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="p-4 bg-light rounded-4 border-0 min-vh-10 text-dark shadow-inner" 
                                 th:text="${cita.motivo != null && !cita.motivo.isEmpty() ? cita.motivo : 'Sin observaciones detalladas.'}">
                            </div>
                            
                            <div class="mt-5 d-flex justify-content-between align-items-center">
                                <a th:href="@{/citas}" class="btn btn-light rounded-pill px-4 fw-bold text-secondary border">
                                    <i class="bi bi-collection me-2"></i> <span th:text="${trad.getTraduccion('btn.volver_listado')}"></span>
                                </a>
                                
                                <div th:if="${cita.estado.name() == 'PROGRAMADA'}">
                                    <a th:href="@{'/citas/confirmarEliminar/' + ${cita.id}}" class="btn btn-danger rounded-pill px-4 shadow-sm fw-bold">
                                        <i class="bi bi-x-circle me-2"></i> <span th:text="${trad.getTraduccion('btn.anular')}"></span>
                                    </a>
                                </div>
                                <div th:unless="${cita.estado.name() == 'PROGRAMADA'}" class="alert alert-warning py-2 px-3 rounded-pill mb-0 border-0 small">
                                    <i class="bi bi-lock-fill me-1"></i> <span th:text="${trad.getTraduccion('citas.detalle.no_modificable')}"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    <style>
        .bg-primary-soft { background-color: #e7f1ff; color: #0d6efd; }
        .bg-success-soft { background-color: #e6f6ec; color: #198754; }
        .bg-danger-soft { background-color: #fbe9eb; color: #dc3545; }
        .shadow-inner { box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05); }
        .btn-white { background: white; color: #6c757d; }
    </style>
</body>
</html>
