<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${trad.getTraduccion('cita.detalle.cabecera')}"></title>
</head>

<body class="bg-light">
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid py-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-header bg-white border-0 pt-4 px-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold mb-0 text-primary">
                                    <i class="bi bi-info-circle-fill me-2"></i>
                                    <span th:text="${trad.getTraduccion('cita.detalle.cabecera')}"></span>
                                </h5>
                                <span class="badge rounded-pill px-3 py-2"
                                    th:classappend="${cita.estado.name() == 'PROGRAMADA' ? 'bg-primary-subtle text-primary' : (cita.estado.name() == 'ANULADA' ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success')}"
                                    th:text="${trad.getTraduccion('citas.estado.' + cita.estado.name())}">
                                </span>
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.paciente')}"></label>
                                        <div class="p-2 border-bottom bg-light bg-opacity-50 rounded"><i class="bi bi-person me-2 text-primary"></i><span th:text="${cita.paciente.nombre + ' ' + cita.paciente.apellidos}"></span></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.medico')}"></label>
                                        <div class="p-2 border-bottom bg-light bg-opacity-50 rounded"><i class="bi bi-person-badge me-2 text-primary"></i><span th:text="${cita.profesional.nombre + ' ' + cita.profesional.apellidos}"></span></div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.fechahora')}"></label>
                                        <div class="p-2 border-bottom bg-light bg-opacity-50 rounded"><i class="bi bi-calendar3 me-2 text-primary"></i><span th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></span></div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.especialidad')}"></label>
                                        <div class="p-2 border-bottom bg-light bg-opacity-50 rounded"><i class="bi bi-stethoscope me-2 text-primary"></i><span th:text="${cita.especialidad}"></span></div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-secondary text-uppercase" th:text="${trad.getTraduccion('cita.label.motivo')}"></label>
                                    <div class="p-2 border bg-light bg-opacity-50 rounded" style="min-height: 80px;" th:text="${cita.motivo}"></div>
                                </div>
                            </div>

                            <div class="mt-5 pt-4 border-top d-flex justify-content-between align-items-center">
                                <a th:href="@{/citas}" class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                                    <i class="bi bi-arrow-left me-2"></i> <span th:text="${trad.getTraduccion('btn.volver_listado')}"></span>
                                </a>
                                <div th:if="${cita.estado.name() == 'PROGRAMADA'}">
                                    <a th:href="@{'/citas/confirmarEliminar/' + ${cita.id}}" class="btn btn-danger rounded-pill px-4 shadow-sm">
                                        <i class="bi bi-x-circle me-2"></i> <span th:text="${trad.getTraduccion('btn.anular')}"></span>
                                    </a>
                                </div>
                                <div th:unless="${cita.estado.name() == 'PROGRAMADA'}" class="text-muted small italic">
                                    <i class="bi bi-lock-fill me-1"></i> <span th:text="${trad.getTraduccion('citas.detalle.no_modificable')}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
