<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Confirmar Baja</title>
</head>
<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <div class="card shadow-lg border-0 p-5" style="border-radius: 20px;">
                        <div class="mb-4"><i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i></div>
                        <h3 class="fw-bold mb-3">¿Desactivar producto?</h3>
                        <p class="text-muted mb-4">Está a punto de retirar del catálogo activo: <br>
                        <strong class="text-dark" th:text="${medicamento.nombre}">Nombre</strong></p>
                        <form th:action="@{/medicamentos/desactivar}" method="post">
                            <input type="hidden" name="id" th:value="${medicamento.id}">
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold">Confirmar Baja</button>
                                <a th:href="@{/medicamentos}" class="btn btn-light btn-lg rounded-pill border">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
