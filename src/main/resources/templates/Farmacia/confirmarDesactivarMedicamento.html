<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Desactivar Medicamento</title>
</head>
<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                        <div class="card-header bg-warning text-dark py-3 text-center border-0">
                            <h4 class="mb-0 fw-bold"><i class="bi bi-exclamation-circle-fill me-2"></i> ¿Desactivar Medicamento?</h4>
                        </div>
                        <div class="card-body p-4 text-center">
                            <p class="text-muted">El medicamento dejará de estar disponible para nuevas facturas, pero se mantendrá en el registro.</p>
                            <div class="bg-light p-4 rounded-4 border border-light-subtle mb-4">
                                <h5 th:text="${medicamento.nombre}" class="text-dark fw-bold mb-1"></h5>
                                <span class="text-muted" th:text="${medicamento.codigo}"></span>
                            </div>
                            <form th:action="@{/medicamentos/desactivar/confirmado}" method="post">
                                <input type="hidden" name="id" th:value="${medicamento.id}" />
                                <div class="d-flex gap-3 justify-content-center mt-4">
                                    <a th:href="@{/medicamentos/listar}" class="btn btn-light rounded-pill px-4 fw-bold">Volver</a>
                                    <button type="submit" class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm">Confirmar Desactivación</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
