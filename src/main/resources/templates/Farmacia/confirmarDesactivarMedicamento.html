<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('medicamento.desactivar.titulo')}">Confirmar Baja</title>
</head>
<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    
    <main class="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                        
                        <div class="card-header bg-white border-0 py-4 px-4">
                            <div class="d-flex align-items-center">
                                <div class="bg-warning bg-opacity-10 p-3 rounded-3 me-3">
                                    <i class="bi bi-exclamation-triangle-fill text-warning fs-4"></i>
                                </div>
                                <div>
                                    <h3 class="mb-0 fw-bold text-dark" th:text="${trad.getTraduccion('paciente.eliminar.titulo')}">Confirmar Acción</h3>
                                    <p class="mb-0 text-muted small" th:text="${trad.getTraduccion('paciente.eliminar.subtitulo')}">Esta acción modificará el estado del registro</p>
                                </div>
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5 text-center">
                            <p class="lead fw-semibold text-dark mb-4" th:text="${trad.getTraduccion('medicamento.desactivar.pregunta')}">¿Desea retirar este producto del catálogo activo?</p>

                            <div class="bg-light p-4 rounded-4 border border-light-subtle mb-4">
                                <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                    style="width: 60px; height: 60px;">
                                    <i class="bi bi-capsule-pill fs-3"></i>
                                </div>
                                <h5 class="fw-bold mb-1 text-dark" th:text="${medicamento.nombre}">Nombre</h5>
                                <p class="mb-0 text-muted font-monospace small" th:text="${trad.getTraduccion('lbl.codigo')} + ': ' + ${medicamento.codigo}"></p>
                            </div>

                            <div class="alert alert-warning border-0 small mb-0 shadow-sm text-start">
                                <i class="bi bi-info-circle me-2"></i>
                                <span th:text="${trad.getTraduccion('medicamento.desactivar.aviso')}">
                                    El medicamento dejará de estar disponible para nuevas recetas, pero se mantendrá en los registros históricos.
                                </span>
                            </div>

                            <form th:action="@{/medicamentos/desactivar}" method="post" class="mt-5">
                                <input type="hidden" name="id" th:value="${medicamento.id}" />

                                <div class="d-flex justify-content-center gap-3">
                                    <a th:href="@{/medicamentos}" class="btn btn-light px-4 py-2 fw-bold text-secondary rounded-pill">
                                        <span th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</span>
                                    </a>
                                    <button type="submit" class="btn btn-warning px-4 py-2 fw-bold shadow-sm rounded-pill transition-all hover-lift">
                                        <i class="bi bi-dash-circle-fill me-2"></i>
                                        <span th:text="${trad.getTraduccion('btn.confirmar.desactivar')}">Desactivar Producto</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                            <small class="text-muted italic" th:text="${trad.getTraduccion('footer.modulo.seguridad')}">Módulo de Seguridad</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    
    <style>
        .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.1)!important; }
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</body>
</html>
