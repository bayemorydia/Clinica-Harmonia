<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${medicamento.id == null ? 'Nuevo Medicamento' : 'Detalle Medicamento'}"></title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container py-4">
            <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="row g-4 justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0" style="border-radius: 15px;">
                            <div class="card-header bg-white border-0 py-4 px-4 d-flex align-items-center">
                                <div class="bg-success bg-opacity-10 p-3 rounded-3 me-3"><i
                                        class="bi bi-capsule text-success fs-3"></i></div>
                                <div>
                                    <h3 class="mb-0 fw-bold text-dark"
                                        th:text="${medicamento.id == null ? 'Nuevo Medicamento' : 'Edición de Producto'}">
                                    </h3>
                                    <p class="mb-0 text-muted small">Catálogo maestro de productos sanitarios.</p>
                                </div>
                            </div>

                            <div class="card-body p-4 p-md-5">
                                <div th:if="${error}" class="alert alert-danger rounded-pill px-4 border-0 mb-4"
                                    th:text="${error}"></div>

                                <div class="row g-4">
                                    <div class="col-12">
                                        <label class="form-label small fw-bold text-secondary text-uppercase">Nombre
                                            Comercial</label>
                                        <input type="text" th:field="*{nombre}"
                                            class="form-control bg-light border-0 py-2"
                                            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase">Código
                                            Referencia</label>
                                        <input type="text" th:field="*{codigo}"
                                            class="form-control bg-light border-0 py-2"
                                            th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase">Categoría
                                            / Tipo</label>
                                        <input type="text" th:field="*{tipo}"
                                            class="form-control bg-light border-0 py-2"
                                            th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                                    </div>
                                </div>

                                <div class="card-footer bg-white border-0 p-0 mt-5 d-flex justify-content-between">
                                    <a th:href="@{/medicamentos}"
                                        class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                                        <i class="bi bi-arrow-left me-2"></i> Volver
                                    </a>
                                    <button type="submit" class="btn btn-success rounded-pill px-5 shadow-lg fw-bold">
                                        <i class="bi bi-save me-2"></i> Guardar Cambios
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
