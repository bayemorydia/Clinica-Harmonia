<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Datos del Medicamento</title>
</head>

<body class="bg-light">
    
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7"> <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        
                        <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                            <h4 class="fw-bold text-success"> <i class="bi bi-capsule me-2"></i>
                                <span th:text="${medicamento.id != null} ? 'Editar Medicamento' : 'Nuevo Medicamento'">Medicamento</span>
                            </h4>
                        </div>

                        <div class="card-body p-4">
                            <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post" novalidate>
                                
                                <input type="hidden" th:field="*{id}" />

                                <div class="row mb-3">
                                    <div class="col-md-8">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Nombre Comercial</label>
                                        <input type="text" th:field="*{nombre}" class="form-control rounded-3" 
                                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" placeholder="Ej: Paracetamol 1g"/>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Código</label>
                                        <input type="text" th:field="*{codigo}" class="form-control rounded-3" 
                                               th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'" placeholder="REF-001"/>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted text-uppercase">Categoría / Tipo</label>
                                    <input type="text" th:field="*{tipo}" class="form-control rounded-3" 
                                           th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'" placeholder="Ej: Analgésico, Antibiótico..."/>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                                </div>

                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Stock Actual</label>
                                        <div class="input-group">
                                            <input type="number" th:field="*{stockActual}" class="form-control rounded-start" 
                                                   th:classappend="${#fields.hasErrors('stockActual')} ? 'is-invalid'"/>
                                            <span class="input-group-text bg-white text-muted">ud.</span>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockActual')}" th:errors="*{stockActual}"></div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-muted text-uppercase">Stock Mínimo</label>
                                        <div class="input-group">
                                            <input type="number" th:field="*{stockMinimo}" class="form-control rounded-start" 
                                                   th:classappend="${#fields.hasErrors('stockMinimo')} ? 'is-invalid'"/>
                                            <span class="input-group-text bg-white text-muted">ud.</span>
                                            <div class="invalid-feedback" th:if="${#fields.hasErrors('stockMinimo')}" th:errors="*{stockMinimo}"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 pt-2 border-top mt-4">
                                    <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm flex-grow-1">
                                        <i class="bi bi-save me-2"></i> Guardar
                                    </button>
                                    <a th:href="@{/medicamentos/listar}" class="btn btn-light rounded-pill px-4 fw-bold border">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
