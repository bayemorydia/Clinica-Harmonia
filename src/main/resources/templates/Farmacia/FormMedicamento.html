<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Medicamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0" th:text="${medicamento.id != null} ? 'Editar Medicamento' : 'Nuevo Medicamento'">
                    </h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/medicamentos/guardar}" th:object="${medicamento}" method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombre del Medicamento</label>
                                <input type="text" th:field="*{nombre}" class="form-control"
                                    placeholder="Ej: Paracetamol" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código</label>
                                <input type="text" th:field="*{codigo}" class="form-control" placeholder="Ej: MED-001"
                                    required />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo / Categoría</label>
                            <input type="text" th:field="*{tipo}" class="form-control" placeholder="Ej: Analgésico" />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Actual</label>
                                <input type="number" th:field="*{stockActual}" class="form-control" min="0" />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Mínimo</label>
                                <input type="number" th:field="*{stockMinimo}" class="form-control" min="0" />
                            </div>
                        </div>

                        <div class="mt-4 border-top pt-3 text-end">
                            <a th:href="@{/medicamentos/listar}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Medicamento</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
