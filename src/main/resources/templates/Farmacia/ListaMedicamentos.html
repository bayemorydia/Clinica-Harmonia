<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Medicamentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Medicamentos</h2>
        <a th:href="@{/medicamentos/nuevo}" class="btn btn-success">Registrar Nuevo</a>
    </div>

    <table class="table table-hover border">
        <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Código</th>
                <th>Tipo</th>
                <th>Stock</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="m : ${medicamentos}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.codigo}"></td>
                <td th:text="${m.tipo}"></td>
                <td th:text="${m.stockActual}"></td>
                <td>
                    <a th:href="@{/medicamentos/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                    <a th:href="@{/medicamentos/eliminar/{id}(id=${m.id})}" 
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este medicamento?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(medicamentos)}" class="alert alert-info">
        No hay medicamentos registrados actualmente.
    </div>

</body>
</html>
