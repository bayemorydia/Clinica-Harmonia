<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0 text-primary">Listado de Pacientes</h1>
                <a th:href="@{/pacientes/anadir}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> [[${btnAnadirPaciente}]]
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>DNI / NIE</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="paciente : ${pacientes}">
                                <td th:text="${paciente.id}" class="fw-bold"></td>
                                <td th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></td>
                                <td th:text="${paciente.dni}"></td>
                                <td>
                                    <span th:class="${paciente.activo} ? 'badge bg-success' : 'badge bg-danger'"
                                        th:text="${paciente.activo} ? 'Activo' : 'Inactivo'"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/pacientes/detalle/' + ${paciente.id}}"
                                        class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> Detalles
                                    </a>
                                    <a th:if="${paciente.activo}"
                                        th:href="@{'/pacientes/confirmarEliminar/' + ${paciente.id}}"
                                        class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-person-x"></i> Desactivar
                                    </a>
                                    <a th:if="${!paciente.activo}" th:href="@{'/pacientes/activar/' + ${paciente.id}}"
                                        class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-person-check"></i> Activar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-link text-decoration-none">
                &larr; Volver al Inicio
            </a>
        </div>
    </div>
</body>

</html>
