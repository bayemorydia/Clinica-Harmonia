<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h1 class="h3 mb-0 text-primary">Listado de Pacientes</h1>
                <a th:href="@{/pacientes/anadir}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> [[${btnAnadirPaciente}]]
                </a>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre Completo</th>
                                <th>DNI / NIE</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="paciente : ${pacientes}">
                                <td th:text="${paciente.id}" class="fw-bold"></td>
                                <td th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></td>
                                <td th:text="${paciente.dni}"></td>
                                <td class="text-center">
                                    <a th:href="@{'/pacientes/detalle/' + ${paciente.id}}"
                                        class="btn btn-sm btn-primary">
                                        <i class="bi bi-eye"></i> Ver Detalles
                                    </a>
                                    <a th:href="@{'/pacientes/confirmarEliminar/' + ${paciente.id}}"
                                        class="btn btn-sm btn-outline-danger">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card-footer bg-white text-end">
                <small class="text-muted">Total de registros: <span th:text="${#lists.size(pacientes)}">0</span></small>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-link text-decoration-none">
                &larr; Volver al Inicio
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
