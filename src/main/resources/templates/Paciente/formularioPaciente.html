<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title
        th:text="${paciente.id == null ? trad.getTraduccion('paciente.form.titulo.nuevo') : trad.getTraduccion('paciente.form.titulo.editar')}">
        Formulario</title>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">
            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/pacientes}"
                                th:text="${trad.getTraduccion('pacientes.lista.titulo')}">Pacientes</a></li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${paciente.id == null ? trad.getTraduccion('paciente.form.titulo.nuevo') : trad.getTraduccion('paciente.form.titulo.editar')}">
                            Registro</li>
                    </ol>
                </nav>
            </div>

            <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{fechaAlta}" />
                <input type="hidden" th:field="*{rutaFoto}" />

                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-person-gear text-primary fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-dark"
                                    th:text="${paciente.id == null ? trad.getTraduccion('paciente.form.titulo.nuevo') : trad.getTraduccion('paciente.form.titulo.editar')}">
                                    Formulario</h3>
                                <p class="mb-0 text-muted small"
                                    th:text="${trad.getTraduccion('paciente.form.subtitulo')}">Gestión de datos del
                                    expediente médico</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                            <i class="bi bi-exclamation-octagon me-2"></i>
                            <div th:text="${error}"></div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary"
                                    th:text="${trad.getTraduccion('paciente.form.sec.personal')}">Información Personal
                                </h5>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('paciente.form.sec.personal.desc')}">Datos
                                    identificativos.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.nombre')}">Nombre</label>
                                        <input type="text" th:field="*{nombre}"
                                            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2" placeholder="Juan">
                                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.apellidos')}">Apellidos</label>
                                        <input type="text" th:field="*{apellidos}"
                                            th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2" placeholder="Pérez García">
                                        <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.dni')}">DNI / NIE</label>
                                        <input type="text" th:field="*{dni}"
                                            th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2" placeholder="12345678A">
                                        <div class="invalid-feedback" th:errors="*{dni}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.nacimiento')}">Fecha
                                            Nacimiento</label>
                                        <input type="date" th:field="*{fechaNacimiento}"
                                            th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                                            th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2">
                                        <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.telefono')}">Teléfono</label>
                                        <input type="tel" th:field="*{telefono}"
                                            th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2" placeholder="999888777">
                                        <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary"
                                    th:text="${trad.getTraduccion('paciente.form.sec.contacto')}">Contacto y Salud</h5>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('paciente.form.sec.contacto.desc')}">Información de
                                    contacto.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.email')}">Email</label>
                                        <input type="email" th:field="*{email}"
                                            th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2"
                                            placeholder="correo@ejemplo.com">
                                        <div class="invalid-feedback" th:errors="*{email}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.seg_social')}">Nº Seguridad
                                            Social</label>
                                        <input type="text" th:field="*{numeroSeguridadSocial}"
                                            th:classappend="${#fields.hasErrors('numeroSeguridadSocial')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2">
                                        <div class="invalid-feedback" th:errors="*{numeroSeguridadSocial}"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('paciente.form.direccion')}">Dirección</label>
                                        <textarea th:field="*{direccion}"
                                            th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"
                                            class="form-control border-0 bg-light py-2" rows="3"></textarea>
                                        <div class="invalid-feedback" th:errors="*{direccion}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/pacientes}" class="btn btn-light px-4 fw-bold text-secondary"
                            th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm"
                            th:text="${trad.getTraduccion('btn.guardar')}">Guardar Paciente</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
