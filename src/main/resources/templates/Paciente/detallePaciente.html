<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del Paciente | Clínica Privada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                    <div class="card shadow border-0">

                        <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                            <h3 class="mb-0"><i class="bi bi-person-vcard me-2"></i><span th:text=" ${titulo}"></span></h3>
                            <span class="badge bg-light text-primary fs-6"
                                th:text="'Edad: ' + ${pacienteService.getEdadPaciente(paciente)}"></span>
                        </div>

                        <div class="card-body p-4">
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{rutaFoto}" />
                            <input type="hidden" th:field="*{fechaAlta}" />

                            <div class="p-3 mb-4 bg-secondary-subtle rounded border">
                                <label class="form-label fw-bold text-muted small text-uppercase">Fecha de Registro</label>
                                <div class="h5 mb-0">
                                    <i class="bi bi-calendar-check me-2"></i>
                                    <span th:text="${#temporals.format(paciente.fechaAlta, 'dd/MM/yyyy')}"></span>
                                </div>
                            </div>

                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nombre</label>
                                    <input type="text" th:field="*{nombre}" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Apellidos</label>
                                    <input type="text" th:field="*{apellidos}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">DNI / NIE</label>
                                    <input type="text" th:field="*{dni}" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Fecha de Nacimiento</label>
                                    <input type="date" name="fechaNacimiento"
                                        th:value="${paciente.fechaNacimiento != null ? #temporals.format(paciente.fechaNacimiento, 'yyyy-MM-dd') : ''}"
                                        class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Teléfono</label>
                                    <input type="tel" th:field="*{telefono}" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nº Seguridad Social</label>
                                    <input type="text" th:field="*{numeroSeguridadSocial}" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Dirección</label>
                                    <textarea th:field="*{direccion}" class="form-control" rows="2"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white p-4 d-flex justify-content-between">
                            <a th:href="@{/pacientes}" class="btn btn-outline-secondary px-4">Volver</a>
                            <button type="submit" class="btn btn-primary px-5 fw-bold shadow">Actualizar Información</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
