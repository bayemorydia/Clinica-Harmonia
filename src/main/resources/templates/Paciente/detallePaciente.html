<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Paciente | Gestión Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
            
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">
                        <i class="bi bi-person-vcard me-2"></i>
                        Detalle del Paciente: 
                        <span class="fw-light" th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></span>
                    </h3>
                    <span class="badge bg-light text-primary fs-6"
                        th:text="'Edad: ' + ${pacienteService.getEdadPaciente(paciente)} + ' años'"></span>
                </div>

                <div class="card-body p-4">
                    <input type="hidden" th:field="*{id}" />
                    <input type="hidden" th:field="*{fechaAlta}" />

                    <div class="row mb-4 pb-3 border-bottom text-center text-md-start">
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Estado del Paciente</label>
                            <select th:field="*{activo}" class="form-select border-primary">
                                <option th:value="true">🟢 Activo</option>
                                <option th:value="false">🔴 Inactivo</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Fecha de Registro</label>
                            <input type="text" class="form-control bg-light" 
                                   th:value="${#temporals.format(paciente.fechaAlta, 'dd/MM/yyyy')}" readonly>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <h5 class="text-primary border-start border-4 border-primary ps-2">Información Personal</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" class="form-control"
                                th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">DNI / NIE</label>
                            <input type="text" th:field="*{dni}" class="form-control"
                                th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Fecha de Nacimiento</label>
                            <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                                th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <h5 class="text-primary border-start border-4 border-primary ps-2">Contacto</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Teléfono</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="text" th:field="*{telefono}" class="form-control"
                                    th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control"
                                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Dirección Completa</label>
                            <input type="text" th:field="*{direccion}" class="form-control">
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-12">
                            <h5 class="text-primary border-start border-4 border-primary ps-2">Datos Sanitarios</h5>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Número de Seguridad Social (NSS)</label>
                            <input type="text" th:field="*{numeroSeguridadSocial}" class="form-control"
                                th:classappend="${#fields.hasErrors('numeroSeguridadSocial')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('numeroSeguridadSocial')}" th:errors="*{numeroSeguridadSocial}"></div>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <div th:if="${paciente.historial != null}" class="alert alert-info w-100 mb-0 py-2 border-0">
                                <i class="bi bi-file-earmark-medical me-2"></i>
                                Historial Clínico vinculado: <strong th:text="${paciente.historial.id}"></strong>
                            </div>
                            <div th:unless="${paciente.historial != null}" class="alert alert-warning w-100 mb-0 py-2 border-0">
                                <i class="bi bi-exclamation-circle me-2"></i> Sin historial clínico vinculado
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-white p-4 d-flex justify-content-between border-top">
                    <a th:href="@{/pacientes}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-arrow-left me-2"></i>Cancelar y Volver
                    </a>
                    <div>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow">
                            <i class="bi bi-check-circle me-2"></i>Guardar Cambios
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
