<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}">Detalle</title>
</head>

<body class="bg-light">
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid py-4">

            <div th:if="${param.success}" class="alert alert-success rounded-pill px-4 shadow-sm border-0 mb-4">
                <i class="bi bi-check-circle-fill me-2"></i> 
                <span th:text="${trad.getTraduccion('paciente.alerta.guardar')}">Guardado</span>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 text-center mb-4" style="border-radius: 15px; overflow: hidden;">
                        <div class="card-header bg-primary py-4 border-0"></div>
                        <div class="card-body position-relative" style="margin-top: -50px;">
                            
                            <form th:action="@{/pacientes/actualizar-foto}" method="post" enctype="multipart/form-data" id="formFoto">
                                <input type="hidden" name="id" th:value="${paciente.id}" />
                                
                                <div class="position-relative d-inline-block">
                                    <img id="preview" th:src="${paciente.rutaFoto != null && paciente.rutaFoto != ''} ? @{'/images/' + ${paciente.rutaFoto}} : @{'/images/default-user.png'}" 
                                         class="bg-white rounded-circle shadow-sm border" style="width: 120px; height: 120px; object-fit: cover; border: 5px solid white !important;">
                                    
                                    <label for="fileInput" class="btn btn-sm btn-primary rounded-circle position-absolute bottom-0 end-0 shadow-sm" style="width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                                        <i class="bi bi-camera"></i>
                                    </label>
                                    <input type="file" name="file" id="fileInput" hidden accept="image/*" onchange="submitFoto(event)">
                                </div>
                            </form>

                            <h4 class="fw-bold mt-3 mb-1 text-dark" th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}">Nombre</h4>
                            <p class="text-muted small mb-3" th:text="${paciente.dni}">DNI</p>
                            
                            <div class="badge rounded-pill bg-success-subtle text-success px-3 py-2 mb-3" th:if="${paciente.activo}" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activo</div>
                            <div class="badge rounded-pill bg-danger-subtle text-danger px-3 py-2 mb-3" th:if="${!paciente.activo}" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivo</div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 position-relative" style="border-radius: 15px;">
                        
                        <div class="position-absolute top-0 end-0 mt-3 me-3">
                            <span class="badge rounded-pill px-3 py-2 border border-primary border-opacity-25" 
                                  style="background-color: rgba(13, 110, 253, 0.1); color: #0d6efd; font-size: 0.9rem;">
                                <i class="bi bi-calendar-event me-1"></i>
                                <span th:text="${edad}"></span>
                            </span>
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <h5 class="fw-bold mb-4 text-primary d-flex align-items-center">
                                <i class="bi bi-person-vcard me-2"></i> 
                                <span th:text="${trad.getTraduccion('paciente.seccion.personales')}">Datos Personales</span>
                            </h5>

                            <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                                <input type="hidden" th:field="*{id}" />
                                <input type="hidden" th:field="*{fechaAlta}" />
                                <input type="hidden" th:field="*{activo}" />
                                <input type="hidden" th:field="*{rutaFoto}" />
                                <input type="hidden" name="origen" value="detalle" />

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.label.nombre')}">Nombre</label>
                                        <input type="text" th:field="*{nombre}" class="form-control bg-light border-0 py-2 shadow-none" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.label.apellidos')}">Apellidos</label>
                                        <input type="text" th:field="*{apellidos}" class="form-control bg-light border-0 py-2 shadow-none" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.label.dni')}">DNI / NIE</label>
                                        <input type="text" th:field="*{dni}" class="form-control bg-secondary bg-opacity-10 border-0 py-2 shadow-none" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.form.nacimiento')}">Fecha Nacimiento</label>
                                        <input type="date" th:field="*{fechaNacimiento}" class="form-control bg-light border-0 py-2 shadow-none" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.label.telefono')}">Teléfono</label>
                                        <input type="tel" th:field="*{telefono}" class="form-control bg-light border-0 py-2 shadow-none" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.form.email')}">Email</label>
                                        <input type="email" th:field="*{email}" class="form-control bg-light border-0 py-2 shadow-none">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold text-secondary" th:text="${trad.getTraduccion('paciente.form.direccion')}">Dirección</label>
                                        <textarea th:field="*{direccion}" class="form-control bg-light border-0 py-2 shadow-none" rows="2"></textarea>
                                    </div>
                                </div>

                                <div class="mt-5 d-flex justify-content-between">
                                    <a th:href="@{/pacientes}" class="btn btn-outline-secondary rounded-pill px-4" th:text="${trad.getTraduccion('btn.volver')}">Volver</a>
                                    <button type="submit" class="btn btn-primary rounded-pill px-5 shadow-sm fw-bold" th:text="${trad.getTraduccion('btn.guardarCambios')}">Guardar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        // Función para enviar la foto automáticamente al seleccionarla
        function submitFoto(event) {
            const file = event.target.files[0];
            if (file) {
                // Mostrar preview inmediata
                const reader = new FileReader();
                reader.onload = function(e){
                    document.getElementById('preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
                
                // Enviar el formulario de foto al endpoint /actualizar-foto
                document.getElementById('formFoto').submit();
            }
        }
    </script>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
