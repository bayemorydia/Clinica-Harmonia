<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title
        th:text="${trad.getTraduccion('paciente.detalle.titulo')} + ': ' + ${paciente.nombre} + ' ' + ${paciente.apellidos}">
        Detalle Paciente</title>
</head>

<body class="bg-light">
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>

    <main th:class="${#authorization.expression('hasRole(''ROLE_MEDICO'')')} ? 'content-medico' : 'content'">
        <div class="container-fluid py-4">

            <div th:if="${param.success}"
                class="alert alert-success alert-dismissible fade show rounded-pill px-4 shadow-sm border-0 mb-4"
                role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${trad.getTraduccion('paciente.alerta.guardar')}">¡Datos actualizados
                    correctamente!</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}"
                class="alert alert-danger alert-dismissible fade show rounded-pill px-4 shadow-sm border-0 mb-4"
                role="alert">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                <span th:text="${error}">Mensaje de error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{fechaNacimiento}" />
                <input type="hidden" th:field="*{fechaAlta}" />
                <input type="hidden" th:field="*{activo}" />
                <input type="hidden" name="origen" value="detalle" />

                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px; overflow: hidden;">
                            <div class="card-header bg-primary py-4 border-0"></div>
                            <div class="card-body text-center position-relative" style="margin-top: -50px;">
                                <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                                    style="width: 100px; height: 100px; border: 5px solid white;">
                                    <h1 class="mb-0 fw-bold text-primary" style="font-size: 2.5rem;"
                                        th:text="${#strings.substring(paciente.nombre,0,1)}"></h1>
                                </div>
                                <h4 class="fw-bold mb-1 text-dark"
                                    th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></h4>
                                <p class="text-muted small mb-2" th:text="${paciente.email}"></p>

                                <div class="mt-2 p-2 bg-light rounded-pill border d-inline-block px-4 mb-3">
                                    <i class="bi bi-person text-primary me-2"></i>
                                    <span class="small fw-bold text-secondary"
                                        th:text="${paciente.usuario.username}"></span>
                                </div>

                                <div class="mt-2 pt-3 border-top mx-3">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="small text-muted"
                                            th:text="${trad.getTraduccion('paciente.label.estado')}">Estado:</span>
                                        <span
                                            th:class="${paciente.activo} ? 'badge rounded-pill bg-success-subtle text-success' : 'badge rounded-pill bg-danger-subtle text-danger'"
                                            th:text="${paciente.activo} ? ${trad.getTraduccion('paciente.estado.activo')} : ${trad.getTraduccion('paciente.estado.inactivo')}">
                                        </span>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="small text-muted"
                                            th:text="${trad.getTraduccion('paciente.label.fechaAlta')}">Fecha de
                                            Alta:</span>
                                        <span class="small fw-bold text-dark"
                                            th:text="${#temporals.format(paciente.fechaAlta, 'dd/MM/yyyy')}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 position-relative" style="border-radius: 15px;">
                            <div class="position-absolute top-0 end-0 mt-4 me-4">
                                <span
                                    class="badge rounded-pill bg-primary bg-opacity-10 text-primary border border-primary border-opacity-50 px-3 py-2"
                                    style="font-size: 0.95rem;">
                                    <i class="bi bi-calendar-event me-1"></i>
                                    <span th:text="${edad}"></span>
                                </span>
                            </div>

                            <div class="card-body p-4 p-md-5">
                                <div class="mb-5">
                                    <h5 class="fw-bold mb-4 text-primary d-flex align-items-center">
                                        <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3"><i
                                                class="bi bi-person-badge"></i></span>
                                        <span th:text="${trad.getTraduccion('paciente.seccion.personales')}">Datos
                                            Personales</span>
                                    </h5>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.nombre')}">Nombre</label>
                                            <input type="text" th:field="*{nombre}" class="form-control rounded-3"
                                                th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.apellidos')}">Apellidos</label>
                                            <input type="text" th:field="*{apellidos}" class="form-control rounded-3"
                                                th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.dni')}">DNI</label>
                                            <input type="text" th:field="*{dni}"
                                                class="form-control rounded-3 font-monospace"
                                                th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{dni}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.ss')}">Nº Seguridad
                                                Social</label>
                                            <input type="text" th:field="*{numeroSeguridadSocial}"
                                                class="form-control rounded-3"
                                                th:classappend="${#fields.hasErrors('numeroSeguridadSocial')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{numeroSeguridadSocial}"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-5">
                                    <h5 class="fw-bold mb-4 text-primary d-flex align-items-center">
                                        <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3"><i
                                                class="bi bi-geo-alt"></i></span>
                                        <span th:text="${trad.getTraduccion('paciente.seccion.contacto')}">Dirección y
                                            Contacto</span>
                                    </h5>
                                    <div class="row g-3">
                                        <div class="col-md-12">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.direccion')}">Dirección
                                                Completa</label>
                                            <input type="text" th:field="*{direccion}"
                                                class="form-control rounded-3 bg-light"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.telefono')}">Teléfono</label>
                                            <input type="text" th:field="*{telefono}" class="form-control rounded-3"
                                                th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('paciente.label.email')}">Correo
                                                Electrónico</label>
                                            <input type="email" th:field="*{email}" class="form-control rounded-3"
                                                th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : 'bg-light'"
                                                th:readonly="${#authorization.expression('hasRole(''ROLE_MEDICO'')')}">
                                            <div class="invalid-feedback" th:errors="*{email}"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="card-footer bg-white border-0 p-0 d-flex justify-content-between">
                                    <a th:href="@{/pacientes}"
                                        class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                                        <i class="bi bi-arrow-left me-2"></i>
                                        <span th:text="${trad.getTraduccion('btn.volver')}">Volver</span>
                                    </a>
                                    <button type="submit" sec:authorize="hasRole('ADMINISTRADOR')"
                                        class="btn btn-primary rounded-pill px-5 shadow-lg">
                                        <i class="bi bi-save me-2"></i>
                                        <span th:text="${trad.getTraduccion('btn.guardarCambios')}">Guardar
                                            Cambios</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
