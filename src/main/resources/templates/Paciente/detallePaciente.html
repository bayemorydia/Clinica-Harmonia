<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}">Detalle</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid py-4">

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm"
                role="alert">
                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/pacientes}"
                                th:text="${trad.getTraduccion('pacientes.lista.titulo')}">Pacientes</a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page"
                            th:text="${trad.getTraduccion('pacientes.detalle.titulo')}">Detalle</li>
                    </ol>
                </nav>
            </div>

            <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{fechaAlta}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px; overflow: hidden;">
                            <div class="card-header bg-primary py-4 border-0"></div>
                            <div class="card-body text-center position-relative" style="margin-top: -50px;">
                                <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                                    style="width: 100px; height: 100px; border: 5px solid white;">
                                    <h1 class="mb-0 fw-bold text-primary" style="font-size: 2.5rem;"
                                        th:text="${#strings.substring(paciente.nombre,0,1)}"></h1>
                                </div>
                                <h4 class="fw-bold mb-1 text-dark"
                                    th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></h4>
                                <p class="text-muted small mb-4" th:text="${paciente.email}"></p>

                                <div class="px-3 mt-2">
                                    <div th:if="${paciente.usuario != null}" class="mb-4 p-2 rounded-3 bg-light bg-opacity-50 border">
                                        <div class="fw-bold small text-uppercase text-muted mb-1" 
                                             th:text="${trad.getTraduccion('pacientes.form.usuario')}">Usuario de acceso</div>
                                        <div class="text-primary fw-bold d-flex align-items-center justify-content-center">
                                            <i class="bi bi-person-badge-fill me-2"></i>
                                            <span th:text="${paciente.usuario.username}"></span>
                                        </div>
                                    </div>

                                    <div class="fw-bold small text-uppercase text-muted mb-2">Estado:</div>
                                    <div th:if="*{activo}" class="text-success fw-bold fs-5">
                                        <i class="bi bi-circle-fill me-1 small"></i> Activo
                                    </div>
                                    <div th:unless="*{activo}" class="text-danger fw-bold fs-5">
                                        <i class="bi bi-circle-fill me-1 small"></i> Inactivo
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                                <small class="text-muted">
                                    <span th:text="${trad.getTraduccion('pacientes.form.registro')}"></span>
                                    <span class="fw-bold"
                                        th:text="${#temporals.format(paciente.fechaAlta, 'dd/MM/yyyy')}"></span>
                                </small>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0" style="border-radius: 15px;">
                            <div class="card-body p-4 p-md-5">

                                <div class="mb-5">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <h5 class="fw-bold mb-0 text-primary d-flex align-items-center">
                                            <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3"><i
                                                    class="bi bi-person-lines-fill"></i></span>
                                            <span
                                                th:text="${trad.getTraduccion('pacientes.form.seccion.personal')}"></span>
                                        </h5>
                                        <div th:with="edadData=${#strings.arraySplit(edad, ':')}"
                                            class="text-secondary fw-bold">
                                            <span class="badge bg-light text-dark border px-3 py-2 rounded-pill">
                                                Edad:
                                                <span th:if="${edadData[0] == '0'}"
                                                    th:text="${trad.getTraduccion('edad.' + edadData[1])}"></span>
                                                <span th:unless="${edadData[0] == '0'}"
                                                    th:text="${edadData[0]} + ' ' + ${trad.getTraduccion('edad.' + edadData[1])}"></span>
                                            </span>
                                        </div>
                                    </div>

                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.nombre')}"></label>
                                            <input type="text" th:field="*{nombre}"
                                                class="form-control rounded-3 bg-light bg-opacity-25" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.apellidos')}"></label>
                                            <input type="text" th:field="*{apellidos}"
                                                class="form-control rounded-3 bg-light bg-opacity-25" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary">
                                                <span th:text="${trad.getTraduccion('pacientes.form.dni')}"></span> (DNI o NIE)
                                            </label>
                                            <input type="text" th:field="*{dni}"
                                                class="form-control rounded-3 font-monospace bg-light bg-opacity-25"
                                                placeholder="12345678A" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.nacimiento')}"></label>
                                            <input type="date" th:field="*{fechaNacimiento}"
                                                class="form-control rounded-3 bg-light bg-opacity-25" required>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-5">
                                    <h5 class="fw-bold mb-4 text-primary d-flex align-items-center">
                                        <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3"><i
                                                class="bi bi-telephone-fill"></i></span>
                                        <span th:text="${trad.getTraduccion('pacientes.form.seccion.contacto')}"></span>
                                    </h5>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.telefono')}"></label>
                                            <input type="text" th:field="*{telefono}"
                                                class="form-control rounded-3 bg-light bg-opacity-25">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.email')}"></label>
                                            <input type="email" th:field="*{email}"
                                                class="form-control rounded-3 bg-light bg-opacity-25">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.direccion')}"></label>
                                            <input type="text" th:field="*{direccion}"
                                                class="form-control rounded-3 bg-light bg-opacity-25">
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h5 class="fw-bold mb-4 text-primary d-flex align-items-center">
                                        <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3"><i
                                                class="bi bi-shield-plus"></i></span>
                                        <span
                                            th:text="${trad.getTraduccion('pacientes.form.seccion.sanitaria')}"></span>
                                    </h5>
                                    <div class="row g-3">
                                        <div class="col-md-7">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.nss')}"></label>
                                            <input type="text" th:field="*{numeroSeguridadSocial}"
                                                class="form-control rounded-3 font-monospace bg-light bg-opacity-25">
                                        </div>
                                        <div class="col-md-5">
                                            <label class="form-label small fw-bold text-secondary"
                                                th:text="${trad.getTraduccion('pacientes.form.historial')}"></label>
                                            <div th:if="${paciente.historial != null}"
                                                class="alert alert-info py-2 rounded-3 border-0 d-flex align-items-center mb-0 shadow-sm"
                                                style="background-color: #e3f2fd; color: #0d47a1;">
                                                <i class="bi bi-file-earmark-medical-fill fs-5 me-2"></i>
                                                <strong th:text="${paciente.historial.id}"></strong>
                                            </div>
                                            <div th:unless="${paciente.historial != null}"
                                                class="alert alert-warning py-2 rounded-3 border-0 mb-0 shadow-sm">
                                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                                <span
                                                    th:text="${trad.getTraduccion('pacientes.form.historial.vacio')}"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer bg-white border-0 p-4 p-md-5 pt-0 text-end">
                                <hr class="my-4 opacity-25">
                                <button type="submit"
                                    class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-lg transition-all hover-lift">
                                    <i class="bi bi-check2-circle me-2"></i>
                                    <span th:text="${trad.getTraduccion('btn.guardar')}">Guardar</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <style>
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
        }
        .transition-all {
            transition: all 0.2s ease-in-out;
        }
    </style>
</body>

</html>
