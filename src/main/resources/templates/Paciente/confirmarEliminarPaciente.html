<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Confirmar Desactivación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-warning text-dark py-3 text-center">
                        <h3 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i> Confirmar Desactivación
                        </h3>
                    </div>
                    <div class="card-body p-4 text-center">
                        <p class="lead">¿Estás seguro de que deseas desactivar al paciente?</p>
                        <div class="bg-light p-3 rounded border mb-4">
                            <h5 th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></h5>
                            <p class="mb-0 text-muted" th:text="'DNI: ' + ${paciente.dni}"></p>
                        </div>
                        <p class="text-muted small">El paciente dejará de estar activo en el sistema, pero sus datos no
                            serán borrados permanentemente.</p>

                        <form th:action="@{/pacientes/eliminar}" method="post">
                            <input type="hidden" name="id" th:value="${paciente.id}" />
                            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                                <a th:href="@{/pacientes/}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-warning fw-bold">Sí, Desactivar Paciente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
