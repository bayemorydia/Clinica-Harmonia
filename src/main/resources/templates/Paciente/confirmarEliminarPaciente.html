<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación | Gestión Médica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-danger text-white py-3 text-center">
                        <h3 class="mb-0">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            ¿Eliminar Paciente?
                        </h3>
                    </div>

                    <div class="card-body p-4 text-center">
                        <p class="lead">Estás a punto de borrar permanentemente al siguiente paciente:</p>

                        <div class="bg-light p-4 rounded border mb-4">
                            <div class="mb-2">
                                <span class="text-muted small text-uppercase fw-bold">ID del Paciente:</span>
                                <h5 th:text="${paciente.id}" class="text-dark"></h5>
                            </div>
                            <div class="mb-2">
                                <span class="text-muted small text-uppercase fw-bold">Nombre Completo:</span>
                                <h5 th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}" class="text-dark"></h5>
                            </div>
                            <div class="mb-0">
                                <span class="text-muted small text-uppercase fw-bold">DNI / NIE:</span>
                                <h5 th:text="${paciente.dni}" class="text-dark"></h5>
                            </div>
                        </div>

                        <p class="text-danger fw-bold">Esta acción no se puede deshacer.</p>

                        <form th:action="@{/pacientes/eliminar}" method="post">
                            <input type="hidden" name="id" th:value="${paciente.id}" />

                            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                                <a th:href="@{/pacientes}" class="btn btn-outline-secondary px-4 py-2">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-danger px-4 py-2 shadow">
                                    <i class="bi bi-trash-fill me-1"></i> Eliminar Definitivamente
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">Gestión de Seguridad de Datos Médicos</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
