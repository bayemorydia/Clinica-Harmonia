<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <title th:text="${trad.getTraduccion('paciente.eliminar.titulo')}">Confirmar Desactivación</title>
</head>

<body>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 'content'">
        <div class="container-fluid py-5">

            <div class="row justify-content-center">
                <div class="col-xl-6 col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">

                        <div class="card-header bg-white border-0 py-4 px-4">
                            <div class="d-flex align-items-center">
                                <div class="bg-warning bg-opacity-10 p-3 rounded-3 me-3">
                                    <i class="bi bi-exclamation-triangle-fill text-warning fs-4"></i>
                                </div>
                                <div>
                                    <h3 class="mb-0 fw-bold text-dark"
                                        th:text="${trad.getTraduccion('paciente.eliminar.titulo')}">Confirmar Acción
                                    </h3>
                                    <p class="mb-0 text-muted small" th:text="${trad.getTraduccion('paciente.eliminar.subtitulo')}">Esta acción modificará el estado del registro</p>
                                </div>
                            </div>
                        </div>

                        <div class="card-body p-4 p-md-5 text-center">
                            <p class="lead fw-semibold text-dark mb-4" th:text="${trad.getTraduccion('paciente.eliminar.pregunta')}">¿Estás seguro de que deseas desactivar al paciente?</p>

                            <div class="bg-light p-4 rounded-4 border border-light-subtle mb-4">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                    style="width: 60px; height: 60px;">
                                    <h4 class="mb-0 fw-bold" th:text="${#strings.substring(paciente.nombre,0,1)}"></h4>
                                </div>
                                <h5 class="fw-bold mb-1 text-dark"
                                    th:text="${paciente.nombre} + ' ' + ${paciente.apellidos}"></h5>
                                <p class="mb-0 text-muted font-monospace small" th:text="${trad.getTraduccion('paciente.label.dni')} + ': ' + ${paciente.dni}"></p>
                            </div>

                            <div class="alert alert-warning border-0 small mb-0 shadow-sm text-start">
                                <i class="bi bi-info-circle me-2"></i>
                                <span th:text="${trad.getTraduccion('paciente.eliminar.aviso')}">
                                    El paciente dejará de estar activo en el sistema, pero sus datos no serán borrados permanentemente.
                                </span>
                            </div>

                            <form th:action="@{/pacientes/eliminar}" method="post" class="mt-5">
                                <input type="hidden" name="id" th:value="${paciente.id}" />

                                <div class="d-flex justify-content-center gap-3">
                                    <a th:href="@{/pacientes}"
                                        class="btn btn-light px-4 py-2 fw-bold text-secondary rounded-pill">
                                        <span th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</span>
                                    </a>
                                    <button type="submit"
                                        class="btn btn-warning px-4 py-2 fw-bold shadow-sm rounded-pill transition-all hover-lift">
                                        <i class="bi bi-person-x-fill me-2"></i>
                                        <span th:text="${trad.getTraduccion('btn.confirmar.desactivar')}">Sí, Desactivar Paciente</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                            <small class="text-muted italic" th:text="${trad.getTraduccion('footer.modulo.seguridad')}">Módulo de Seguridad Médica</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'MEDICO')" th:replace="~{Reutilizable/layout :: scripts}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}"></div>

    <style>
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1) !important;
        }
        .transition-all { transition: all 0.2s ease-in-out; }
        body { background-color: #f8f9fa; }
    </style>
</body>
</html>
