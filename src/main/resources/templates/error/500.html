<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error del Servidor (500)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f5; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 600px; padding: 40px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #dc3545; }
        .icon { font-size: 80px; margin-bottom: 20px; }
        .tech-info { background: #f8f9fa; padding: 10px; border-radius: 5px; font-size: 0.85rem; color: #6c757d; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💥</div>
        <h1 class="fw-bold text-danger">Error 500</h1>
        <h3 class="mb-3">¡Ups! Algo salió mal</h3>
        <p class="text-muted">Nuestros servidores han tenido un problema inesperado. El equipo técnico ha sido notificado automáticamente.</p>
        
        <div class="mt-4">
            <a href="/" class="btn btn-dark rounded-pill px-4 shadow-sm">Recargar la aplicación</a>
        </div>

        <div class="tech-info" th:if="${message}">
            <strong>Detalle técnico:</strong>
            <span th:text="${message}">Error desconocido</span>
        </div>
    </div>
</body>
</html>
