<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado (403)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8d7da; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 500px; padding: 40px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 80px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⛔</div>
        <h1 class="fw-bold text-danger">Error 403</h1>
        <h3 class="mb-3">Acceso Denegado</h3>
        <p class="text-muted">Lo sentimos, no tienes los permisos necesarios para acceder a esta página. Es una zona restringida.</p>
        <div class="mt-4 d-flex justify-content-center gap-3">
            <a href="javascript:history.back()" class="btn btn-outline-danger rounded-pill px-4 shadow-sm">Volver Atrás</a>
            <a href="/" class="btn btn-danger rounded-pill px-4 shadow-sm">Ir al Inicio</a>
        </div>
    </div>
</body>
</html>
