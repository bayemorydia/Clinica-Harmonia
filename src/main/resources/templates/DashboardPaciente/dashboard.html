<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{Reutilizable/layoutPaciente :: head_paciente}"></th:block>

    <title th:text="${trad.getTraduccion('nav.paciente.dashboard')}">
        Mi Panel de Salud
    </title>
</head>

<body class="bg-light">

<div sec:authorize="hasRole('PACIENTE')"
     th:replace="~{Reutilizable/layoutPaciente :: menu_paciente}"></div>

<main class="content">
    <div class="container-fluid">

        <header class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-0"
                    th:text="${trad.getTraduccion('nav.inicio')}">Inicio</h2>

                <p class="text-muted mb-0">
                    <span th:text="${trad.getTraduccion('home.bienvenida')}">Bienvenido</span>,
                    <span th:text="${pacienteLogueado?.nombre + ' ' + pacienteLogueado?.apellidos}">
                        Nombre Apellidos
                    </span>
                </p>
            </div>

            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-white shadow-sm text-dark p-2 px-3 rounded-pill border">
                    <i class="bi bi-clock me-2 text-primary"></i>
                    <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                </span>

                <img th:if="${pacienteLogueado?.rutaFoto != null}"
                     th:src="${pacienteLogueado.rutaFoto}"
                     alt="Perfil"
                     class="rounded-circle shadow-sm border"
                     width="45" height="45">
            </div>
        </header>

        <div class="row g-4 mb-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm p-3 bg-white border-0">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-calendar-check text-primary fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small text-uppercase fw-bold"
                                th:text="${trad.getTraduccion('paciente.stat.citas')}">
                                Citas
                            </h6>
                            <h3 class="fw-bold mb-0" th:text="${totalCitas}">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm p-3 bg-white border-0">
                    <div class="d-flex align-items-center">
                        <div class="bg-success bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-file-earmark-medical text-success fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small text-uppercase fw-bold"
                                th:text="${trad.getTraduccion('paciente.stat.historial')}">
                                Historial
                            </h6>
                            <h3 class="fw-bold mb-0" th:text="${totalEpisodios}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 bg-white mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-calendar-event me-2 text-primary"></i>
                    <span th:text="${trad.getTraduccion('paciente.tabla.proximas.citas')}">
                        Mis Citas
                    </span>
                </h5>
                <a th:href="@{/paciente/citas}" class="btn btn-sm btn-link text-decoration-none">Ver todas</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th th:text="${trad.getTraduccion('cita.label.fechahora')}">Fecha</th>
                        <th th:text="${trad.getTraduccion('cita.label.profesional')}">Doctor/a</th>
                        <th th:text="${trad.getTraduccion('cita.label.estado')}">Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${listaCitas}">
                        <td class="fw-bold"
                            th:text="${cita.fechaHora != null
                            ? #temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')
                            : '---'}"></td>

                        <td th:text="${cita.profesional != null
                            ? 'Dr/a. ' + cita.profesional.nombre
                            : 'Pendiente'}"></td>

                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${cita.estado != null
                                    ? (cita.estado.name() == 'PROGRAMADA' ? 'bg-primary' : (cita.estado.name() == 'COMPLETADA' ? 'bg-success' : 'bg-danger'))
                                    : 'bg-secondary'}"
                                  th:text="${cita.estado != null
                                    ? trad.getTraduccion('estado.' + cita.estado)
                                    : '---'}">
                            </span>
                        </td>

                        <td class="text-center">
                            <div class="btn-group">
                                <a th:if="${cita.estado?.name() == 'COMPLETADA'}"
                                   th:href="@{/citas/factura/{id}(id=${cita.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   title="Descargar Factura">
                                    <i class="bi bi-file-pdf"></i>
                                </a>
                                <a th:href="@{/citas/detalle/{id}(id=${cita.id})}"
                                   class="btn btn-sm btn-light border"
                                   title="Ver Detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaCitas)}">
                        <td colspan="4" class="text-center py-4 text-muted">
                            <i class="bi bi-info-circle me-2"></i>
                            <span th:text="${trad.getTraduccion('paciente.tabla.vacia')}">
                                No hay citas programadas.
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{Reutilizable/layoutPaciente :: scripts_paciente}"></div>

</body>
</html>
