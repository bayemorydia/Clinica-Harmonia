<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layoutPaciente :: head_paciente}"></div>
    <title th:text="${trad.getTraduccion('nav.paciente')}">Panel Paciente</title>
</head>
<body class="bg-light">
<div th:replace="~{Reutilizable/layoutPaciente :: menu_paciente}"></div>

<main class="content-paciente">
    <div class="container-fluid">
        <header class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-0" th:text="${trad.getTraduccion('nav.inicio')}">Inicio</h2>
                <p class="text-muted">
                    <span th:text="${trad.getTraduccion('home.bienvenida')}">Bienvenido</span>,
                    <span th:text="${pacienteLogueado.nombre} + ' ' + ${pacienteLogueado.apellidos}">Nombre</span>
                </p>
            </div>
            <span class="badge bg-white shadow-sm text-dark p-2 px-3 rounded-pill border">
                    <i class="bi bi-clock me-2 text-primary"></i>
                    <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                </span>
        </header>

        <div class="row g-4 mb-5">
            <div class="col-md-6 col-lg-4">
                <div class="card card-stat shadow-sm p-3 bg-white border-0">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-calendar-check text-primary fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small text-uppercase fw-bold">Citas Pendientes</h6>
                            <h3 class="fw-bold mb-0" th:text="${totalCitasPendientes}">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-lg-4">
                <div class="card card-stat shadow-sm p-3 bg-white border-0">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-success bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-calendar2-day text-success fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small text-uppercase fw-bold">Citas Hoy</h6>
                            <h3 class="fw-bold mb-0" th:text="${citasHoy}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 bg-white mb-4">
            <h5 class="fw-bold mb-4">
                <i class="bi bi-calendar-event me-2 text-primary"></i>
                Mis Próximas Citas
            </h5>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Fecha y Hora</th>
                        <th>Médico</th>
                        <th>Especialidad</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cita : ${citasPendientes}">
                        <td class="fw-bold" th:text="${#temporals.format(cita.fechaHora, 'dd/MM HH:mm')}"></td>
                        <td th:text="${cita.medico.nombre} + ' ' + ${cita.medico.apellidos}"></td>
                        <td><span class="badge bg-info-subtle text-info" th:text="${cita.especialidad}"></span></td>
                        <td class="text-end">
                            <a th:href="@{/paciente/citas/{id}(id=${cita.id})}" class="btn btn-sm btn-primary rounded-pill px-3">
                                Ver <i class="bi bi-eye ms-1"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citasPendientes)}">
                        <td colspan="4" class="text-center py-4 text-muted">No tienes citas pendientes.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4 bg-white">
            <h5 class="fw-bold mb-4">Acciones Rápidas</h5>
            <div class="row g-3">
                <div class="col-md-6 col-lg-3">
                    <div class="border p-3 rounded text-center card-stat bg-white h-100">
                        <i class="bi bi-search fs-2 text-info mb-2"></i>
                        <h6 class="fw-bold">Buscar Médico</h6>
                        <a th:href="@{/paciente/medicos}" class="btn btn-sm btn-info text-white w-100 mt-2">Abrir</a>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="border p-3 rounded text-center card-stat bg-white h-100">
                        <i class="bi bi-calendar-plus fs-2 text-success mb-2"></i>
                        <h6 class="fw-bold">Solicitar Cita</h6>
                        <a th:href="@{/paciente/citas/nueva}" class="btn btn-sm btn-success text-white w-100 mt-2">Abrir</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{Reutilizable/layoutPaciente :: scripts_paciente}"></div>
</body>
</html>
