<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle del Proveedor | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3 d-flex justify-content-between align-items-center">
                        <h2 class="h4 mb-0"><i class="bi bi-info-circle me-2"></i>Información del Proveedor</h2>
                        <span th:class="${proveedor.activo} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${proveedor.activo} ? 'Estado: Activo' : 'Estado: Inactivo'">
                        </span>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-12 border-bottom pb-2">
                                <p class="text-muted small mb-1">Nombre Comercial</p>
                                <h3 class="h5 fw-bold text-dark" th:text="${proveedor.nombre}"></h3>
                                <small class="text-muted">ID del sistema: #<span th:text="${proveedor.id}"></span></small>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold text-secondary small uppercase"><i class="bi bi-card-text me-1"></i> CIF</label>
                                <p class="fs-6 mt-1" th:text="${proveedor.cif}"></p>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold text-secondary small uppercase"><i class="bi bi-telephone me-1"></i> Teléfono</label>
                                <p class="fs-6 mt-1" th:text="${proveedor.telefono}"></p>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold text-secondary small uppercase"><i class="bi bi-envelope me-1"></i> Email</label>
                                <p class="fs-6 mt-1" th:text="${proveedor.email}"></p>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold text-secondary small uppercase"><i class="bi bi-calendar-check me-1"></i> Fecha de Alta</label>
                                <p class="fs-6 mt-1" th:text="${#temporals.format(proveedor.fecha_alta, 'dd/MM/yyyy')}"></p>
                            </div>

                            <div class="col-12 bg-light p-3 rounded">
                                <label class="fw-bold text-secondary small uppercase"><i class="bi bi-geo-alt me-1"></i> Dirección Fiscal</label>
                                <p class="fs-6 mt-1 mb-0" th:text="${proveedor.direccion}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white py-3 d-flex justify-content-between">
                        <a th:href="@{/proveedores}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Volver al listado
                        </a>
                        <div>
                            <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}" class="btn btn-warning">
                                <i class="bi bi-pencil"></i> Editar Datos
                            </a>
                        </div>
                    </div>
                </div>

                <p class="text-center mt-4 text-muted small">
                    Última actualización de datos gestionada por el módulo de Farmacia.
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
