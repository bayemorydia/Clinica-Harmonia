<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h2 class="h4 mb-0 text-center"><i class="bi bi-truck me-2"></i>Añadir Nuevo Proveedor</h2>
                </div>
                <div class="card-body p-4">
                    
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/proveedores/guardar}" method="post">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre de la Empresa</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Farmacéutica Central" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cif" class="form-label fw-bold">CIF</label>
                                <input type="text" id="cif" name="cif" class="form-control" placeholder="A12345678" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="telefono" class="form-label fw-bold">Teléfono</label>
                                <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="600000000" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" name="email" class="form-control" placeholder="contacto@proveedor.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="direccion" class="form-label fw-bold">Dirección Fiscal</label>
                            <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Calle, Número, Ciudad" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Guardar Proveedor
                            </button>
                            <a th:href="@{/proveedores}" class="btn btn-outline-secondary mt-2">
                                Cancelar y Volver
                            </a>
                        </div>
                    </form>
                </div>
            </div>
            
            <p class="text-center text-muted mt-3 small">
                La fecha de alta será asignada automáticamente hoy: <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
