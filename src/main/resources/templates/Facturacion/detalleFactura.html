<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Detalle de Factura</title>
</head>
<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-end mb-4">
                <div>
                    <h2 class="fw-bold mb-1" th:text="'Factura #' + ${factura.id}"></h2>
                    <span th:class="${factura.activo ? 'badge bg-success' : 'badge bg-danger'}" 
                          th:text="${factura.activo ? 'ACTIVA' : 'DESACTIVADA'}"></span>
                </div>
                <div class="btn-group shadow-sm">
                    <button class="btn btn-white" onclick="window.print()"><i class="bi bi-printer me-2"></i>Imprimir</button>
                    <a th:href="@{/admin/facturas}" class="btn btn-primary">Volver</a>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm h-100" style="border-radius: 15px;">
                        <div class="card-body">
                            <h6 class="text-muted small fw-bold text-uppercase mb-3">Información del Receptor</h6>
                            <div th:if="${factura.paciente != null}">
                                <h5 class="fw-bold" th:text="${factura.paciente.nombre + ' ' + factura.paciente.apellidos}"></h5>
                                <p class="text-muted small mb-1"><i class="bi bi-card-text me-2"></i>[[${factura.paciente.dni}]]</p>
                                <p class="text-muted small mb-1"><i class="bi bi-geo-alt me-2"></i>[[${factura.paciente.direccion}]]</p>
                            </div>
                            <div th:if="${factura.proveedor != null}">
                                <h5 class="fw-bold" th:text="${factura.proveedor.nombre}"></h5>
                                <p class="text-muted small mb-1">ID Proveedor: [[${factura.proveedor.id}]]</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
                        <div class="card-body p-0">
                            <table class="table mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4">CONCEPTO</th>
                                        <th class="text-center">CANTIDAD</th>
                                        <th class="text-end pe-4">SUBTOTAL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="linea : ${factura.lineas}">
                                        <td class="ps-4 py-3" th:text="${linea.concepto}"></td>
                                        <td class="text-center py-3" th:text="${linea.cantidad}"></td>
                                        <td class="text-end pe-4 py-3 fw-bold" th:text="${linea.subtotal} + ' €'"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer bg-white border-top-0 p-4">
                            <div class="row justify-content-end">
                                <div class="col-md-4">
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">Subtotal:</span>
                                        <span class="fw-bold" th:text="${factura.subtotal} + ' €'"></span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">IVA:</span>
                                        <span class="fw-bold" th:text="${factura.iva} + ' €'"></span>
                                    </div>
                                    <div class="d-flex justify-content-between border-top pt-2">
                                        <span class="fw-bold h5">TOTAL:</span>
                                        <span class="fw-bold h5 text-primary" th:text="${factura.total} + ' €'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
