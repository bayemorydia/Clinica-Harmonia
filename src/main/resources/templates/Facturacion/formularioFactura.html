<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${factura.id == null ? trad.getTraduccion('btn.nuevo') : 'Editar Factura'}">Nueva Factura</title>
</head>
<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">
            <div class="mb-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/admin/facturas}" th:text="${trad.getTraduccion('mod.facturacion.titulo')}">Facturación</a></li>
                        <li class="breadcrumb-item active" aria-current="page" th:text="${factura.id == null ? trad.getTraduccion('btn.nuevo') : 'Editar'}">Nueva</li>
                    </ol>
                </nav>
            </div>

            <form th:action="@{/admin/facturas/guardar}" th:object="${factura}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-receipt text-primary fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-dark" th:text="${factura.id == null ? 'Nueva Factura' : 'Detalle de Factura'}">Formulario</h3>
                                <p class="mb-0 text-muted small">Registro de transacciones comerciales</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                            <i class="bi bi-exclamation-octagon me-2"></i>
                            <div th:text="${error}"></div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary">Información General</h5>
                                <p class="text-muted small">Tipo de factura y fechas clave.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Tipo de Operación</label>
                                        <select th:field="*{tipo}" class="form-select border-0 bg-light py-2" id="tipoFactura">
                                            <option value="VENTA">Venta (Paciente)</option>
                                            <option value="COMPRA">Compra (Proveedor)</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Fecha Emisión</label>
                                        <input type="date" th:field="*{fechaEmision}" class="form-control border-0 bg-light py-2" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Fecha Vencimiento</label>
                                        <input type="date" th:field="*{fechaVencimiento}" class="form-control border-0 bg-light py-2">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary">Entidad Relacionada</h5>
                                <p class="text-muted small">Seleccione el receptor o emisor.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-12" id="divPaciente">
                                        <label class="form-label fw-semibold small text-secondary">Paciente</label>
                                        <select th:field="*{paciente.id}" class="form-select border-0 bg-light py-2">
                                            <option value="">Seleccionar Paciente...</option>
                                            <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nombre + ' ' + p.apellidos}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-12 d-none" id="divProveedor">
                                        <label class="form-label fw-semibold small text-secondary">Proveedor</label>
                                        <select th:field="*{proveedor.id}" class="form-select border-0 bg-light py-2">
                                            <option value="">Seleccionar Proveedor...</option>
                                            <option th:each="prov : ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary">Resumen Económico</h5>
                                <p class="text-muted small">Importes finales de la factura.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Subtotal</label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" th:field="*{subtotal}" class="form-control border-0 bg-light py-2">
                                            <span class="input-group-text border-0 bg-light">€</span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">IVA</label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" th:field="*{iva}" class="form-control border-0 bg-light py-2">
                                            <span class="input-group-text border-0 bg-light">€</span>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary">Total Factura</label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" th:field="*{total}" class="form-control border-0 bg-primary bg-opacity-10 py-2 fw-bold text-primary">
                                            <span class="input-group-text border-0 bg-primary bg-opacity-10 text-primary">€</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/admin/facturas}" class="btn btn-light px-4 fw-bold text-secondary" th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                            <i class="bi bi-check2-circle me-2"></i>
                            <span th:text="${factura.id == null ? 'Crear Factura' : 'Actualizar'}">Guardar</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script>
        // Lógica para mostrar/ocultar Paciente o Proveedor según el tipo
        document.getElementById('tipoFactura').addEventListener('change', function() {
            const divPac = document.getElementById('divPaciente');
            const divProv = document.getElementById('divProveedor');
            
            if (this.value === 'VENTA') {
                divPac.classList.remove('d-none');
                divProv.classList.add('d-none');
            } else {
                divPac.classList.add('d-none');
                divProv.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
