<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.facturacion.titulo')}">Facturación</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body { background-color: var(--background-color); color: var(--text-main); font-family: 'Inter', -apple-system, sans-serif; }

        .glass-card { background: var(--surface-color); border-radius: 16px; border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }

        .search-container { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 2px 15px; transition: all 0.2s ease; }
        .search-container:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1); }
        .search-container input { border: none; box-shadow: none !important; }

        .table thead th { background-color: #fcfcfc; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.03em; color: var(--text-muted); padding: 16px; border-top: none; }
        .table tbody td { padding: 16px; vertical-align: middle; border-color: #f1f1f1; }

        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.02) !important; }

        .bg-purple-subtle { background-color: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
        .select-paginacion-clean { width: 75px; padding: 0.375rem; font-size: 0.85rem; border: 1px solid #dee2e6; border-radius: 8px; }
    </style>
</head>
<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-5">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.facturacion.titulo')}">Facturación</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('facturacion.lista.subtitulo')}">Gestión unificada de cobros por servicios médicos y pruebas.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="search-container d-flex align-items-center">
                        <i class="bi bi-search text-muted me-2"></i>
                        <input type="text" id="searchInput" class="form-control"
                               th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaFacturas">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('facturacion.tabla.fecha')}">FECHA</th>
                                        <th th:text="${trad.getTraduccion('facturacion.tabla.cliente')}">PACIENTE / CLIENTE</th>
                                        <th th:text="${trad.getTraduccion('facturacion.tabla.servicio')}">TIPO DE SERVICIO</th>
                                        <th th:text="${trad.getTraduccion('facturacion.tabla.total')}">TOTAL</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('agenda.tabla.estado')}">ESTADO</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('facturacion.tabla.detalles')}">DETALLES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(facturas)}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="bi bi-receipt-cutoff fs-2 d-block mb-2 opacity-25"></i>
                                            <span th:text="${trad.getTraduccion('facturacion.tabla.vacia')}">No se han encontrado facturas.</span>
                                        </td>
                                    </tr>
                                    <tr th:each="f : ${facturas}" class="border-bottom clickable-row"
                                        th:data-href="@{'/admin/facturas/detalle/' + ${f.id}}">
                                        <td class="ps-4 text-secondary" th:text="${#temporals.format(f.fechaEmision, 'dd/MM/yyyy')}"></td>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px;">
                                                    <i class="bi bi-person"></i>
                                                </div>
                                                <div class="fw-bold text-dark" th:text="${f.paciente != null ? f.paciente.nombre + ' ' + f.paciente.apellidos : 'N/A'}"></div>
                                            </div>
                                        </td>
                                        <td>
                                            <div th:if="${not #lists.isEmpty(f.lineas)}">
                                                <span th:if="${#strings.contains(#strings.toLowerCase(f.lineas[0].concepto), 'servicios') or #strings.contains(#strings.toLowerCase(f.lineas[0].concepto), 'consulta')}" 
                                                      class="badge rounded-pill px-3 py-2 bg-info-subtle text-info">
                                                    <i class="bi bi-calendar-check me-1"></i> <span th:text="${trad.getTraduccion('facturacion.tipo.cita')}">Cita Médica</span>
                                                </span>
                                                <span th:if="${#strings.contains(#strings.toLowerCase(f.lineas[0].concepto), 'prueba')}" 
                                                      class="badge rounded-pill px-3 py-2 bg-purple-subtle">
                                                    <i class="bi bi-clipboard-pulse me-1"></i> <span th:text="${trad.getTraduccion('facturacion.tipo.prueba')}">Prueba Clínica</span>
                                                </span>
                                            </div>
                                            <div th:if="${#lists.isEmpty(f.lineas)}">
                                                <span class="badge rounded-pill px-3 py-2 bg-light text-muted" th:text="${trad.getTraduccion('facturacion.tipo.general')}">Venta General</span>
                                            </div>
                                        </td>
                                        <td class="fw-bold text-dark" th:text="${f.total + ' €'}"></td>
                                        <td class="text-center">
                                            <span th:if="${f.activo}" class="badge bg-success-soft text-success rounded-pill px-3" th:text="${trad.getTraduccion('facturacion.estado.vigente')}">VIGENTE</span>
                                            <span th:if="${!f.activo}" class="badge bg-danger-soft text-danger rounded-pill px-3" th:text="${trad.getTraduccion('facturacion.estado.anulada')}">ANULADA</span>
                                        </td>
                                        <td class="text-center" onclick="event.stopPropagation();">
                                            <a th:href="@{'/admin/facturas/detalle/' + ${f.id}}" class="btn btn-sm btn-light rounded-pill border shadow-sm">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-4 bg-white border-top d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrando</span>
                                <span class="fw-bold text-dark" th:text="${facturas.size()}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.de')}">de</span>
                                <span class="fw-bold text-dark" th:text="${totalElements}"></span>
                            </div>
                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                </select>
                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    <script th:inline="javascript">
        function initTableEvents() {
            document.querySelectorAll(".clickable-row").forEach(row => {
                row.addEventListener("click", function (e) {
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    window.location.href = this.getAttribute("data-href");
                });
            });
        }
        document.addEventListener("DOMContentLoaded", initTableEvents);

        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            fetch(`/admin/facturas/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`)
                .then(res => res.text())
                .then(html => {
                    document.getElementById('tablaContainer').innerHTML = html;
                    initTableEvents();
                });
        }

        function changePage(page) {
            const total = parseInt(document.getElementById('hiddenTotalPages').value);
            if (page >= 0 && page < total) updateTable(page);
        }

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => updateTable(0), 400);
        });
    </script>
</body>
</html>
