<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></th:block>
    <title th:text="${trad.getTraduccion('rrhh.dashboard.titulo')}">Panel de Control - RRHH</title>

    <style>
        .card-stat {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border-radius: 15px;
        }

        .card-stat:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-action {
            border-radius: 12px;
            transition: all 0.3s;
            height: 100%;
        }

        .quick-action:hover {
            background-color: #f8f9fa;
            border-color: #0d6efd !important;
        }

        .uppercase {
            text-transform: uppercase;
        }

        /* Estilos para el contenedor de notificaciones WebSocket */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 350px;
        }
        
        .notification-toast {
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

<body th:with="activePage='dashboard'">

    <div id="toast-container"></div>

    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>

    <main class="content">
        <header class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-0">
                    <span th:text="${trad.getTraduccion('rrhh.dashboard.welcome')}">Dashboard</span>
                    <span th:text="' - ' + ${trad.getTraduccion('vacaciones.panel.rrhh')}">RRHH</span>
                </h2>
                <p class="text-muted" th:text="${trad.getTraduccion('rrhh.dashboard.intro')}">Gestión del capital humano
                    y estados operativos</p>
            </div>
            <div class="d-flex align-items-center">
                <span class="badge bg-primary-subtle text-primary p-2 px-3 rounded-pill me-3">
                    <i class="bi bi-calendar-event me-2"></i>
                    <span th:text="${#temporals.format(#temporals.createNow(), 'dd MMMM yyyy')}"></span>
                </span>
            </div>
        </header>

        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-5">
            <div class="col">
                <a th:href="@{/RRHH/empleados}" class="text-decoration-none">
                    <div class="card border-0 shadow-sm p-3 card-stat h-100">
                        <div class="d-flex align-items-center">
                            <div class="icon-box bg-primary bg-opacity-10 rounded-3 me-3">
                                <i class="bi bi-people text-primary fs-3"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0 small uppercase fw-bold"
                                    th:text="${trad.getTraduccion('rrhh.kpi.total')}">EMPLEADOS</h6>
                                <h3 class="fw-bold mb-0" th:text="${totalEmpleados ?: 0}">0</h3>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col">
                <div class="card border-0 shadow-sm p-3 card-stat h-100">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-success bg-opacity-10 rounded-3 me-3">
                            <i class="bi bi-person-check text-success fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small uppercase fw-bold"
                                th:text="${trad.getTraduccion('rrhh.kpi.active')}">ACTIVOS</h6>
                            <h3 class="fw-bold mb-0" th:text="${empleadosActivos ?: 0}">0</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card border-0 shadow-sm p-3 card-stat h-100">
                    <div class="d-flex align-items-center">
                        <div class="icon-box bg-danger bg-opacity-10 rounded-3 me-3">
                            <i class="bi bi-person-x text-danger fs-3"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0 small uppercase fw-bold"
                                th:text="${trad.getTraduccion('rrhh.kpi.inactive')}">BAJAS</h6>
                            <h3 class="fw-bold mb-0" th:text="${empleadosInactivos ?: 0}">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-4 d-flex align-items-center">
                <i class="bi bi-gear-fill me-2 text-secondary"></i>
                <span th:text="${trad.getTraduccion('rrhh.actions.title')}">Gestión de Recursos Humanos</span>
            </h5>

            <div class="row g-4 justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card h-100 border p-3 quick-action d-flex flex-column shadow-sm"
                        style="border-radius: 15px;">
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-success bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-file-earmark-text text-success fs-3"></i>
                            </div>
                            <div>
                                <h5 class="mb-0 fw-bold" th:text="${trad.getTraduccion('rrhh.actions.pay')}">Nóminas
                                </h5>
                                <small class="text-muted"
                                    th:text="${trad.getTraduccion('rrhh.activity.payroll')}">Generación y revisión
                                    mensual</small>
                            </div>
                        </div>
                        <div class="mt-auto"> <a th:href="@{/RRHH/nominas}"
                                class="btn btn-outline-success w-100 fw-bold rounded-pill"
                                th:text="${trad.getTraduccion('btn.entrar')}">Entrar</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-lg-5">
                    <div class="card h-100 border p-3 quick-action d-flex flex-column shadow-sm"
                        style="border-radius: 15px;">
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-warning bg-opacity-10 p-3 rounded me-3">
                                <i class="bi bi-calendar-check text-warning fs-3"></i>
                            </div>
                            <div>
                                <h5 class="mb-0 fw-bold" th:text="${trad.getTraduccion('rrhh.actions.vac')}">Vacaciones
                                </h5>
                                <small class="text-muted"
                                    th:text="${trad.getTraduccion('vacaciones.subtituloRRHH')}">Solicitudes y
                                    ausencias</small>
                            </div>
                        </div>
                        <div class="mt-auto">
                            <a th:href="@{/vacaciones}" class="btn btn-outline-warning w-100 fw-bold rounded-pill"
                                th:text="${trad.getTraduccion('btn.entrar')}">Entrar</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer class="mt-5 text-center text-muted">
            <small th:text="${trad.getTraduccion('footer.copy')}">&copy; 2026 Clínica Harmonia</small>
        </footer>
    </main>

    <div th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        var socket = new SockJS('/ws-clinica');
        var stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            console.log('RRHH conectado a notificaciones: ' + frame);
            
            stompClient.subscribe('/topic/vacaciones', function (notificacion) {
                mostrarNotificacionEmergente(notificacion.body);
            });
        });

        function mostrarNotificacionEmergente(mensaje) {
            const container = document.getElementById('toast-container');
            const id = 'notif-' + Date.now();
            
            const toastHtml = `
                <div id="${id}" class="alert alert-info alert-dismissible fade show shadow notification-toast border-start border-info border-5 mb-3" role="alert">
                    <div class="d-flex align-items-center">
                        <i class="bi bi-info-circle-fill fs-4 me-3"></i>
                        <div>
                            <strong class="d-block">Solicitud de Vacaciones</strong>
                            <span class="small">${mensaje}</span>
                        </div>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            
            container.insertAdjacentHTML('afterbegin', toastHtml);

            // Auto-cerrar después de 8 segundos
            setTimeout(() => {
                const toast = document.getElementById(id);
                if (toast) {
                    const bsAlert = new bootstrap.Alert(toast);
                    bsAlert.close();
                }
            }, 8000);
        }
    </script>
</body>

</html>
