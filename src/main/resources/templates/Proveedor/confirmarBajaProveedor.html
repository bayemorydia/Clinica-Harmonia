<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad != null ? trad.getTraduccion('proveedor.baja.titulo') : 'Confirmar baja'}">
        Confirmar baja proveedor
    </title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <div class="card shadow-sm border-0" style="border-radius:15px;">
            <div class="card-header bg-white border-0 py-4 px-4">
                <div class="d-flex align-items-center">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-3 me-3">
                        <i class="bi bi-truck text-warning fs-4"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">
                            Confirmar baja del proveedor
                        </h3>
                        <p class="text-muted small mb-0">
                            El proveedor quedará inactivo pero no será eliminado
                        </p>
                    </div>
                </div>
            </div>

            <div class="card-body p-4">
                <div class="alert alert-warning border-0">
                    ⚠️ Esta acción **no borra el proveedor**, solo lo marca como inactivo.
                </div>

                <ul class="list-group mb-4">
                    <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${proveedor.nombre}"></span></li>
                    <li class="list-group-item"><strong>CIF:</strong> <span th:text="${proveedor.cif}"></span></li>
                    <li class="list-group-item"><strong>Teléfono:</strong> <span th:text="${proveedor.telefono}"></span></li>
                    <li class="list-group-item"><strong>Email:</strong> <span th:text="${proveedor.email}"></span></li>
                </ul>

                <form th:action="@{/proveedores/baja}" method="post" class="d-flex justify-content-end gap-3">
                    <input type="hidden" name="id" th:value="${proveedor.id}">
                    <a th:href="@{/proveedores}" class="btn btn-light">Cancelar</a>
                    <button type="submit" class="btn btn-warning fw-bold">
                        Confirmar baja
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
