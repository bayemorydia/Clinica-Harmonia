<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${proveedor.id == null ? 'Nuevo proveedor' : 'Editar proveedor'}">
        Formulario Proveedor
    </title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <!-- Breadcrumb -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/proveedores}">Proveedores</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${proveedor.id == null ? 'Añadir proveedor' : 'Editar proveedor'}">
                        Registro
                    </li>
                </ol>
            </nav>
        </div>

        <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
            <!-- Hidden fields para edición y control de fechas/estado -->
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{fecha_alta}" />
            <input type="hidden" th:field="*{fecha_baja}" />
            <input type="hidden" th:field="*{activo}" />

            <div class="card shadow-sm border-0" style="border-radius: 15px;">
                <div class="card-header bg-white border-0 py-4 px-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-truck text-primary fs-4"></i>
                        </div>
                        <div>
                            <h3 class="mb-0 fw-bold text-dark"
                                th:text="${proveedor.id == null ? 'Añadir proveedor' : 'Editar proveedor'}">
                                Formulario Proveedor
                            </h3>
                            <p class="mb-0 text-muted small">
                                Gestión de datos del proveedor
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-lg-5">

                    <!-- Error general -->
                    <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                        <i class="bi bi-exclamation-octagon me-2"></i>
                        <div th:text="${error}"></div>
                    </div>

                    <!-- Sección: Información básica -->
                    <div class="row mb-5">
                        <div class="col-xl-3 col-lg-4">
                            <h5 class="fw-bold text-primary">Información Básica</h5>
                            <p class="text-muted small">Datos principales del proveedor.</p>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Nombre</label>
                                    <input type="text" th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="Farmacéutica Central">
                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">CIF</label>
                                    <input type="text" th:field="*{cif}"
                                           th:classappend="${#fields.hasErrors('cif')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="A12345678">
                                    <div class="invalid-feedback" th:errors="*{cif}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Teléfono</label>
                                    <input type="tel" th:field="*{telefono}"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="600000000">
                                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Email</label>
                                    <input type="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="contacto@proveedor.com">
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold small text-secondary">Dirección Fiscal</label>
                                    <input type="text" th:field="*{direccion}"
                                           th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="Calle, Número, Ciudad">
                                    <div class="invalid-feedback" th:errors="*{direccion}"></div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

                <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                    <a th:href="@{/proveedores}" class="btn btn-light px-4 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                        Guardar Proveedor
                    </button>
                </div>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
