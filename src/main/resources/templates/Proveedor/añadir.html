<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Formulario Proveedor</title>
</head>
<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>
<main class="content">
    <div class="container py-4">
        <form th:action="${proveedor.id == null ? '/proveedores/guardar' : '/proveedores/actualizar?id='+proveedor.id}" th:object="${proveedor}" method="post">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-10">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-header bg-white border-0 py-4 px-4 d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3"><i class="bi bi-truck text-primary fs-3"></i></div>
                            <div>
                                <h3 class="mb-0 fw-bold" th:text="${proveedor.id == null ? 'Nuevo Proveedor' : 'Editar Proveedor'}"></h3>
                                <p class="mb-0 text-muted small">Complete los datos legales y de contacto.</p>
                            </div>
                        </div>
                        <div class="card-body p-4 p-md-5">
                            <div th:if="${error}" class="alert alert-danger rounded-pill px-4 border-0 mb-4" th:text="${error}"></div>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Nombre Comercial</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0 py-2" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">CIF / NIF</label>
                                    <input type="text" th:field="*{cif}" class="form-control bg-light border-0 py-2" th:classappend="${#fields.hasErrors('cif')} ? 'is-invalid'">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Teléfono</label>
                                    <input type="tel" th:field="*{telefono}" class="form-control bg-light border-0 py-2" th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Email</label>
                                    <input type="email" th:field="*{email}" class="form-control bg-light border-0 py-2" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-bold text-secondary">Dirección Completa</label>
                                    <input type="text" th:field="*{direccion}" class="form-control bg-light border-0 py-2" th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'">
                                </div>
                            </div>

                            <div class="card-footer bg-white border-0 p-0 mt-5 d-flex justify-content-between">
                                <a th:href="@{/proveedores}" class="btn btn-outline-secondary rounded-pill px-4 fw-bold">Cancelar</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">Guardar Cambios</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
