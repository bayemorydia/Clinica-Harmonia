<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad != null ? trad.getTraduccion('proveedor.eliminar.titulo') : 'Eliminar Proveedor'}">
        Eliminar Proveedor
    </title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <!-- Breadcrumb -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/proveedores}" th:text="${trad != null ? trad.getTraduccion('proveedores.lista.titulo') : 'Proveedores'}">Proveedores</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${trad != null ? trad.getTraduccion('proveedor.eliminar.titulo') : 'Eliminar'}">Eliminar</li>
                </ol>
            </nav>
        </div>

        <!-- Card -->
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-8">
                <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">

                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-danger bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-trash text-danger fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-danger" th:text="${trad != null ? trad.getTraduccion('proveedor.eliminar.titulo') : 'Eliminar Proveedor Definitivamente'}">
                                    Eliminar proveedor definitivamente
                                </h3>
                                <p class="mb-0 text-muted small">⚠️ Esta acción NO se puede deshacer</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-5 text-center">
                        <p class="lead fw-semibold text-dark mb-4">¿Estás seguro de que deseas eliminar permanentemente al proveedor?</p>

                        <div class="bg-light p-4 rounded-4 border border-light-subtle mb-4">
                            <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                                 style="width: 60px; height: 60px;">
                                <h4 class="mb-0 fw-bold" th:text="${#strings.substring(proveedor.nombre,0,1)}"></h4>
                            </div>
                            <h5 class="fw-bold mb-1 text-dark" th:text="${proveedor.nombre}"></h5>
                            <p class="mb-0 text-muted font-monospace small" th:text="'CIF: ' + ${proveedor.cif}"></p>
                            <p class="mb-0 text-muted font-monospace small" th:text="'Teléfono: ' + ${proveedor.telefono}"></p>
                            <p class="mb-0 text-muted font-monospace small" th:text="'Email: ' + ${proveedor.email}"></p>
                        </div>

                        <div class="alert alert-danger border-0 small mb-0 shadow-sm">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${trad != null ? trad.getTraduccion('proveedor.eliminar.aviso') : 'El proveedor será eliminado permanentemente de la base de datos.'}">
                                    El proveedor será eliminado permanentemente de la base de datos.
                                </span>
                        </div>

                        <form th:action="@{/proveedores/eliminarFisico}" method="post" class="mt-5">
                            <input type="hidden" name="id" th:value="${proveedor.id}" />

                            <div class="d-flex justify-content-center gap-3">
                                <a th:href="@{/proveedores}" class="btn btn-light px-4 py-2 fw-bold text-secondary rounded-pill">
                                    <span th:text="${trad != null ? trad.getTraduccion('btn.cancelar') : 'Cancelar'}">Cancelar</span>
                                </a>
                                <button type="submit" class="btn btn-danger px-4 py-2 fw-bold shadow-sm rounded-pill transition-all hover-lift">
                                    <i class="bi bi-trash me-2"></i>
                                    <span th:text="${trad != null ? trad.getTraduccion('btn.confirmar.eliminar') : 'Sí, Eliminar Proveedor'}">Sí, Eliminar Proveedor</span>
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                        <small class="text-muted italic">Módulo de Gestión de Proveedores</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

<style>
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .1) !important;
    }

    .transition-all {
        transition: all 0.2s ease-in-out;
    }

    body {
        background-color: #f8f9fa;
    }
</style>
</body>

</html>
