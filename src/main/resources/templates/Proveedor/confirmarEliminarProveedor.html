<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Eliminar proveedor</title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <div class="card shadow-sm border-0" style="border-radius:15px;">
            <div class="card-header bg-white border-0 py-4 px-4">
                <div class="d-flex align-items-center">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-3 me-3">
                        <i class="bi bi-trash text-danger fs-4"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0 text-danger">
                            Eliminar proveedor definitivamente
                        </h3>
                        <p class="text-muted small mb-0">
                            ⚠️ Esta acción NO se puede deshacer
                        </p>
                    </div>
                </div>
            </div>

            <div class="card-body p-4">
                <div class="alert alert-danger border-0">
                    ❌ El proveedor será **eliminado permanentemente** de la base de datos.
                </div>

                <ul class="list-group mb-4">
                    <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${proveedor.nombre}"></span></li>
                    <li class="list-group-item"><strong>CIF:</strong> <span th:text="${proveedor.cif}"></span></li>
                    <li class="list-group-item"><strong>Teléfono:</strong> <span th:text="${proveedor.telefono}"></span></li>
                    <li class="list-group-item"><strong>Email:</strong> <span th:text="${proveedor.email}"></span></li>
                </ul>

                <form th:action="@{/proveedores/eliminarFisico}" method="post"
                      class="d-flex justify-content-end gap-3">
                    <input type="hidden" name="id" th:value="${proveedor.id}">
                    <a th:href="@{/proveedores}" class="btn btn-light">Cancelar</a>
                    <button type="submit" class="btn btn-danger fw-bold">
                        Eliminar definitivamente
                    </button>
                </form>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
