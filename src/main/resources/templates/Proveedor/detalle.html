<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${proveedor.nombre}">Editar Proveedor</title>
</head>

<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid py-4">

        <!-- ALERTA DE ERROR -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- BREADCRUMB -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/proveedores}" th:text="${trad != null ? trad.getTraduccion('proveedores.lista.titulo') : 'Proveedores'}">Proveedores</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${trad != null ? trad.getTraduccion('proveedor.detalle.titulo') : 'Detalle'}">Detalle</li>
                </ol>
            </nav>
        </div>

        <!-- FORMULARIO EDICIÓN -->
        <form th:action="@{/proveedores/actualizar(id=${proveedor.id})}" th:object="${proveedor}" method="post">

            <div class="row g-4">
                <!-- IZQUIERDA: INFO PRINCIPAL -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px; overflow: hidden;">
                        <div class="card-header bg-primary py-4 border-0"></div>
                        <div class="card-body text-center position-relative" style="margin-top: -50px;">
                            <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                                 style="width: 100px; height: 100px; border: 5px solid white;">
                                <i class="bi bi-shop fs-2 text-primary"></i>
                            </div>
                            <h4 class="fw-bold mb-1 text-dark" th:text="${proveedor.nombre}">Proveedor X</h4>
                            <p class="text-muted small mb-4" th:text="${proveedor.email}">correo@proveedor.com</p>

                            <!-- ESTADO -->
                            <div>
                                <span th:classappend="${proveedor.activo} ? 'badge rounded-pill bg-success-subtle text-success px-3 py-2' : 'badge rounded-pill bg-light text-secondary px-3 py-2'"
                                      th:text="${proveedor.activo ? (trad != null ? trad.getTraduccion('activo') : 'Activo') : (trad != null ? trad.getTraduccion('inactivo') : 'Inactivo')}">
                                    Activo
                                </span>
                            </div>

                            <!-- USUARIO DE ACCESO (si existe) -->
                            <div th:if="${proveedor.usuario != null}" class="mb-4 p-2 rounded-3 bg-light bg-opacity-50 border">
                                <div class="fw-bold small text-uppercase text-muted mb-1"
                                     th:text="${trad != null ? trad.getTraduccion('empleados.form.usuario') : 'Usuario de acceso'}">
                                    Usuario de acceso
                                </div>
                                <div class="text-primary fw-bold d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-badge-fill me-2"></i>
                                    <span th:text="${proveedor.usuario.username}"></span>
                                </div>
                            </div>

                        </div>
                        <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                            <small class="text-muted">
                                <span th:text="${trad != null ? trad.getTraduccion('proveedor.fecha_alta') : 'Fecha alta'}"></span>:
                                <span class="fw-bold" th:text="${#temporals.format(proveedor.fecha_alta, 'dd/MM/yyyy')}">01/01/2025</span>
                            </small>
                        </div>
                    </div>
                </div>

                <!-- DERECHA: FORMULARIO DETALLES -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body p-4 p-md-5">

                            <!-- SECCIÓN INFORMACIÓN DEL PROVEEDOR -->
                            <div class="mb-5">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="fw-bold mb-0 text-primary d-flex align-items-center">
                                        <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3">
                                            <i class="bi bi-info-circle-fill"></i>
                                        </span>
                                        <span th:text="${trad != null ? trad.getTraduccion('proveedor.detalle.seccion.informacion') : 'Información del Proveedor'}"></span>
                                    </h5>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">Nombre</label>
                                        <input type="text" th:field="*{nombre}" class="form-control rounded-3 bg-light bg-opacity-25" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">CIF</label>
                                        <input type="text" th:field="*{cif}" class="form-control rounded-3 bg-light bg-opacity-25" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">Teléfono</label>
                                        <input type="text" th:field="*{telefono}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">Email</label>
                                        <input type="email" th:field="*{email}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold text-secondary">Dirección</label>
                                        <input type="text" th:field="*{direccion}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="card-footer bg-white border-0 p-4 p-md-5 pt-0 text-end">
                            <hr class="my-4 opacity-25">
                            <a th:href="@{/proveedores}" class="btn btn-light px-4 fw-bold text-secondary rounded-pill">
                                <span th:text="${trad != null ? trad.getTraduccion('btn.volver') : 'Volver'}">Volver</span>
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-lg transition-all hover-lift">
                                <i class="bi bi-check2-circle me-2"></i>
                                <span th:text="${trad != null ? trad.getTraduccion('btn.guardar') : 'Guardar'}">Guardar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </form>
    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

<style>
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
    }
    .transition-all {
        transition: all 0.2s ease-in-out;
    }
</style>
</body>
</html>
