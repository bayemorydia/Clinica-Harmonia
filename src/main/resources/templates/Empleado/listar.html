<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></th:block>
    <th:block sec:authorize="!hasRole('RRHH')" th:replace="~{Reutilizable/layout :: head_general}"></th:block>

    <title th:text="${trad.getTraduccion('mod.empleados')}">Empleados</title>

    <style>
        :root { --surface-color: #ffffff; --background-color: #f8f9fa; --primary-color: #0d6efd; --text-muted: #6c757d; }
        .glass-card { background: var(--surface-color); border-radius: 16px; border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }
        .search-container { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 2px 15px; transition: all 0.2s ease; }
        .search-container:focus-within { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1); }
        .search-container input { border: none; box-shadow: none !important; }
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.02) !important; }
        .table-footer { padding: 1.25rem 1.5rem; background-color: #ffffff; border-top: 1px solid #edf2f7; }
        .select-paginacion-clean { width: 75px; padding: 0.375rem; font-size: 0.85rem; border: 1px solid #dee2e6; border-radius: 8px; }
        .pagination .page-link { color: #6c757d; border: none; background: #f1f3f5; margin: 0 3px; border-radius: 8px !important; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .pagination .page-item.active .page-link { background-color: var(--primary-color) !important; color: white !important; }
    </style>
</head>

<body>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>
    <div sec:authorize="!hasRole('RRHH')" th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-4">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.empleados')}">Empleados</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('empleados.lista.subtitulo')}">Gestión de personal.</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/nominas}" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" sec:authorize="hasRole('RRHH')">
                        <i class="bi bi-receipt me-2"></i>
                        <span th:text="${trad.getTraduccion('mod.facturacion.titulo')}">Nóminas</span>
                    </a>
                    <a th:href="@{/empleados/nuevo}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                        <i class="bi bi-person-plus-fill me-2"></i>
                        <span th:text="${trad.getTraduccion('empleados.btn.nuevo')}">Nuevo Empleado</span>
                    </a>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="search-container d-flex align-items-center">
                                <i class="bi bi-search text-muted me-2"></i>
                                <input type="text" id="searchInput" class="form-control shadow-none" th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="statusFilter" class="form-select border-0 shadow-sm" style="border-radius: 10px; height: 45px;" onchange="updateTable(0)">
                                <option value="" th:selected="${activo == null}" th:text="${trad.getTraduccion('pacientes.filtro.todos')}">Todos</option>
                                <option value="true" th:selected="${activo == true}" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activos</option>
                                <option value="false" th:selected="${activo == false}" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivos</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaEmpleados">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('pacientes.tabla.nombre')}">NOMBRE</th>
                                        <th th:text="${trad.getTraduccion('pacientes.tabla.dni')}">DNI</th>
                                        <th th:text="${trad.getTraduccion('pacientes.tabla.estado')}">ESTADO</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(empleados)}">
                                        <td colspan="4" class="text-center py-5 text-muted" th:text="${trad.getTraduccion('pacientes.tabla.vacia')}">Vacío</td>
                                    </tr>
                                    <tr th:each="e : ${empleados}" class="border-bottom clickable-row" th:onclick="|window.location.href='/empleados/detalle?id=' + ${e.id}|">
                                        <td class="ps-4">
                                            <div class="d-flex align-items-center">
                                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                                                    <span class="fw-bold" th:text="${#strings.substring(e.nombre,0,1)}"></span>
                                                </div>
                                                <div>
                                                    <div class="fw-bold text-dark mb-0" th:text="${e.nombre} + ' ' + ${e.apellidos}"></div>
                                                    <div class="text-muted small" th:text="${e.email}"></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="text-secondary font-monospace" th:text="${e.dni}"></td>
                                        <td>
                                            <span th:if="${e.activa}" class="badge rounded-pill bg-success-subtle text-success px-3 py-2" th:text="${trad.getTraduccion('pacientes.estado.activo')}"></span>
                                            <span th:unless="${e.activa}" class="badge rounded-pill bg-light text-secondary px-3 py-2" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}"></span>
                                        </td>
                                        <td class="text-center" onclick="event.stopPropagation();">
                                            <a th:if="${e.activa}" th:href="@{'/empleados/confirmarBaja/' + ${e.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-person-x me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}"></span>
                                            </a>
                                            <a th:unless="${e.activa}" th:href="@{'/empleados/activar/' + ${e.id}}" class="btn btn-sm btn-outline-success rounded-pill px-3">
                                                <i class="bi bi-person-check me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.activar')}"></span>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="table-footer d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span class="fw-bold" th:text="${(currentPage * size) + 1}">1</span> a
                                <span class="fw-bold" th:text="${(currentPage * size) + empleados.size()}">10</span> de
                                <span class="fw-bold" th:text="${totalElements}">100</span>
                            </div>
                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                    <option value="50" th:selected="${size == 50}">50</option>
                                </select>
                                <nav th:if="${totalPages > 0}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'">
                                                <i class="bi bi-chevron-left"></i>
                                            </a>
                                        </li>
                                        <li class="page-item active"><span class="page-link" th:text="${currentPage + 1}">1</span></li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'">
                                                <i class="bi bi-chevron-right"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const activo = document.getElementById('statusFilter').value;
            const container = document.getElementById('tablaContainer');
            
            // Detectar prefijo dinámico para evitar 403
            const path = window.location.pathname;
            let prefix = path.includes("/RRHH") ? "/RRHH" : "";

            const params = new URLSearchParams({ query, page, size });
            if (activo !== "") params.append("activo", activo);

            fetch(`${prefix}/empleados/search?${params.toString()}`)
                .then(r => {
                    if (!r.ok) throw new Error('Error ' + r.status);
                    return r.text();
                })
                .then(html => { container.innerHTML = html; })
                .catch(err => console.error("Error:", err));
        }

        function changePage(page) {
            const totalPagesEl = document.getElementById('hiddenTotalPages');
            if (!totalPagesEl) return;
            const totalPages = parseInt(totalPagesEl.value);
            if (page >= 0 && page < totalPages) updateTable(page);
        }

        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 400);
        });
    </script>
</body>
</html>
