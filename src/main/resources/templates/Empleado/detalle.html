<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: head_general}">
    </div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></div>
    <title th:text="${empleado.nombre} + ' ' + ${empleado.apellidos}">Detalle Empleado</title>
</head>

<body class="bg-light">
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>

    <main
        th:class="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')} ? (${#authorization.expression('hasRole(''ROLE_MEDICO'')')} ? 'content-medico' : 'content-recepcion') : 'content'">
        <div class="container-fluid pt-0 pb-4">

            <div class="mx-auto mt-0" style="max-width: 1100px;">
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm small py-2 mb-3 mt-0"
                 th:text="${error}"></div>
        </div>
            <div class="card shadow-sm border-0 mx-auto mt-0" style="border-radius: 15px; max-width: 1100px;">
            <div class="card-header bg-white border-0 py-4 px-4 d-flex justify-content-between align-items-center">
                
                    <div class="d-flex align-items-center">
                        <div class="bg-info bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-person-badge text-info fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark"
                                th:text="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')} ? ${trad.getTraduccion('empleado.perfil.titulo')} : ${trad.getTraduccion('empleado.detalle.titulo')}">
                                Ficha del Empleado</h4>
                            <p class="text-muted small mb-0"
                                th:text="${trad.getTraduccion('empleado.detalle.subtitulo')}">Gestión de información
                                laboral y personal.</p>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{'/empleados/nominas/' + ${empleado.id}}" sec:authorize="hasRole('RRHH')"
                            class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">
                            <i class="bi bi-receipt me-2"></i><span
                                th:text="${trad.getTraduccion('mod.nominas.titulo')}"></span>
                        </a>
                    </div>
                </div>

                <div class="card-body p-4">
                    <div class="row mb-4">
                        <div class="col-xl-3 col-lg-4">
                            <h6 class="fw-bold text-info text-uppercase small"
                                th:text="${trad.getTraduccion('empleado.form.sec.avatar')}">Identidad</h6>
                            <p class="text-muted small"
                                th:text="${trad.getTraduccion('empleado.form.sec.avatar.desc')}">Estado actual del
                                profesional en la clínica.</p>
                        </div>
                        <div class="col-xl-9 col-lg-8">
                            <div class="d-flex align-items-center gap-4 p-3 bg-light rounded-3">
                                <div class="bg-white rounded-circle d-flex align-items-center justify-content-center shadow-sm border border-2 border-white"
                                    style="width: 100px; height: 100px;">
                                    <h1 class="mb-0 fw-bold text-info"
                                        th:text="${#strings.substring(empleado.nombre,0,1)}"></h1>
                                </div>
                                <div>
                                    <div th:class="${empleado.activa} ? 'badge rounded-pill bg-success-soft text-success px-3' : 'badge rounded-pill bg-danger-soft text-danger px-3'"
                                        th:text="${empleado.activa} ? ${trad.getTraduccion('pacientes.estado.activo')} : ${trad.getTraduccion('pacientes.estado.inactivo')}">
                                    </div>
                                    <p class="text-dark small mt-2 mb-0 fw-bold">
                                        <i class="bi bi-shield-lock me-1 text-info"></i>
                                        <span th:text="${trad.getTraduccion('paciente.label.usuario_asignado')}"></span>
                                        <span class="text-muted fw-normal"
                                            th:text="${empleado.usuario != null ? empleado.usuario.username : 'N/A'}"></span>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <form th:action="@{/empleados/actualizar}" th:object="${empleado}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h6 class="fw-bold text-info text-uppercase small"
                                    th:text="${trad.getTraduccion('paciente.seccion.personales')}">Datos Personales</h6>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('empleado.form.sec.personales.desc')}">Información
                                    básica de identidad.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('paciente.label.nombre')}"></label>
                                        <input type="text" th:field="*{nombre}"
                                            class="form-control bg-light border-0 py-2"
                                            th:readonly="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')}"
                                            required
                                            oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('paciente.label.apellidos')}"></label>
                                        <input type="text" th:field="*{apellidos}"
                                            class="form-control bg-light border-0 py-2"
                                            th:readonly="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')}"
                                            required
                                            oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '')">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('paciente.label.dni')}"></label>
                                        <input type="text" th:field="*{dni}"
                                            class="form-control bg-light border-0 py-2 font-monospace"
                                            th:readonly="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')}"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('paciente.label.telefono')}"></label>
                                        <input type="text" th:field="*{telefono}"
                                            class="form-control bg-light border-0 py-2"
                                            th:readonly="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')}"
                                            maxlength="9" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                               th:text="${trad.getTraduccion('paciente.form.email')}"></label>
                                        <input type="email" th:field="*{email}"
                                               class="form-control bg-light border-0 py-2"
                                               readonly>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h6 class="fw-bold text-info text-uppercase small"
                                    th:text="${trad.getTraduccion('empleado.form.sec.laboral')}">Información Laboral
                                </h6>
                                <p class="text-muted small"
                                    th:text="${trad.getTraduccion('empleado.form.sec.laboral.desc')}">Detalles
                                    contractuales y de jornada.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('nomina.label.salario_base')}"></label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" th:field="*{salarioBase}"
                                                class="form-control bg-light border-0 py-2"
                                                th:readonly="${!#authorization.expression('hasAnyRole(''ROLE_ADMINISTRADOR'', ''ROLE_RRHH'')')}">
                                            <span class="input-group-text bg-light border-0">€</span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.rol')}"></label>
                                        <select th:field="*{rol.id}" class="form-select bg-light border-0 py-2"
                                            th:disabled="${!#authorization.expression('hasAnyRole(''ROLE_ADMINISTRADOR'', ''ROLE_RRHH'')')}">
                                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.hora_inicio')}"></label>
                                        <input type="time" th:value="${#temporals.format(empleado.inicio, 'HH:mm')}"
                                            id="inicio" name="inicio" class="form-control bg-light border-0 py-2"
                                            th:readonly="${!#authorization.expression('hasAnyRole(''ROLE_ADMINISTRADOR'', ''ROLE_RRHH'')')}">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.hora_fin')}"></label>
                                        <input type="time" th:field="*{fin}" class="form-control bg-light border-0 py-2"
                                            th:readonly="${!#authorization.expression('hasAnyRole(''ROLE_ADMINISTRADOR'', ''ROLE_RRHH'')')}">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.turno')}"></label>
                                        <select th:field="*{turno.id}" class="form-select bg-light border-0 py-2"
                                            th:disabled="${!#authorization.expression('hasAnyRole(''ROLE_ADMINISTRADOR'', ''ROLE_RRHH'')')}">
                                            <option th:each="t : ${turnos}" th:value="${t.id}" th:text="${t.nombre}">
                                            </option>
                                        </select>
                                    </div>
                                </div>

                                <div sec:authorize="hasAnyRole('MEDICO', 'RECEPCIONISTA')"
                                    class="alert alert-info border-0 shadow-sm mt-4 rounded-3 d-flex align-items-center">
                                    <i class="bi bi-info-circle-fill me-3 fs-4"></i>
                                    <span th:text="${trad.getTraduccion('empleado.msg.lectura')}"></span>
                                </div>

                                <div class="mt-5 pt-3 border-top d-flex justify-content-between">
                                    <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/empleados}"
                                        class="btn btn-light rounded-pill px-4 fw-bold">
                                        <i class="bi bi-arrow-left me-2"></i> <span
                                            th:text="${trad.getTraduccion('btn.volver')}"></span>
                                    </a>

                                    <a sec:authorize="hasRole('MEDICO')" th:href="@{/medico/dashboard}"
                                        class="btn btn-light rounded-pill px-4 fw-bold">
                                        <i class="bi bi-arrow-left me-2"></i> <span
                                            th:text="${trad.getTraduccion('btn.volver')}"></span>
                                    </a>

                                    <a sec:authorize="hasRole('RECEPCIONISTA')" th:href="@{/recepcion/dashboard}"
                                        class="btn btn-light rounded-pill px-4 fw-bold">
                                        <i class="bi bi-arrow-left me-2"></i> <span
                                            th:text="${trad.getTraduccion('btn.volver')}"></span>
                                    </a>

                                    <a sec:authorize="hasRole('RRHH')" th:href="@{/RRHH/dashboard}"
                                        class="btn btn-light rounded-pill px-4 fw-bold">
                                        <i class="bi bi-arrow-left me-2"></i> <span
                                            th:text="${trad.getTraduccion('btn.volver')}"></span>
                                    </a>
                                    <button type="submit" sec:authorize="hasAnyRole('ADMINISTRADOR','RRHH')"
                                        class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                                        <i class="bi bi-save me-2"></i> <span
                                            th:text="${trad.getTraduccion('btn.guardarCambios')}"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts comunes -->
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}">
    </div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: scripts}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>
    <!-- Validaciones JS -->
    <script>
        const nombreInput = document.querySelector('input[name="nombre"]');
        const apellidosInput = document.querySelector('input[name="apellidos"]');
        const emailInput = document.querySelector('input[name="email"]');

        function generarEmail() {
            const nombre = nombreInput.value.trim().toLowerCase();
            const apellidos = apellidosInput.value.trim().toLowerCase().split(/\s+/)[0];
            if (nombre && apellidos) {
                emailInput.value = `${nombre}.${apellidos}@harmonia.com`;
            } else {
                emailInput.value = '';
            }
        }

        nombreInput.addEventListener('input', generarEmail);
        apellidosInput.addEventListener('input', generarEmail);

        const inicioInput = document.querySelector('input[name="inicio"]');
        const finInput = document.querySelector('input[name="fin"]');

        function validarHoras() {
            const inicio = inicioInput.value;
            const fin = finInput.value;

            finInput.setCustomValidity(''); // limpiar error previo

            if (inicio && fin) {
                const [hIni, mIni] = inicio.split(':').map(Number);
                const [hFin, mFin] = fin.split(':').map(Number);

                const inicioMin = hIni * 60 + mIni;
                const finMin = hFin * 60 + mFin;

                const minHorario = 8 * 60;  // 08:00 en minutos
                const maxHorario = 22 * 60; // 22:00 en minutos

                // Validar dentro del rango permitido
                if (inicioMin < minHorario || inicioMin > maxHorario) {
                    finInput.setCustomValidity('La hora de inicio debe estar entre 08:00 y 22:00');
                } else if (finMin < minHorario || finMin > maxHorario) {
                    finInput.setCustomValidity('La hora de fin debe estar entre 08:00 y 22:00');
                }
                // Validar que fin > inicio
                else if (finMin <= inicioMin) {
                    finInput.setCustomValidity('La hora de fin debe ser mayor que la hora de inicio');
                }
            }

            finInput.reportValidity(); // mostrar mensaje como required
        }

        inicioInput.addEventListener('change', validarHoras);
        finInput.addEventListener('change', validarHoras);


        const salarioInput = document.querySelector('input[name="salarioBase"]');
        salarioInput.addEventListener('input', () => {
            if (salarioInput.value < 0) {
                salarioInput.value = '';
                alert('El salario no puede ser negativo');
            }
        });
    </script>

    <style>
        .hover-lift:hover {
            transform: translateY(-2px);
        }

        .transition-all {
            transition: all 0.2s ease;
        }
    </style>

</body>

</html>
