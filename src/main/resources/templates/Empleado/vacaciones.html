<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    
    <title th:text="${trad.getTraduccion('vacaciones.titulo')}">Vacaciones</title>
</head>

<body class="bg-light">
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: menu}"></div>

    <main th:class="${#authorization.expression('hasAnyRole(''ROLE_MEDICO'', ''ROLE_RECEPCIONISTA'')')} ? (${#authorization.expression('hasRole(''ROLE_MEDICO'')')} ? 'content-medico' : 'content-recepcion') : 'content'">
        <div class="container-fluid py-4">

            <div class="mb-4">
                <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('vacaciones.titulo')}">Vacaciones</h2>
                <p class="text-muted" th:text="${trad.getTraduccion('vacaciones.subtitulo')}"></p>
            </div>

            <div th:if="${param.error != null}" class="mb-4">
                <div th:if="${param.error[0] == 'solapamiento'}"
                    class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${trad.getTraduccion('vacaciones.error.solapamiento')}">Error de solapamiento</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${param.error[0] == 'fecha'}"
                    class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
                    <i class="bi bi-calendar-x me-2"></i>
                    <span th:text="${trad.getTraduccion('vacaciones.error.fechas')}">Error en fechas</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>

            <div th:if="${param.success}"
                class="alert alert-success alert-dismissible fade show border-0 shadow-sm mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${trad.getTraduccion('vacaciones.exito.solicitud')}">Éxito</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 bg-primary text-white mb-4" style="border-radius: 15px;">
                        <div class="card-body p-4 text-center">
                            <i class="bi bi-sun fs-1 mb-2"></i>
                            <h6 class="text-white-50 text-uppercase small fw-bold"
                                th:text="${trad.getTraduccion('vacaciones.disponibles')}">Días Disponibles</h6>
                            <h1 class="display-4 fw-bold mb-0" th:text="${diasDisponibles ?: 22}">22</h1>
                            <small class="text-white-50"
                                th:text="${trad.getTraduccion('vacaciones.periodo.actual')}">2026</small>
                        </div>
                    </div>

                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4 text-primary">
                                <i class="bi bi-plus-circle me-2"></i>
                                <span th:text="${trad.getTraduccion('vacaciones.nueva.solicitud')}">Nueva
                                    Solicitud</span>
                            </h5>
                            <form th:action="@{/vacaciones/solicitar}" method="post">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-muted"
                                        th:text="${trad.getTraduccion('vacaciones.label.inicio')}">FECHA INICIO</label>
                                    <input type="date" name="fechaInicio" class="form-control form-control-lg"
                                        th:min="${hoy}" required style="border-radius: 10px;">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold text-muted"
                                        th:text="${trad.getTraduccion('vacaciones.label.fin')}">FECHA FIN</label>
                                    <input type="date" name="fechaFin" class="form-control form-control-lg"
                                        th:min="${hoy}" required style="border-radius: 10px;">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"
                                    style="border-radius: 10px;">
                                    <i class="bi bi-send me-2"></i>
                                    <span th:text="${trad.getTraduccion('vacaciones.btn.enviar')}">Enviar</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-header bg-white py-4 border-bottom-0">
                            <h5 class="card-title fw-bold mb-0 text-primary">
                                <i class="bi bi-clock-history me-2"></i>
                                <span th:text="${trad.getTraduccion('vacaciones.historial')}">Historial de
                                    Solicitudes</span>
                            </h5>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Periodo</th>
                                        <th>Días</th>
                                        <th>Estado</th>
                                        <th class="text-end pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="vaca : ${solicitudes}">
                                        <td class="ps-4">
                                            <div class="d-flex flex-column">
                                                <span class="fw-bold text-dark"
                                                    th:if="${vaca.fechaInicio != null and vaca.fechaFin != null}"
                                                    th:text="${#temporals.format(vaca.fechaInicio, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(vaca.fechaFin, 'dd/MM/yyyy')}">
                                                </span>
                                            </div>
                                        </td>

                                        <td th:text="${vaca.totalDias}">0</td>

                                        <td>
                                            <span th:if="${vaca.estado.name() == 'PENDIENTE'}"
                                                class="badge rounded-pill px-3 shadow-sm"
                                                style="background-color: #ffc107; color: #000;">
                                                <i class="bi bi-hourglass-split me-1"></i>
                                                <span
                                                    th:text="${trad.getTraduccion('vacaciones.estado.pendiente')}">Pendiente</span>
                                            </span>

                                            <span th:if="${vaca.estado.name() == 'ACEPTADA'}"
                                                class="badge bg-success rounded-pill px-3 shadow-sm">
                                                <i class="bi bi-check-circle me-1"></i>
                                                <span
                                                    th:text="${trad.getTraduccion('vacaciones.estado.confirmada')}">Confirmada</span>
                                            </span>

                                            <span th:if="${vaca.estado.name() == 'RECHAZADA'}"
                                                class="badge bg-danger rounded-pill px-3 shadow-sm">
                                                <i class="bi bi-x-circle me-1"></i>
                                                <span
                                                    th:text="${trad.getTraduccion('vacaciones.estado.rechazada')}">Rechazada</span>
                                            </span>
                                        </td>

                                        <td class="text-end pe-4">
                                            <div class="d-flex justify-content-end align-items-center">
                                                <form th:if="${vaca.estado.toString() == 'PENDIENTE' or vaca.estado.toString() == 'RECHAZADA'}" 
                                                      th:action="@{/vacaciones/cancelar/{id}(id=${vaca.id})}" method="post">
                                                    <button type="submit" class="btn btn-link text-danger p-0 border-0" onclick="return confirm('¿Deseas eliminar esta solicitud?')">
                                                        <i class="bi bi-trash fs-5"></i>
                                                    </button>
                                                </form>

                                                <span th:if="${vaca.estado.name() == 'ACEPTADA'}" class="text-muted">
                                                    <i class="bi bi-lock-fill"></i>
                                                </span>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(solicitudes)}">
                                        <td colspan="4" class="text-center py-5 text-muted">
                                            <i class="bi bi-calendar2-range fs-1 d-block mb-3"></i>
                                            <span th:text="${trad.getTraduccion('vacaciones.vacia')}">No hay
                                                solicitudes</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}"></div>
    <div sec:authorize="!hasAnyRole('MEDICO', 'RECEPCIONISTA')" th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
