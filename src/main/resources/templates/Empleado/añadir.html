<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></div>
    <title
        th:text="${empleado.id == null ? trad.getTraduccion('empleado.titulo.nuevo') : trad.getTraduccion('empleado.titulo.editar')}">
    </title>
</head>

<body class="bg-light">
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>
    <div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>

    <main th:class="${#authorization.expression('hasRole(''ROLE_MEDICO'')')} ? 'content-medico' : 'content'">
        <div class="container-fluid py-4">
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>

            <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row g-4">
                    <div class="col-lg-12">
                        <div class="card shadow-sm border-0" style="border-radius: 15px;">
                            <div class="card-header bg-white border-0 py-4 px-4 d-flex align-items-center">
                                <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                    <i class="bi bi-person-plus text-primary fs-3"></i>
                                </div>
                                <div>
                                    <h4 class="fw-bold mb-0 text-dark"
                                        th:text="${empleado.id == null ? trad.getTraduccion('empleado.titulo.nuevo') : trad.getTraduccion('empleado.titulo.editar')}">
                                    </h4>
                                    <p class="text-muted small mb-0"
                                        th:text="${trad.getTraduccion('pacientes.lista.subtitulo')}"></p>
                                </div>
                            </div>

                            <div class="card-body p-4">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.nombre')}"></label>
                                        <input type="text" th:field="*{nombre}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.apellidos')}"></label>
                                        <input type="text" th:field="*{apellidos}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.dni')}"></label>
                                        <input type="text" th:field="*{dni}"
                                            class="form-control bg-light border-0 py-2 font-monospace" required>
                                        <div class="mt-2 small text-primary">
                                            <i class="bi bi-info-circle me-1"></i>
                                            <span
                                                th:text="${trad.getTraduccion('empleado.aviso.password') ?: 'La contraseña inicial será el DNI'}"></span>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.email')}"></label>
                                        <input type="email" th:field="*{email}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.telefono')}"></label>
                                        <input type="text" th:field="*{telefono}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.salario')}"></label>
                                        <input type="number" step="0.01" th:field="*{salarioBase}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.rol')}"></label>
                                        <select th:field="*{rol.id}" class="form-select bg-light border-0 py-2"
                                            required>
                                            <option value="" th:text="${trad.getTraduccion('empleado.select.rol')}">
                                            </option>
                                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.turno')}"></label>
                                        <select th:field="*{turno.id}" class="form-select bg-light border-0 py-2"
                                            required>
                                            <option value="" th:text="${trad.getTraduccion('empleado.select.turno')}">
                                            </option>
                                            <option th:each="t : ${turnos}" th:value="${t.id}" th:text="${t.nombre}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.inicio')}"></label>
                                        <input type="time" th:field="*{inicio}"
                                            class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-bold text-secondary text-uppercase"
                                            th:text="${trad.getTraduccion('empleado.label.fin')}"></label>
                                        <input type="time" th:field="*{fin}" class="form-control bg-light border-0 py-2"
                                            required>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-2">
                                <a th:href="@{/empleados}" class="btn btn-light rounded-pill px-4"
                                    th:text="${trad.getTraduccion('boton.cancelar')}"></a>
                                <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">
                                    <i class="bi bi-save me-2"></i>
                                    <span th:text="${trad.getTraduccion('boton.guardar')}"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
