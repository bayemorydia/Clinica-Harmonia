<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></th:block>
    <th:block sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></th:block>
    <th:block sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></th:block>
    <th:block sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></th:block>

    <title th:text="${trad != null ? trad.getTraduccion('mod.nominas.titulo') : 'Listado de Nóminas'}">Listado de Nóminas</title>

    <style>
        .clickable-row { cursor: pointer; transition: background-color 0.2s ease; }
        .clickable-row:hover { background-color: rgba(0, 123, 255, 0.05) !important; }

        .page-link {
            color: #6c757d; border: none; background: #f1f3f5; margin: 0 3px;
            border-radius: 8px !important; width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; transition: all 0.2s ease;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important; color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .select-paginacion-clean {
            display: inline-block; width: 75px; padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem; border: 1px solid #dee2e6; border-radius: 8px;
            appearance: none; cursor: pointer;
        }

        .table-footer { padding: 1.25rem 1.5rem; background-color: #ffffff; border-top: 1px solid #edf2f7; }
    </style>
</head>

<body class="bg-light">

<div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>
<div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
<div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>
<div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>

<main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' :
                     (${#authorization.expression('hasRole(''MEDICO'')')} ? 'content-medico' : 'content')">

    <div class="container-fluid py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1"
                    th:text="${empleado != null} ? |Nóminas de ${empleado.nombre} ${empleado.apellidos}| : 'Mis Nóminas'"></h2>
                <p class="text-muted small mb-0">Gestión y visualización de documentos salariales.</p>
            </div>

            <div class="d-flex gap-2">

                <a th:if="${empleado != null}" sec:authorize="hasAnyRole('ADMINISTRADOR', 'RRHH')"
                   th:href="@{'/nominas/nuevo/' + ${empleado.id}}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg me-1"></i> Nueva Nómina
                </a>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                           placeholder="Buscar nómina por periodo o empleado..." th:value="${query}">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
            <div class="card-body p-0" id="tablaContainer">
                <div th:fragment="tablaNominas">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                            <tr>
                                <th class="ps-4 py-3 border-0 text-secondary small fw-bold">Periodo</th>
                                <th th:if="${empleado == null}" class="py-3 border-0 text-secondary small fw-bold">Empleado</th>
                                <th class="py-3 border-0 text-secondary small fw-bold">Devengado</th>
                                <th class="py-3 border-0 text-secondary small fw-bold">Deducciones</th>
                                <th class="py-3 border-0 text-secondary small fw-bold text-end pe-4">Neto Mensual</th>
                                <th class="py-3 border-0 text-secondary small fw-bold text-center">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${nominas == null or nominas.empty}">
                                <td colspan="6" class="text-center py-5 text-muted">No se han encontrado nóminas.</td>
                            </tr>
                            <tr th:each="nomina : ${nominas}" class="border-bottom clickable-row"
                                th:data-href="@{'/nominas/DetalleNomina/' + ${nomina.id}}">
                                <td class="ps-4 py-3" th:text="${nomina.periodo}"></td>
                                <td th:if="${empleado == null}" th:text="${nomina.empleado.nombre} + ' ' + ${nomina.empleado.apellidos}"></td>
                                <td class="text-success" th:text="${nomina.salarioBase} + ' €'"></td>
                                <td class="text-danger" th:text="${nomina.deducciones} + ' %'"></td>
                                <td class="text-end pe-4 fw-bold text-primary" th:text="${nomina.netoMensual} + ' €'"></td>
                                <td class="text-center">
                                    <a th:href="@{'/nominas/imprimir/' + ${nomina.id}}"
                                       class="btn btn-sm btn-outline-danger rounded-pill px-3" target="_blank"
                                       onclick="event.stopPropagation();">
                                        <i class="bi bi-file-earmark-pdf me-1"></i> PDF
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="table-footer d-flex justify-content-between align-items-center">
                        <div class="text-muted small">
                            Mostrando <span class="fw-bold" th:text="${nominas.size()}">0</span> nóminas
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                <option value="10" th:selected="${size == 10}">10</option>
                                <option value="20" th:selected="${size == 20}">20</option>
                            </select>
                            <nav th:if="${totalPages > 1}">
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                    </li>
                                    <li class="page-item active"><span class="page-link" th:text="${currentPage + 1}">1</span></li>
                                    <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                        <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                    <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                </div>
            </div>
        </div>
    </div>
</main>

<div sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}"></div>
<div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
<div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>
<div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: scripts}"></div>

<script th:inline="javascript">
    function initTableEvents() {
        document.querySelectorAll(".clickable-row").forEach(row => {
            row.addEventListener("click", function () {
                window.location.href = this.getAttribute("data-href");
            });
        });
    }

    function updateTable(page = 0) {
        const query = document.getElementById('searchInput').value;
        const size = document.getElementById('pageSize').value;
        // Ajusta esta URL según tu controlador (ej. si es por empleado o general)
        fetch(`/nominas/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`)
            .then(res => res.text())
            .then(html => {
                document.getElementById('tablaContainer').innerHTML = html;
                initTableEvents();
            });
    }

    function changePage(page) {
        const total = parseInt(document.getElementById('hiddenTotalPages').value);
        if (page >= 0 && page < total) updateTable(page);
    }

    document.addEventListener("DOMContentLoaded", function() {
        initTableEvents();

        // Lógica del botón de pagar todas
        const pagarBtn = document.getElementById("pagarTodasBtn");
        if(pagarBtn) {
            pagarBtn.addEventListener("click", function () {
                if (!confirm("¿Desea generar el lote de nóminas del mes actual?")) return;
                const periodo = `${String(new Date().getMonth() + 1).padStart(2, '0')}/${new Date().getFullYear()}`;
                window.location.href = `/nominas/descargarTodos?periodo=${encodeURIComponent(periodo)}`;
            });
        }

        // Buscador con delay para no saturar
        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', function() {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 500);
        });
    });
</script>
</body>
</html>
