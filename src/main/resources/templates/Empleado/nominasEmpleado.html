<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head sec:authorize="hasRole('RECEPCIONISTA')" th:replace="~{Reutilizable/layoutRecepcion :: head_recepcion}"></head>

<head sec:authorize="!hasRole('RECEPCIONISTA')">
    <meta charset="UTF-8">
    <title>Listado de Nóminas</title>
    <th:block sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></th:block>
    <th:block sec:authorize="hasAnyRole('ADMINISTRADOR', 'RRHH')" th:replace="~{Reutilizable/layout :: head_general}"></th:block>
</head>

<body class="bg-light">

    <div sec:authorize="hasRole('RECEPCIONISTA')">
        <div th:replace="~{Reutilizable/layoutRecepcion :: menu_recepcion}"></div>
    </div>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'RRHH')" th:replace="~{Reutilizable/layout :: menu}"></div>

    <main th:class="${#authorization.expression('hasRole(''RECEPCIONISTA'')')} ? 'content-recepcion' : 
                     (${#authorization.expression('hasRole(''MEDICO'')')} ? 'content-medico' : 'content')">
        
        <div class="container-fluid py-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-primary" 
                        th:text="${empleado != null} ? |Nóminas de ${empleado.nombre} ${empleado.apellidos}| : 'Mis Nóminas'"></h2>
                </div>
                
                <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'RRHH')">
                    <a th:if="${empleado != null}" th:href="@{'/nominas/nuevo/' + ${empleado.id}}" class="btn btn-primary">
                        Nueva Nómina
                    </a>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4 py-3">Periodo</th>
                                    <th class="py-3">Devengado</th>
                                    <th class="py-3">Deducciones</th>
                                    <th class="py-3 text-end pe-4">Líquido</th>
                                    <th class="py-3 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${nominas == null or nominas.empty}">
                                    <td colspan="5" class="text-center py-4">No hay nóminas.</td>
                                </tr>
                                <tr th:each="nomina : ${nominas}">
                                    <td class="ps-4" th:text="${nomina.periodo}"></td>
                                    
                                    <td class="text-success" th:text="${nomina.salarioBase.add(nomina.complementos)} + ' €'"></td>
                                    
                                    <td class="text-danger" th:text="${nomina.deducciones} + ' €'"></td>
                                    
                                    <td class="text-end pe-4 fw-bold" th:text="${nomina.totalPagar} + ' €'"></td>
                                    
                                    <td class="text-center">
                                        <a th:href="@{'/nominas/imprimir/' + ${nomina.id}}" class="btn btn-sm btn-outline-danger" target="_blank">PDF</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div sec:authorize="hasRole('RECEPCIONISTA')">
        <div th:replace="~{Reutilizable/layoutRecepcion :: scripts_recepcion}"></div>
    </div>
    <div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
    <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'RRHH')" th:replace="~{Reutilizable/layout :: scripts}"></div>

</body>
</html>
