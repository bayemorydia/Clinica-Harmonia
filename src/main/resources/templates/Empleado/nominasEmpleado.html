<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Listado de Nóminas</title>

    <style>
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clickable-row:hover {
            background-color: rgba(0, 123, 255, 0.05) !important;
        }

        .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #dee2e6;
        }

        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .table-footer {
            padding: 1.25rem 1.5rem;
            background-color: #ffffff;
            border-top: 1px solid #edf2f7;
        }

        .export-panel {
            background: #e9ecef;
            padding: 5px 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>

<!-- MOVIDO: autorización y menús al body -->
<div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: head_medico}"></div>
<div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: head_general}"></div>
<th:block sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: head_RRHH}"></th:block>

<div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: menu_medico}"></div>
<div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: menu}"></div>
<div th:replace="~{Reutilizable/layout :: menu}"></div>
<div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: menu_RRHH}"></div>

<main th:class="${#authorization.expression('hasRole(''MEDICO'')')} ? 'content-medico' : 'content'">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-1" th:text="|Nóminas de ${empleado.nombre} ${empleado.apellidos}|"></h2>
                <p class="text-muted small mb-0">Gestión y visualización de nóminas del empleado.</p>
            </div>
            <div>
                <a th:href="@{'/nominas/nuevo/' + ${empleado.id}}"
                   class="btn btn-gradient rounded-pill px-4 py-2 text-white shadow-sm"
                   style="background: linear-gradient(90deg, #0d6efd, #6610f2); transition: transform 0.2s, box-shadow 0.2s;">
                    <i class="bi bi-plus-circle me-2"></i> Crear Nómina
                </a>
            </div>
        </div>



        <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
            <div class="card-body p-0" id="tablaContainer">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3 border-0 text-secondary small fw-bold">Periodo</th>
                            <th class="py-3 border-0 text-secondary small fw-bold">Salario Base</th>
                            <th class="py-3 border-0 text-secondary small fw-bold">Complementos</th>
                            <th class="py-3 border-0 text-secondary small fw-bold">Deducciones</th>
                            <th class="py-3 border-0 text-secondary small fw-bold">Total</th>
                            <th class="py-3 border-0 text-secondary small fw-bold text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(nominas)}">
                            <td colspan="6" class="text-center py-5 text-muted">No se han encontrado nóminas.</td>
                        </tr>
                        <tr th:each="nomina : ${nominas}" class="border-bottom clickable-row"
                            th:data-href="@{'/nominas/DetalleNomina/' + ${nomina.id}}">
                            <td class="py-3" th:text="${nomina.periodo}">01/2026</td>
                            <td class="py-3" th:text="${nomina.salarioBase}">1000€</td>
                            <td class="py-3" th:text="${nomina.complementos}">200€</td>
                            <td class="py-3" th:text="${nomina.deducciones}">50€</td>
                            <td class="py-3 fw-bold text-success" th:text="${nomina.totalPagar}">1150€</td>
                            <td class="py-3 text-center">
                                <a th:href="@{'/nominas/imprimir/' + ${nomina.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3" target="_blank">
                                    <i class="bi bi-printer me-1"></i> Imprimir
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="table-footer d-flex justify-content-between align-items-center">
                    <div class="text-muted small">
                        <span class="fw-bold" th:text="${(currentPage * size) + 1}">1</span> a
                        <span class="fw-bold" th:text="${(currentPage * size) + nominas.size()}">10</span>
                        de <span class="fw-bold" th:text="${totalElements}">100</span> nóminas
                    </div>
                </div>
            </div>
        </div>    </div>
</main>

<div sec:authorize="hasRole('MEDICO')" th:replace="~{Reutilizable/layoutMedico :: scripts_medico}"></div>
<div sec:authorize="hasRole('ADMINISTRADOR')" th:replace="~{Reutilizable/layout :: scripts}"></div>
<div sec:authorize="hasRole('RRHH')" th:replace="~{Reutilizable/layoutRRHH :: scripts_RRHH}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".clickable-row").forEach(function (row) {
            row.addEventListener("click", function () {
                window.location.href = this.dataset.href;
            });
        });
    });
</script>

</body>
</html>
