<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('btn.desactivar')}">Confirmar Baja</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0 text-center" style="border-radius: 20px;">
                        <div class="card-body p-5">
                            <div class="mb-4">
                                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-3"
                                th:text="${trad.getTraduccion('paciente.confirmar.titulo')}">¿Estás seguro?</h3>

                            <p class="text-muted mb-4">
                                Estás a punto de desactivar la prueba: <br>
                                <strong class="text-dark" th:text="${prueba.codigo + ' - ' + prueba.nombre}">Código -
                                    Nombre</strong>.
                                <br>Esta prueba ya no aparecerá en el selector médico.
                            </p>

                            <form th:action="@{/pruebas/desactivar}" method="post">
                                <input type="hidden" name="id" th:value="${prueba.id}">
                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-danger btn-lg rounded-pill fw-bold shadow-sm">
                                        <i class="bi bi-person-x me-2"></i>
                                        <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}">Confirmar
                                            Desactivación</span>
                                    </button>
                                    <a th:href="@{/pruebas/listar}"
                                        class="btn btn-light btn-lg rounded-pill fw-bold border">
                                        <span th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</span>
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
