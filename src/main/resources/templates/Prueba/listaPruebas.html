<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.tratamientos')}">Catálogo de Pruebas</title>
    <style>
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clickable-row:hover {
            background-color: rgba(0, 123, 255, 0.05) !important;
        }

        /* Estilos Paginación Idénticos a Paciente */
        .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #dee2e6;
        }

        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .table-footer {
            padding: 1.25rem 1.5rem;
            background-color: #ffffff;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.tratamientos')}">Pruebas Médicas</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('pacientes.lista.subtitulo')}">Gestión de registros del catálogo.</p>
                </div>
                <a th:href="@{/pruebas/nuevo}" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold">
                    <i class="bi bi-plus-lg me-2"></i>
                    <span th:text="${trad.getTraduccion('btn.crear')}">Nueva Prueba</span>
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                                <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                                    th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}"
                                    th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="statusFilter" class="form-select shadow-none" style="border-radius: 8px;"
                                onchange="updateTable(0)">
                                <option value="" th:selected="${activo == null}"
                                    th:text="${trad.getTraduccion('pacientes.filtro.todos')}">Todos los estados</option>
                                <option value="true" th:selected="${activo == true}"
                                    th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activos</option>
                                <option value="false" th:selected="${activo == false}"
                                    th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivos</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                <div class="card-body p-0" id="tablaContainer">

                    <div th:fragment="tablaPruebas">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4 py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('lbl.codigo')}">CÓDIGO</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('lbl.nombre')}">PRUEBA</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('pacientes.tabla.estado')}">ESTADO</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(pruebas)}">
                                        <td colspan="4" class="text-center py-5 text-muted" th:text="${trad.getTraduccion('pacientes.tabla.vacia')}">No hay registros.</td>
                                    </tr>
                                    <tr th:each="p : ${pruebas}" class="border-bottom clickable-row"
                                        th:onclick="|window.location.href='/pruebas/editar/' + ${p.id}|">
                                        <td class="ps-4 py-3 fw-bold text-dark font-monospace" th:text="${p.codigo}"></td>
                                        <td class="py-3 fw-bold text-secondary" th:text="${p.nombre}"></td>
                                        <td class="py-3">
                                            <span th:if="${p.activo}" class="badge rounded-pill bg-success-subtle text-success px-3 py-2" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activo</span>
                                            <span th:unless="${p.activo}" class="badge rounded-pill bg-light text-secondary px-3 py-2" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivo</span>
                                        </td>
                                        <td class="py-3 text-center" onclick="event.stopPropagation();">
                                            <a th:if="${p.activo}" th:href="@{'/pruebas/confirmarDesactivar/' + ${p.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm">
                                                <i class="bi bi-person-x me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}"></span>
                                            </a>
                                            <form th:unless="${p.activo}" th:action="@{'/pruebas/activar/' + ${p.id}}" method="post" style="display:inline;">
                                                <button type="submit" class="btn btn-sm btn-outline-success rounded-pill px-3 shadow-sm">
                                                    <i class="bi bi-person-check me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.activar')}"></span>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="table-footer d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrando</span>
                                <span class="fw-bold" th:text="${totalElements > 0 ? (currentPage * size) + 1 : 0}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.a') ?: 'a'}">a</span>
                                <span class="fw-bold" th:text="${(currentPage * size) + pruebas.size()}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.de')}">de</span>
                                <span class="fw-bold" th:text="${totalElements}"></span>
                                <span th:text="${trad.getTraduccion('mod.tratamientos').toLowerCase()}">pruebas</span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="text-muted small" th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrar</span>
                                    <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                        <option value="10" th:selected="${size == 10}">10</option>
                                        <option value="20" th:selected="${size == 20}">20</option>
                                        <option value="50" th:selected="${size == 50}">50</option>
                                    </select>
                                </div>

                                <nav th:if="${totalPages > 0}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'">
                                                <i class="bi bi-chevron-left"></i>
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}"
                                            th:if="${totalPages > 0 and i >= currentPage - 1 and i <= currentPage + 1}"
                                            th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}">1</a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'">
                                                <i class="bi bi-chevron-right"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const activo = document.getElementById('statusFilter').value;
            const container = document.getElementById('tablaContainer');

            const params = new URLSearchParams({ query, page, size });
            if (activo !== "") params.append("activo", activo);

            fetch(`/pruebas/search?${params.toString()}`)
                .then(r => r.text())
                .then(html => { container.innerHTML = html; })
                .catch(err => console.error("Error:", err));
        }

        function changePage(p) {
            const total = parseInt(document.getElementById('hiddenTotalPages').value);
            if (p >= 0 && p < total) updateTable(p);
        }

        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 400);
        });
    </script>
</body>
</html>
