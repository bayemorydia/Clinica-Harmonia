<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${pruebaMedica.id == null ? trad.getTraduccion('pruebas.form.titulo.nuevo') : trad.getTraduccion('pruebas.form.titulo.editar')}">
        Formulario</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .glass-card {
            background: var(--surface-color);
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-label-custom {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-control-custom {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
            background-color: #fcfcfc;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        }

        .input-group-text-custom {
            border-radius: 12px 0 0 12px;
            border: 1px solid #e0e0e0;
            background-color: #f1f3f5;
            font-weight: bold;
            color: var(--text-muted);
        }

        .btn-pill {
            border-radius: 50px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-pill:hover {
            transform: translateY(-2px);
        }

        .section-header-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-5">
        <div class="container">
            <form th:action="@{/pruebas/guardar}" th:object="${pruebaMedica}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="glass-card overflow-hidden">
                    <div class="p-4 p-lg-5 border-bottom bg-light bg-opacity-50">
                        <div class="d-flex align-items-center">
                            <div class="section-header-icon bg-primary bg-opacity-10 text-primary me-3">
                                <i class="bi bi-clipboard2-pulse-fill fs-4"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold text-dark mb-1"
                                    th:text="${pruebaMedica.id == null ? trad.getTraduccion('pruebas.form.header.nuevo') : trad.getTraduccion('pruebas.form.header.editar')}">
                                    Definir Prueba</h3>
                                <p class="text-muted small mb-0" th:text="${trad.getTraduccion('pruebas.form.subtitulo')}">
                                    Gestión de parámetros técnicos y económicos del catálogo médico.
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 p-lg-5">
                        <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-5 rounded-4 shadow-sm">
                            <i class="bi bi-exclamation-octagon-fill me-3 fs-4"></i>
                            <div th:text="${error}">Mensaje de error</div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3">
                                <h5 class="fw-bold text-dark" th:text="${trad.getTraduccion('pruebas.form.sec1.titulo')}">Información Técnica</h5>
                                <p class="text-muted small" th:text="${trad.getTraduccion('pruebas.form.sec1.desc')}">Identificadores únicos de la prueba.</p>
                            </div>
                            <div class="col-xl-9">
                                <div class="row g-4">
                                    <div class="col-md-4">
                                        <label class="form-label-custom" th:text="${trad.getTraduccion('lbl.codigo')}">Código</label>
                                        <input type="text" th:field="*{codigo}" class="form-control form-control-custom font-monospace" 
                                               placeholder="PRB-000" th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label-custom" th:text="${trad.getTraduccion('lbl.nombre')}">Nombre de la Prueba</label>
                                        <input type="text" th:field="*{nombre}" class="form-control form-control-custom"
                                               th:placeholder="${trad.getTraduccion('pruebas.form.placeholder.nombre')}"
                                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5 opacity-25">

                        <div class="row mb-4">
                            <div class="col-xl-3">
                                <h5 class="fw-bold text-dark" th:text="${trad.getTraduccion('pruebas.form.sec2.titulo')}">Tarifas y Precios</h5>
                                <p class="text-muted small" th:text="${trad.getTraduccion('pruebas.form.sec2.desc')}">Configuración para el módulo de facturación.</p>
                            </div>
                            <div class="col-xl-9">
                                <div class="row g-4">
                                    <div class="col-md-5">
                                        <label class="form-label-custom" th:text="${trad.getTraduccion('lbl.precio')}">Precio Base</label>
                                        <div class="input-group">
                                            <span class="input-group-text input-group-text-custom">€</span>
                                            <input type="number" step="0.01" th:field="*{precio}" 
                                                   class="form-control form-control-custom" style="border-radius: 0 12px 12px 0;"
                                                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''">
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-light p-4 px-lg-5 d-flex justify-content-end gap-3 border-top">
                        <a th:href="@{/pruebas/listar}" class="btn btn-light btn-pill text-secondary"
                           th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-pill shadow-sm">
                            <i class="bi bi-cloud-arrow-up-fill me-2"></i>
                            <span th:text="${trad.getTraduccion('btn.guardar')}">Guardar en Catálogo</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
