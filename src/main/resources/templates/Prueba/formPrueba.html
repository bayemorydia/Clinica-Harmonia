<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${pruebaMedica.id == null ? trad.getTraduccion('btn.crear') : trad.getTraduccion('btn.editar')}">
        Formulario</title>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container-fluid">
            <form th:action="@{/pruebas/guardar}" th:object="${pruebaMedica}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{activo}" />

                <div class="card shadow-sm border-0" style="border-radius: 15px;">
                    <div class="card-header bg-white border-0 py-4 px-4">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                                <i class="bi bi-clipboard2-pulse text-primary fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold text-dark"
                                    th:text="${pruebaMedica.id == null ? 'Definir Nueva Prueba' : 'Modificar Catálogo'}">
                                    Formulario</h3>
                                <p class="mb-0 text-muted small">Configure los detalles técnicos y económicos de la
                                    prueba médica.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        <div th:if="${error}"
                            class="alert alert-danger border-0 d-flex align-items-center mb-4 rounded-pill">
                            <i class="bi bi-exclamation-octagon me-2"></i>
                            <div th:text="${error}"></div>
                        </div>

                        <div class="row mb-5">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary">Información General</h5>
                                <p class="text-muted small">Identificadores del catálogo.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('lbl.codigo')}">Código</label>
                                        <input type="text" th:field="*{codigo}"
                                            class="form-control border-0 bg-light py-2" placeholder="PRB-001"
                                            th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label fw-semibold small text-secondary"
                                            th:text="${trad.getTraduccion('lbl.nombre')}">Nombre de la Prueba</label>
                                        <input type="text" th:field="*{nombre}"
                                            class="form-control border-0 bg-light py-2"
                                            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4 opacity-25">

                        <div class="row">
                            <div class="col-xl-3 col-lg-4">
                                <h5 class="fw-bold text-primary">Coste Económico</h5>
                                <p class="text-muted small">Defina el precio para facturación.</p>
                            </div>
                            <div class="col-xl-9 col-lg-8">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold small text-secondary">Precio Base
                                            (€)</label>
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-light">€</span>
                                            <input type="number" step="0.01" th:field="*{precio}"
                                                class="form-control border-0 bg-light py-2"
                                                th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''">
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precio')}"
                                            th:errors="*{precio}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                        <a th:href="@{/pruebas/listar}" class="btn btn-light px-4 fw-bold text-secondary"
                            th:text="${trad.getTraduccion('btn.cancelar')}">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm"
                            th:text="${trad.getTraduccion('btn.guardar')}">Guardar en Catálogo</button>
                    </div>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>

</html>
