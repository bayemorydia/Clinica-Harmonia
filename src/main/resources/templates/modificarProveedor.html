<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Proveedor | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow border-0">
                    <div class="card-header bg-warning py-3 text-center">
                        <h2 class="h4 mb-0 text-dark"><i class="bi bi-pencil-square me-2"></i>Modificar Proveedor</h2>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/proveedores/actualizar}" th:object="${proveedor}" method="post">
                            
                            <input type="hidden" th:field="*{id}">
                            
                            <input type="hidden" th:field="*{fecha_alta}">

                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre de la Empresa</label>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="cif" class="form-label fw-bold">CIF</label>
                                    <input type="text" id="cif" th:field="*{cif}" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label fw-bold">Teléfono</label>
                                    <input type="tel" id="telefono" th:field="*{telefono}" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="direccion" class="form-label fw-bold">Dirección Fiscal</label>
                                <input type="text" id="direccion" th:field="*{direccion}" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label for="activo" class="form-label fw-bold">Estado del Proveedor</label>
                                <select id="activo" th:field="*{activo}" class="form-select">
                                    <option th:value="true">Activo (Operativo)</option>
                                    <option th:value="false">Inactivo (No operativo)</option>
                                </select>
                            </div>

                            <hr>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning fw-bold shadow-sm">
                                    <i class="bi bi-save me-2"></i>Guardar Cambios
                                </button>
                                <a th:href="@{/proveedores}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">
                        Registrado originalmente el: <span class="fw-bold" th:text="${#temporals.format(proveedor.fecha_alta, 'dd/MM/yyyy')}"></span>
                    </small>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
