<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title
            th:text="${empleado.id == null ? 'Nuevo empleado' : 'Editar empleado'}">
        Formulario Empleado
    </title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <!-- Breadcrumb -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/empleados}">Empleados</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${empleado.id == null ? 'Añadir empleado' : 'Editar empleado'}">
                        Registro
                    </li>
                </ol>
            </nav>
        </div>

        <form th:action="@{/empleados/guardar}" th:object="${empleado}" method="post">
            <!-- Si luego reutilizas para editar, este hidden es clave -->
            <input type="hidden" th:field="*{id}" />
            <!-- Campos de sistema (si tu entidad los usa en formulario) -->
            <input type="hidden" th:field="*{fecha_alta}" />
            <input type="hidden" th:field="*{fecha_baja}" />
            <input type="hidden" th:field="*{activa}" />

            <div class="card shadow-sm border-0" style="border-radius: 15px;">
                <div class="card-header bg-white border-0 py-4 px-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-person-badge text-primary fs-4"></i>
                        </div>
                        <div>
                            <h3 class="mb-0 fw-bold text-dark"
                                th:text="${empleado.id == null ? 'Añadir empleado' : 'Editar empleado'}">
                                Formulario
                            </h3>
                            <p class="mb-0 text-muted small">
                                Gestión de datos del empleado
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-lg-5">

                    <!-- Error general (del try/catch del controller) -->
                    <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                        <i class="bi bi-exclamation-octagon me-2"></i>
                        <div th:text="${error}"></div>
                    </div>

                    <!-- Sección: Datos personales -->
                    <div class="row mb-5">
                        <div class="col-xl-3 col-lg-4">
                            <h5 class="fw-bold text-primary">Información Personal</h5>
                            <p class="text-muted small">Datos identificativos del empleado.</p>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Nombre</label>
                                    <input type="text" th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="Ana">
                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Apellidos</label>
                                    <input type="text" th:field="*{apellidos}"
                                           th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="Gómez López">
                                    <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">DNI / NIE</label>
                                    <input type="text" th:field="*{dni}"
                                           th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="12345678A">
                                    <div class="invalid-feedback" th:errors="*{dni}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Teléfono</label>
                                    <input type="tel" th:field="*{telefono}"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="612345678">
                                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Email</label>
                                    <input type="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="correo@ejemplo.com">
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <!-- Sección: Laboral -->
                    <div class="row">
                        <div class="col-xl-3 col-lg-4">
                            <h5 class="fw-bold text-primary">Datos Laborales</h5>
                            <p class="text-muted small">Departamento, rol y salario.</p>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Departamento</label>
                                    <input type="text" th:field="*{departamento}"
                                           th:classappend="${#fields.hasErrors('departamento')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="Recepción / RRHH / Farmacia">
                                    <div class="invalid-feedback" th:errors="*{departamento}"></div>
                                </div>

                                <!-- Si tú quieres seleccionar rol por desplegable, aquí lo hacemos.
                                     Por ahora lo dejo como input simple porque no me has pasado la lista de roles en el model. -->
                                <label class="form-label fw-semibold small text-secondary">Rol</label>
                                <select th:field="*{rol.id}"
                                        th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid' : ''"
                                        class="form-select border-0 bg-light py-2">
                                    <option value="" disabled th:selected="${empleado.rol == null}">
                                        -- Selecciona un rol --
                                    </option>

                                    <option th:each="r : ${roles}"
                                            th:value="${r.id}"
                                            th:text="${r.nombre}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{rol}"></div>


                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Salario Base</label>
                                    <input type="number" step="0.01" th:field="*{salarioBase}"
                                           th:classappend="${#fields.hasErrors('salarioBase')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2" placeholder="1200.00">
                                    <div class="invalid-feedback" th:errors="*{salarioBase}"></div>
                                </div>



                            </div>
                        </div>
                    </div>

                </div>

                <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                    <a th:href="@{/empleados}" class="btn btn-light px-4 fw-bold text-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                        Guardar Empleado
                    </button>
                </div>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
