<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Empleado | Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-header bg-white">
            <h1 class="h4 text-primary fw-bold">Detalle Empleado</h1>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${empleado.id}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${empleado.nombre}"></span></p>
            <p><strong>Apellidos:</strong> <span th:text="${empleado.apellidos}"></span></p>
            <p><strong>DNI:</strong> <span th:text="${empleado.dni}"></span></p>
            <p><strong>Email:</strong> <span th:text="${empleado.email}"></span></p>
            <p><strong>Teléfono:</strong> <span th:text="${empleado.telefono}"></span></p>
            <p><strong>Departamento:</strong> <span th:text="${empleado.departamento}"></span></p>
            <p><strong>Salario Base:</strong> <span th:text="${empleado.salarioBase}"></span></p>
            <a th:href="@{/empleados}" class="btn btn-link">Volver a lista</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
