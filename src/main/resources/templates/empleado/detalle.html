<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${empleado.nombre} + ' ' + ${empleado.apellidos}">Detalle Empleado</title>
</head>

<body class="bg-light">
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid py-4">

        <!-- ALERTA DE ERROR -->
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4 shadow-sm" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- BREADCRUMB -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/empleados}" th:text="${trad != null ? trad.getTraduccion('empleados.lista.titulo') : 'Empleados'}">Empleados</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${trad != null ? trad.getTraduccion('empleado.detalle.titulo') : 'Detalle'}">Detalle</li>
                </ol>
            </nav>
        </div>

        <!-- FORMULARIO EDICIÓN -->
        <form th:action="@{/empleados/actualizar(id=${empleado.id})}" th:object="${empleado}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="row g-4">
                <!-- IZQUIERDA: INFO PRINCIPAL -->
                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px; overflow: hidden;">
                        <div class="card-header bg-primary py-4 border-0"></div>
                        <div class="card-body text-center position-relative" style="margin-top: -50px;">
                            <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm"
                                 style="width: 100px; height: 100px; border: 5px solid white;">
                                <h1 class="mb-0 fw-bold text-primary" style="font-size: 2.5rem;"
                                    th:text="${#strings.substring(empleado.nombre,0,1)}"></h1>
                            </div>
                            <h4 class="fw-bold mb-1 text-dark"
                                th:text="${empleado.nombre} + ' ' + ${empleado.apellidos}"></h4>
                            <p class="text-muted small mb-4" th:text="${empleado.email}"></p>

                            <div class="px-3 mt-2">
                                <!-- SECCIÓN USUARIO DE ACCESO -->
                                <div th:if="${empleado.usuario != null}" class="mb-4 p-2 rounded-3 bg-light bg-opacity-50 border">
                                    <div class="fw-bold small text-uppercase text-muted mb-1"
                                         th:text="${trad != null ? trad.getTraduccion('empleados.form.usuario') : 'Usuario de acceso'}">Usuario de acceso</div>
                                    <div class="text-primary fw-bold d-flex align-items-center justify-content-center">
                                        <i class="bi bi-person-badge-fill me-2"></i>
                                        <span th:text="${empleado.usuario.username}"></span>
                                    </div>
                                </div>

                                <!-- ESTADO -->
                                <div th:if="*{activa}" class="text-success fw-bold fs-5">
                                    <i class="bi bi-circle-fill me-1 small"></i> Activo
                                </div>
                                <div th:unless="*{activa}" class="text-danger fw-bold fs-5">
                                    <i class="bi bi-circle-fill me-1 small"></i> Inactivo
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-light bg-opacity-50 border-0 py-3 text-center">
                            <small class="text-muted">
                                <span th:text="${trad != null ? trad.getTraduccion('empleado.fecha_alta') : 'Fecha alta'}"></span>:
                                <span class="fw-bold" th:text="${#temporals.format(empleado.fecha_alta, 'dd/MM/yyyy')}"></span>
                            </small>
                        </div>
                    </div>
                </div>

                <!-- DERECHA: DETALLES -->
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        <div class="card-body p-4 p-md-5">

                            <!-- SECCIÓN INFORMACIÓN PERSONAL -->
                            <div class="mb-5">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5 class="fw-bold mb-0 text-primary d-flex align-items-center">
                                            <span class="bg-primary bg-opacity-10 p-2 rounded-3 me-3">
                                                <i class="bi bi-person-lines-fill"></i>
                                            </span>
                                        <span th:text="${trad != null ? trad.getTraduccion('empleado.detalle.seccion.personal') : 'Información Personal'}"></span>
                                    </h5>
                                </div>

                               
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.nombre') : 'Nombre'}"></label>
                                        <input type="text" th:field="*{nombre}" class="form-control rounded-3 bg-light bg-opacity-25" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.apellidos') : 'Apellidos'}"></label>
                                        <input type="text" th:field="*{apellidos}" class="form-control rounded-3 bg-light bg-opacity-25" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">DNI / NIE</label>
                                        <input type="text" th:field="*{dni}" class="form-control rounded-3 font-monospace bg-light bg-opacity-25" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.telefono') : 'Teléfono'}"></label>
                                        <input type="text" th:field="*{telefono}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary">Email</label>
                                        <input type="email" th:field="*{email}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.departamento') : 'Departamento'}"></label>
                                        <input type="text" th:field="*{departamento}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.rol') : 'Rol'}"></label>
                                        <select th:field="*{rol.id}" class="form-select rounded-3 bg-light bg-opacity-25">
                                            <option th:each="r : ${roles}"
                                                    th:value="${r.id}"
                                                    th:text="${r.nombre}"
                                                    th:selected="${empleado.rol != null and r.id == empleado.rol.id}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold text-secondary"
                                               th:text="${trad != null ? trad.getTraduccion('empleado.salarioBase') : 'Salario Base'}"></label>
                                        <input type="number" step="0.01" th:field="*{salarioBase}" class="form-control rounded-3 bg-light bg-opacity-25">
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="card-footer bg-white border-0 p-4 p-md-5 pt-0 text-end">
                            <hr class="my-4 opacity-25">
                            <a th:href="@{/empleados}" class="btn btn-light px-4 fw-bold text-secondary rounded-pill">
                                <span th:text="${trad != null ? trad.getTraduccion('btn.volver') : 'Volver'}">Volver</span>
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-5 py-3 fw-bold shadow-lg transition-all hover-lift">
                                <i class="bi bi-check2-circle me-2"></i>
                                <span th:text="${trad != null ? trad.getTraduccion('btn.guardar') : 'Guardar'}">Guardar</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>

<style>
    .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
    }
    .transition-all {
        transition: all 0.2s ease-in-out;
    }
</style>
</body>
</html>
