<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Empleados | Farmacia</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
            <div>
                <h1 class="h3 mb-0 text-primary fw-bold">
                    <i class="bi bi-person-badge me-2"></i>Lista de Empleados
                </h1>
                <p class="text-muted small mb-0">Gestión de personal de la farmacia</p>
            </div>

            <a th:href="@{/empleados/nuevo}" class="btn btn-success shadow-sm">
                <i class="bi bi-plus-circle me-1"></i> Añadir Empleado
            </a>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Departamento</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <!-- Lista -->
                    <tr th:each="empleado : ${empleados}">
                        <td class="ps-4 fw-bold text-muted" th:text="${empleado.id}">1</td>
                        <td th:text="${empleado.nombre}">Nombre</td>
                        <td th:text="${empleado.apellidos}">Apellidos</td>
                        <td th:text="${empleado.email}">email@x.com</td>
                        <td th:text="${empleado.departamento}">Depto</td>

                        <td class="text-center">
                            <div class="btn-group" role="group" aria-label="Acciones">
                                <!-- Ver -->
                                <a th:href="@{/empleados/detalle/{id}(id=${empleado.id})}"
                                   class="btn btn-sm btn-outline-primary" title="Ver detalles">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <!-- Editar -->
                                <a th:href="@{/empleados/editar/{id}(id=${empleado.id})}"
                                   class="btn btn-sm btn-outline-warning" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <!-- Eliminar (sin th:onclick con Strings) -->
                                <a th:href="@{/empleados/eliminar/{id}(id=${empleado.id})}"
                                   class="btn btn-sm btn-outline-danger btn-delete"
                                   title="Eliminar"
                                   th:attr="data-nombre=${empleado.nombre},data-apellidos=${empleado.apellidos}">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>

                    <!-- Vacío -->
                    <tr th:if="${#lists.isEmpty(empleados)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-info-circle me-2"></i> No hay empleados registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-link text-decoration-none text-secondary">
            <i class="bi bi-arrow-left"></i> Volver al Inicio
        </a>
    </div>
</div>

<script>
    // Confirmación de eliminar segura (Thymeleaf no mete Strings dentro de onclick)
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".btn-delete").forEach(btn => {
            btn.addEventListener("click", (ev) => {
                const nombre = btn.dataset.nombre || "";
                const apellidos = btn.dataset.apellidos || "";
                const ok = confirm(`¿Seguro que quieres borrar a ${nombre} ${apellidos}?`);
                if (!ok) ev.preventDefault();
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
