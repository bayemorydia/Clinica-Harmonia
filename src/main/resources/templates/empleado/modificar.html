<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad != null ? trad.getTraduccion('empleado.form.titulo.editar') : 'Modificar Empleado'}">
        Modificar Empleado
    </title>
</head>

<body>
<div th:replace="~{Reutilizable/layout :: menu}"></div>

<main class="content">
    <div class="container-fluid">

        <!-- Breadcrumb -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/empleados}"
                           th:text="${trad != null ? trad.getTraduccion('empleados.lista.titulo') : 'Empleados'}">
                            Empleados
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${trad != null ? trad.getTraduccion('empleado.form.titulo.editar') : 'Modificar'}">
                        Modificar
                    </li>
                </ol>
            </nav>
        </div>

        <form th:action="@{/empleados/actualizar(id=${empleado.id})}" th:object="${empleado}" method="post">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{fecha_alta}" />
            <input type="hidden" th:field="*{activa}" />

            <div class="card shadow-sm border-0" style="border-radius: 15px;">
                <div class="card-header bg-white border-0 py-4 px-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-10 p-3 rounded-3 me-3">
                            <i class="bi bi-person-gear text-primary fs-4"></i>
                        </div>
                        <div>
                            <h3 class="mb-0 fw-bold text-dark"
                                th:text="${trad != null ? trad.getTraduccion('empleado.form.titulo.editar') : 'Modificar Empleado'}">
                                Modificar Empleado
                            </h3>
                            <p class="mb-0 text-muted small"
                               th:text="${trad != null ? trad.getTraduccion('empleado.form.subtitulo') : 'Actualiza los datos del empleado'}">
                                Actualiza los datos del empleado
                            </p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4 p-lg-5">

                    <!-- Error general -->
                    <div th:if="${error}" class="alert alert-danger border-0 d-flex align-items-center mb-4">
                        <i class="bi bi-exclamation-octagon me-2"></i>
                        <div th:text="${error}"></div>
                    </div>

                    <!-- Sección: Personal -->
                    <div class="row mb-5">
                        <div class="col-xl-3 col-lg-4">
                            <h5 class="fw-bold text-primary"
                                th:text="${trad != null ? trad.getTraduccion('empleado.form.sec.personal') : 'Información Personal'}">
                                Información Personal
                            </h5>
                            <p class="text-muted small"
                               th:text="${trad != null ? trad.getTraduccion('empleado.form.sec.personal.desc') : 'Datos identificativos del empleado.'}">
                                Datos identificativos del empleado.
                            </p>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.nombre') : 'Nombre'}">
                                        Nombre
                                    </label>
                                    <input type="text" th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.apellidos') : 'Apellidos'}">
                                        Apellidos
                                    </label>
                                    <input type="text" th:field="*{apellidos}"
                                           th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">DNI / NIE</label>
                                    <input type="text" th:field="*{dni}"
                                           th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{dni}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.telefono') : 'Teléfono'}">
                                        Teléfono
                                    </label>
                                    <input type="tel" th:field="*{telefono}"
                                           th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Email</label>
                                    <input type="email" th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <hr class="my-4 opacity-25">

                    <!-- Sección: Laboral -->
                    <div class="row">
                        <div class="col-xl-3 col-lg-4">
                            <h5 class="fw-bold text-primary"
                                th:text="${trad != null ? trad.getTraduccion('empleado.form.sec.laboral') : 'Datos Laborales'}">
                                Datos Laborales
                            </h5>
                            <p class="text-muted small"
                               th:text="${trad != null ? trad.getTraduccion('empleado.form.sec.laboral.desc') : 'Departamento, rol y salario.'}">
                                Departamento, rol y salario.
                            </p>
                        </div>

                        <div class="col-xl-9 col-lg-8">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.departamento') : 'Departamento'}">
                                        Departamento
                                    </label>
                                    <input type="text" th:field="*{departamento}"
                                           th:classappend="${#fields.hasErrors('departamento')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{departamento}"></div>
                                </div>

                                <!-- ✅ Rol real (usa roles del model) -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.rol') : 'Rol'}">
                                        Rol
                                    </label>

                                    <select th:field="*{rol.id}"
                                            th:classappend="${#fields.hasErrors('rol')} ? 'is-invalid' : ''"
                                            class="form-select border-0 bg-light py-2">
                                        <option value="" disabled>-- Selecciona un rol --</option>
                                        <option th:each="r : ${roles}"
                                                th:value="${r.id}"
                                                th:text="${r.nombre}"
                                                th:selected="${empleado.rol != null and empleado.rol.id == r.id}">
                                        </option>
                                    </select>

                                    <div class="invalid-feedback" th:errors="*{rol}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.salario') : 'Salario Base'}">
                                        Salario Base
                                    </label>
                                    <input type="number" step="0.01" th:field="*{salarioBase}"
                                           th:classappend="${#fields.hasErrors('salarioBase')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{salarioBase}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary"
                                           th:text="${trad != null ? trad.getTraduccion('empleado.form.fechaBaja') : 'Fecha de baja'}">
                                        Fecha de baja
                                    </label>
                                    <input type="date" th:field="*{fecha_baja}"
                                           th:classappend="${#fields.hasErrors('fecha_baja')} ? 'is-invalid' : ''"
                                           class="form-control border-0 bg-light py-2">
                                    <div class="invalid-feedback" th:errors="*{fecha_baja}"></div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

                <div class="card-footer bg-white border-0 p-4 d-flex justify-content-end gap-3">
                    <a th:href="@{/empleados}" class="btn btn-light px-4 fw-bold text-secondary">
                        <span th:text="${trad != null ? trad.getTraduccion('btn.cancelar') : 'Cancelar'}">Cancelar</span>
                    </a>
                    <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                        <span th:text="${trad != null ? trad.getTraduccion('btn.actualizar') : 'Actualizar'}">Actualizar</span>
                    </button>
                </div>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
