<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.admin.usuarios.titulo')}">Gestión de Usuarios</title>
    <style>
        :root {
            --surface-color: #ffffff;
            --background-color: #f8f9fa;
            --primary-color: #0d6efd;
            --text-main: #212529;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
        }

        /* Card profesional idéntico al de pacientes */
        .glass-card {
            background: var(--surface-color);
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        /* Input de búsqueda estilizado */
        .search-container {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 2px 15px;
            transition: all 0.2s ease;
        }

        .search-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .search-container input {
            border: none;
            box-shadow: none !important;
        }

        /* Tabla Refinada */
        .table thead th {
            background-color: #fcfcfc;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            padding: 16px;
            border-top: none;
        }

        .table tbody td {
            padding: 16px;
            vertical-align: middle;
            border-color: #f1f1f1;
        }

        /* Avatar de usuario similar a la miniatura de paciente */
        .user-avatar {
            width: 40px;
            height: 40px;
            background: #e9ecef;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.2rem;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Badges de estado modernos suaves */
        .badge-pill-custom {
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .bg-success-soft { background-color: #e6f6ec; color: #0f5132; }
        .bg-danger-soft { background-color: #fbe9eb; color: #842029; }

        /* Paginación minimalista */
        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .pagination .page-link {
            border: none;
            background: #f1f3f5;
            color: var(--text-muted);
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .pagination .page-item.active .page-link {
            background-color: var(--primary-color) !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .btn-action {
            border-radius: 50px;
            padding: 5px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content py-5">
        <div class="container-fluid">
            <div class="row align-items-center mb-5">
                <div class="col">
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.admin.usuarios.titulo')}">Gestión de Usuarios</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('usuarios.subtitulo')}">Administra las credenciales y niveles de acceso de la clínica.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="search-container d-flex align-items-center">
                                <i class="bi bi-search text-muted me-2"></i>
                                <input type="text" id="searchInput" class="form-control"
                                    th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="statusFilter" class="form-select border-0 shadow-sm" style="border-radius: 10px; height: 45px;" onchange="updateTable(0)">
                                <option value="" th:selected="${activo == null}" th:text="${trad.getTraduccion('pacientes.filtro.todos')}">Todos</option>
                                <option value="true" th:selected="${activo == true}" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activos</option>
                                <option value="false" th:selected="${activo == false}" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivos</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card overflow-hidden">
                <div id="tablaContainer">
                    <div th:fragment="tablaUsuarios">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th class="ps-4" th:text="${trad.getTraduccion('usuarios.tabla.usuario')}">USUARIO</th>
                                        <th th:text="${trad.getTraduccion('usuarios.tabla.roles')}">ROLES</th>
                                        <th th:text="${trad.getTraduccion('pacientes.tabla.estado')}">ESTADO</th>
                                        <th class="text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(usuarios)}">
                                        <td colspan="4" class="text-center py-5 text-muted" th:text="${trad.getTraduccion('usuarios.vacio')}">No se han encontrado usuarios.</td>
                                    </tr>
                                    <tr th:each="u : ${usuarios}" class="border-bottom">
                                        <td class="ps-4">
                                            <div class="d-flex align-items-center">
                                                <div class="user-avatar me-3">
                                                    <i class="bi bi-person-fill"></i>
                                                </div>
                                                <div>
                                                    <div class="fw-bold text-dark mb-0" th:text="${u.username}">username</div>
                                                    <div class="text-muted small" th:text="${u.empleado != null ? u.empleado.nombre + ' ' + u.empleado.apellidos : (u.paciente != null ? u.paciente.nombre + ' ' + u.paciente.apellidos : trad.getTraduccion('usuarios.sistema'))}">Nombre</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="d-flex flex-wrap gap-1">
                                                <span th:each="r : ${u.roles}" class="badge bg-light text-dark border me-1 fw-normal" style="border-radius: 5px;" th:text="${r.nombre}">ROL</span>
                                            </div>
                                        </td>
                                        <td>
                                            <span th:if="${u.activo}" class="badge-pill-custom bg-success-soft" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activo</span>
                                            <span th:if="${!u.activo}" class="badge-pill-custom bg-danger-soft" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivo</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:if="${u.activo}" th:href="@{'/admin/usuarios/confirmarDesactivar/' + ${u.id}}" class="btn btn-sm btn-outline-danger btn-action">
                                                <i class="bi bi-lock me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}">Baja</span>
                                            </a>
                                            <form th:if="${!u.activo}" th:action="@{'/admin/usuarios/activar/' + ${u.id}}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-success btn-action">
                                                    <i class="bi bi-unlock me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.activar')}">Alta</span>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="p-4 bg-white border-top d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrando</span>
                                <span class="fw-bold text-dark" th:text="${totalElements > 0 ? (currentPage * size) + 1 : 0}"></span> - 
                                <span class="fw-bold text-dark" th:text="${(currentPage * size) + (usuarios != null ? usuarios.size() : 0)}"></span>
                                <span th:text="${trad.getTraduccion('pacientes.paginacion.de')}">de</span>
                                <span class="fw-bold text-dark" th:text="${totalElements}"></span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                    <option value="10" th:selected="${size == 10}">10</option>
                                    <option value="20" th:selected="${size == 20}">20</option>
                                    <option value="50" th:selected="${size == 50}">50</option>
                                </select>

                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'"><i class="bi bi-chevron-left"></i></a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:if="${i >= currentPage - 1 and i <= currentPage + 1}"
                                            th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}"></a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'"><i class="bi bi-chevron-right"></i></a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div> 
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const activo = document.getElementById('statusFilter').value;
            const container = document.getElementById('tablaContainer');

            let url = `/admin/usuarios/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`;
            if (activo !== "") url += `&activo=${activo}`;

            fetch(url)
                .then(r => r.text())
                .then(html => { 
                    container.innerHTML = html; 
                })
                .catch(err => console.error("Error cargando tabla:", err));
        }

        function changePage(p) {
            const totalPages = parseInt(document.getElementById('hiddenTotalPages').value);
            if (p >= 0 && p < totalPages) updateTable(p);
        }

        let timeout = null;
        document.getElementById('searchInput').addEventListener('keyup', () => {
            clearTimeout(timeout);
            timeout = setTimeout(() => updateTable(0), 400);
        });
    </script>
</body>
</html>
