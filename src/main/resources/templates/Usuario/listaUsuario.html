<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title th:text="${trad.getTraduccion('mod.admin.usuarios.titulo')}">Gestión de Usuarios</title>
    <style>
        .clickable-row {
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .clickable-row:hover {
            background-color: rgba(0, 123, 255, 0.05) !important;
        }

        /* Estilos Paginación */
        .page-link {
            color: #6c757d;
            border: none;
            background: #f1f3f5;
            margin: 0 3px;
            border-radius: 8px !important;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .page-item.active .page-link {
            background-color: #0d6efd !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.2);
        }

        .page-item.disabled .page-link {
            background-color: #f8f9fa;
            color: #dee2e6;
        }

        .select-paginacion-clean {
            display: inline-block;
            width: 75px;
            padding: 0.375rem 1.75rem 0.375rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            appearance: none;
            cursor: pointer;
        }

        .table-footer {
            padding: 1.25rem 1.5rem;
            background-color: #ffffff;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>

<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="${trad.getTraduccion('mod.admin.usuarios.titulo')}">Cuentas de Usuario</h2>
                    <p class="text-muted small mb-0" th:text="${trad.getTraduccion('mod.admin.usuarios.desc')}">Control de accesos y estados de cuenta.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none"
                            th:placeholder="${trad.getTraduccion('citas.placeholder.buscar')}" th:value="${query}">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                <div class="card-body p-0" id="tablaContainer">

                    <div th:fragment="tablaUsuarios">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4 py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('rol.nombre')}">USUARIO</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('mod.admin.roles.titulo')}">ROLES</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold" th:text="${trad.getTraduccion('pacientes.tabla.estado')}">ESTADO</th>
                                        <th class="py-3 border-0 text-secondary small fw-bold text-center" th:text="${trad.getTraduccion('pacientes.tabla.acciones')}">ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(usuarios)}">
                                        <td colspan="4" class="text-center py-5 text-muted">No se han encontrado usuarios.</td>
                                    </tr>
                                    <tr th:each="u : ${usuarios}" class="border-bottom">
                                        <td class="ps-4 py-3">
                                            <div class="d-flex align-items-center">
                                                <div class="bg-dark bg-opacity-10 text-dark rounded-circle d-flex align-items-center justify-content-center me-3"
                                                    style="width: 40px; height: 40px;">
                                                    <i class="bi bi-person-fill"></i>
                                                </div>
                                                <div>
                                                    <div class="fw-bold text-dark mb-0" th:text="${u.username}">username</div>
                                                    <div class="text-muted small" th:text="${u.empleado != null ? u.empleado.nombre : (u.paciente != null ? u.paciente.nombre : 'Sistema')}">Nombre Real</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="py-3">
                                            <span th:each="r : ${u.roles}" 
                                                  class="badge bg-light text-dark border me-1 fw-normal" 
                                                  th:text="${r.nombre}">ROL</span>
                                        </td>
                                        <td class="py-3">
                                            <span th:if="${u.activo}" class="badge rounded-pill bg-success-subtle text-success px-3 py-2"
                                                style="font-size: 0.75rem;" th:text="${trad.getTraduccion('pacientes.estado.activo')}">Activo</span>
                                            <span th:if="${!u.activo}" class="badge rounded-pill bg-danger-subtle text-danger px-3 py-2"
                                                style="font-size: 0.75rem;" th:text="${trad.getTraduccion('pacientes.estado.inactivo')}">Inactivo</span>
                                        </td>
                                        <td class="py-3 text-center">
                                            <a th:if="${u.activo}" th:href="@{'/admin/usuarios/confirmarDesactivar/' + ${u.id}}"
                                                class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-lock me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.desactivar')}">Desactivar</span>
                                            </a>
                                            <a th:if="${!u.activo}" th:href="@{'/admin/usuarios/activar/' + ${u.id}}"
                                                class="btn btn-sm btn-outline-success rounded-pill px-3">
                                                <i class="bi bi-unlock me-1"></i> <span th:text="${trad.getTraduccion('pacientes.btn.activar')}">Activar</span>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="table-footer d-flex justify-content-between align-items-center">
                            <div class="text-muted small">
                                <span class="fw-bold" th:text="${(currentPage * size) + 1}">1</span> a
                                <span class="fw-bold" th:text="${(currentPage * size) + (usuarios != null ? usuarios.size() : 0)}">10</span>
                                de <span class="fw-bold" th:text="${totalElements}">100</span> 
                                <span th:text="${trad.getTraduccion('mod.admin.usuarios.titulo').toLowerCase()}">usuarios</span>
                            </div>

                            <div class="d-flex align-items-center gap-4">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="text-muted small" th:text="${trad.getTraduccion('pacientes.tabla.mostrar')}">Mostrar</span>
                                    <select id="pageSize" class="select-paginacion-clean shadow-none" onchange="updateTable(0)">
                                        <option value="10" th:selected="${size == 10}">10</option>
                                        <option value="20" th:selected="${size == 20}">20</option>
                                        <option value="50" th:selected="${size == 50}">50</option>
                                    </select>
                                </div>

                                <nav>
                                    <ul class="pagination pagination-sm mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} - 1) + ')'">
                                                <i class="bi bi-chevron-left"></i>
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}"
                                            th:if="${totalPages > 0 and i >= currentPage - 1 and i <= currentPage + 1}"
                                            th:classappend="${i == currentPage} ? 'active'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + ${i} + ')'" th:text="${i + 1}">1</a>
                                        </li>
                                        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                            <a class="page-link" href="javascript:void(0)" th:onclick="'changePage(' + (${currentPage} + 1) + ')'">
                                                <i class="bi bi-chevron-right"></i>
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                        <input type="hidden" id="hiddenTotalPages" th:value="${totalPages}">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            let searchTimeout;
            const searchInput = document.getElementById('searchInput');

            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => updateTable(0), 400);
            });
        });

        function updateTable(page = 0) {
            const query = document.getElementById('searchInput').value;
            const size = document.getElementById('pageSize').value;
            const container = document.getElementById('tablaContainer');

            fetch(`/admin/usuarios/search?query=${encodeURIComponent(query)}&page=${page}&size=${size}`)
                .then(response => response.text())
                .then(html => {
                    container.innerHTML = html;
                })
                .catch(err => console.error("Error actualizando la tabla:", err));
        }

        function changePage(page) {
            const totalPagesInput = document.getElementById('hiddenTotalPages');
            const totalPages = totalPagesInput ? parseInt(totalPagesInput.value) : 0;

            if (page < 0 || page >= totalPages) return;
            updateTable(page);
        }
    </script>
</body>
</html>
