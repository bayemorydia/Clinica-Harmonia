<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Proveedores | Farmacia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
                <div>
                    <h1 class="h3 mb-0 text-primary fw-bold">
                        <i class="bi bi-truck me-2"></i>Lista de Proveedores
                    </h1>
                    <p class="text-muted small mb-0">Gestión de suministros y contactos comerciales</p>
                </div>
                <a th:href="@{/proveedores/nuevo}" class="btn btn-success shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Añadir Proveedor
                </a>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nombre Comercial</th>
                                <th>CIF</th>
                                <th>Contacto</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="proveedor : ${proveedores}">
                                <td class="ps-4 fw-bold text-muted" th:text="${proveedor.id}"></td>
                                <td>
                                    <div class="fw-bold" th:text="${proveedor.nombre}"></div>
                                    <div class="small text-muted" th:text="${proveedor.direccion}"></div>
                                </td>
                                <td th:text="${proveedor.cif}"></td>
                                <td>
                                    <div class="small"><i class="bi bi-telephone me-1"></i> <span
                                            th:text="${proveedor.telefono}"></span></div>
                                    <div class="small"><i class="bi bi-envelope me-1"></i> <span
                                            th:text="${proveedor.email}"></span></div>
                                </td>
                                <td>
                                    <span
                                        th:class="${proveedor.activo} ? 'badge rounded-pill bg-success' : 'badge rounded-pill bg-danger'"
                                        th:text="${proveedor.activo} ? 'Activo' : 'Inactivo'"></span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/proveedores/{id}(id=${proveedor.id})}"
                                            class="btn btn-sm btn-outline-primary" title="Ver Detalles">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}"
                                            class="btn btn-sm btn-outline-warning" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-outline-danger"
                                            th:onclick="'confirmarEliminar(' + ${proveedor.id} + ')'" title="Eliminar">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(proveedores)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-info-circle me-2"></i> No hay proveedores registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/}" class="btn btn-link text-decoration-none text-secondary">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </div>

    <script>
        function confirmarEliminar(id) {
            if (confirm("¿Estás seguro de que deseas eliminar permanentemente este proveedor? Esta acción no se puede deshacer.")) {
                window.location.href = "/proveedores/eliminar/" + id;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
