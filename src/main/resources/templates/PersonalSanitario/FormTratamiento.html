<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Tratamiento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0" th:text="${tratamiento.id != null} ? 'Editar Tratamiento' : 'Nuevo Tratamiento'"></h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/tratamientos/guardar}" th:object="${tratamiento}" method="post">
                        
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Descripción del Tratamiento</label>
                            <input type="text" th:field="*{descripcion}" class="form-control" required />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha de Inicio</label>
                                <input type="date" th:field="*{fechaInicio}" class="form-control" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha de Fin</label>
                                <input type="date" th:field="*{fechaFin}" class="form-control" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Indicaciones Médicas</label>
                            <textarea th:field="*{indicaciones}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mt-4 text-end">
                            <a th:href="@{/tratamientos/listar}" class="btn btn-outline-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Guardar Tratamiento</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
