<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Datos del Tratamiento</title>
</head>

<body class="bg-light">
    <div th:replace="~{Reutilizable/layout :: menu}"></div>

    <main class="content">
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0" style="border-radius: 15px;">
                        
                        <div class="card-header bg-white border-0 pt-4 pb-0 px-4">
                            <h4 class="fw-bold text-primary">
                                <i class="bi bi-activity me-2"></i>
                                <span th:text="${tratamiento.id != null} ? 'Editar Tratamiento' : 'Nuevo Tratamiento'">Tratamiento</span>
                            </h4>
                        </div>

                        <div class="card-body p-4">
                            <form th:action="@{/tratamientos/guardar}" th:object="${tratamiento}" method="post" novalidate>
                                
                                <input type="hidden" th:field="*{id}" />

                                <div class="mb-3">
                                    <label for="nombre" class="form-label small fw-bold text-muted text-uppercase">Nombre del Tratamiento</label>
                                    <input type="text" class="form-control rounded-3 py-2" id="nombre" 
                                           th:field="*{nombre}" 
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           placeholder="Ej: Fisioterapia Respiratoria">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="precio" class="form-label small fw-bold text-muted text-uppercase">Precio (€)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                                        <input type="number" step="0.01" class="form-control border-start-0 rounded-end py-2" id="precio" 
                                               th:field="*{precio}"
                                               th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''"
                                               placeholder="0.00">
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="descripcion" class="form-label small fw-bold text-muted text-uppercase">Descripción</label>
                                    <textarea class="form-control rounded-3" id="descripcion" rows="4" 
                                              th:field="*{descripcion}"
                                              th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"
                                              placeholder="Detalles del servicio..."></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                                </div>

                                <div class="d-flex gap-2 pt-2">
                                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm flex-grow-1">
                                        <i class="bi bi-save me-2"></i> Guardar
                                    </button>
                                    <a th:href="@{/tratamientos/listar}" class="btn btn-light rounded-pill px-4 fw-bold border">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
</body>
</html>
