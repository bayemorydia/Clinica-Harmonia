<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{Reutilizable/layout :: head_general}"></div>
    <title>Catálogo de Tratamientos</title>
    <style>
        .clickable-row { cursor: pointer; transition: background-color 0.2s ease; }
        .clickable-row:hover { background-color: rgba(13, 110, 253, 0.05) !important; }
        .table-footer { padding: 1.25rem 1.5rem; background-color: #ffffff; border-top: 1px solid #edf2f7; }
        .icon-box-treat {
            width: 40px; height: 40px;
            background-color: rgba(13, 110, 253, 0.1);
            color: #0d6efd; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div th:replace="~{Reutilizable/layout :: menu}"></div>
    <main class="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Catálogo de Tratamientos</h2>
                    <p class="text-muted small mb-0">Haga clic en una fila para editar el tratamiento.</p>
                </div>
                <a th:href="@{/tratamientos/nuevo}" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold">
                    <i class="bi bi-plus-circle me-2"></i> Nuevo Tratamiento
                </a>
            </div>

            <div class="card shadow-sm border-0 mb-4" style="border-radius: 15px;">
                <div class="card-body">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0 ps-0 shadow-none" placeholder="Buscar por nombre o descripción...">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm border-0" style="border-radius: 15px; overflow: hidden;">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tratamientosTable">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4 py-3 border-0 text-secondary small fw-bold">TRATAMIENTO</th>
                                    <th class="py-3 border-0 text-secondary small fw-bold">PRECIO</th>
                                    <th class="py-3 border-0 text-secondary small fw-bold text-center">ESTADO</th>
                                    <th class="py-3 border-0 text-secondary small fw-bold text-center">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${tratamientos}" class="border-bottom clickable-row" th:data-href="@{'/tratamientos/editar/' + ${t.id}}">
                                    <td class="ps-4 py-3">
                                        <div class="d-flex align-items-center">
                                            <div class="icon-box-treat me-3"><i class="bi bi-activity"></i></div>
                                            <div>
                                                <div class="fw-bold text-dark mb-0" th:text="${t.nombre}"></div>
                                                <div class="text-muted small" th:text="${#strings.abbreviate(t.descripcion, 60)}"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="py-3 fw-bold text-primary" th:text="${#numbers.formatDecimal(t.precio, 1, 2)} + ' €'"></td>
                                    <td class="py-3 text-center">
                                        <span th:if="${t.activo}" class="badge rounded-pill bg-success-subtle text-success px-3 py-2">Activo</span>
                                        <span th:if="${!t.activo}" class="badge rounded-pill bg-light text-secondary px-3 py-2">Inactivo</span>
                                    </td>
                                    <td class="py-3 text-center">
                                        <div onclick="event.stopPropagation();">
                                            <a th:if="${t.activo}" th:href="@{'/tratamientos/desactivar/' + ${t.id}}" class="btn btn-sm btn-outline-danger rounded-pill px-3">
                                                <i class="bi bi-slash-circle me-1"></i> Desactivar
                                            </a>
                                            <a th:if="${!t.activo}" th:href="@{'/tratamientos/activar/' + ${t.id}}" class="btn btn-sm btn-outline-success rounded-pill px-3">
                                                <i class="bi bi-check-circle me-1"></i> Activar
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-footer">
                        <div class="text-muted small">Mostrando <span th:text="${#lists.size(tratamientos)}"></span> servicios en catálogo.</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{Reutilizable/layout :: scripts}"></div>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", () => {
            // Navegación por fila
            document.querySelectorAll(".clickable-row").forEach(row => {
                row.addEventListener("click", function (e) {
                    if (!e.target.closest('a')) window.location.href = this.getAttribute("data-href");
                });
            });
            // Buscador
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                document.querySelectorAll("#tratamientosTable tbody tr").forEach(row => {
                    row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
                });
            });
        });
    </script>
</body>
</html>
