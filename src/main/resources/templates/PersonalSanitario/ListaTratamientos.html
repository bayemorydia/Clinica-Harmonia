<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Tratamientos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-clipboard2-pulse text-danger"></i> Listado de Tratamientos</h2>
        <a th:href="@{/tratamientos/nuevo}" class="btn btn-danger">Nuevo Tratamiento</a>
    </div>

    <table class="table table-hover border shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>Descripción</th>
                <th>Fecha Inicio</th>
                <th>Fecha Fin</th>
                <th>Indicaciones</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${tratamientos}">
                <td th:text="${t.descripcion}"></td>
                <td th:text="${t.fechaInicio}"></td>
                <td th:text="${t.fechaFin}"></td>
                <td th:text="${t.indicaciones}"></td>
                <td>
                    <a th:href="@{/tratamientos/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/tratamientos/eliminar/{id}(id=${t.id})}" 
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Eliminar este tratamiento?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Panel</a>
    </div>

</body>
</html>
