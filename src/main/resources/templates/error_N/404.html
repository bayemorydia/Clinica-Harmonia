<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada (404)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e2e6ea; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .card { max-width: 500px; padding: 40px; border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }

    </style>
</head>
<body>

        <div class="mt-4">
            <a href="/" class="btn btn-primary rounded-pill px-4 shadow-sm fw-bold">Volver al Inicio</a>
        </div>
    </div>

</html>
